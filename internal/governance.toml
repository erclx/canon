# The governance subset this repository consumes into `.claude/rules/`.
#
# The toolkit authors every stack and installs one of them into its own
# sessions. Without this record the producer would read `.claude/rules/` to
# decide what `.claude/rules/` should hold, deriving intent from its own
# output. Naming the stack here makes the regen deterministic and makes a
# deliberate addition show up in a diff.
#
# Rules under `internal/rules/` install alongside these and need no entry.

# The `ui` rules are added because this repository renders surfaces of its own,
# being design token previews, slide decks, capture sources, and teach lessons,
# none of which is a framework route. `e2e-reliability` governs the driven
# capture those surfaces are verified with.

# `python` is added because sessions here write Python for groundwork
# spikes and occasional skill scripts, and the `node` stack alone never loads it.

# `skill`, the `tooling` rules, and `design-taste`, `interface-casing`,
# and `motion` are added because base names its rules one by one and none
# of them is among the ten, while this repository edits skills, workflows,
# configs, and code, and renders the surfaces the newer `ui` rules govern.

# `test-scope` is left out because it names `bun run test:e2e:changed`,
# which no script in this repository's `package.json` carries.

stack = "node"
add = [
  "python",
  "e2e-reliability",
  "copy",
  "a11y",
  "keyboard",
  "pointer",
  "forms",
  "ux-completeness",
  "ux-controls",
  "surface-capture",
  "link-behavior",
  "design-taste",
  "interface-casing",
  "motion",
  "ci-workflow",
  "dependencies",
  "config-comments",
  "code-comments",
  "skill",
]
