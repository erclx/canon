name: Toolkit feedback
description: Report something broken, missing, or off in the toolkit
title: 'feedback: '
labels: ['feedback']
# The web mirror of the report `canon feedback` validates. A submission renders
# each label as a `### <label>` section, which is the shape the CLI parses, so
# both routes reach triage as one document. `required` here mirrors
# REQUIRED_FIELDS in src/commands/feedback-format.ts, which is where the list is
# spelled and where every report filed through the CLI is checked against it.
body:
  - type: input
    id: project
    attributes:
      label: From project
      description: The project's name or kind, such as "a Next.js app". Not a full path, which names a folder on one machine.
    validations:
      required: false
  - type: input
    id: surface
    attributes:
      label: Surface
      description: Toolkit surface and its type, such as plugin skill, CLI, or seed
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected, or "unclear"
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Commands or steps that reproduce it, or "none"
    validations:
      required: false
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: One line if you have one, or "open"
    validations:
      required: true
