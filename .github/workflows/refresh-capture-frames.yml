name: Refresh Home Baseline
# canon-no-seed: recaptures this checkout's own home page baseline. Seeding it
# as-is would have a target capture a page it does not carry.

on:
  push:
    branches:
      - main
    paths:
      # The inputs to the home render, web/ and the poster in assets/loops/.
      # The rest of assets/** holds this job's output and would loop it.
      - 'web/**'
      - 'assets/loops/**'
      - 'scripts/core/capture-home.sh'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One refresh at a time, and a newer merge supersedes an older run. A run renders
# from the commit that started it rather than main HEAD, so its push step moves
# the baseline onto main as fetched at push time before force-updating the branch.
concurrency:
  group: refresh-capture-frames
  cancel-in-progress: true

jobs:
  refresh:
    name: 🖼️ Refresh Home Baseline
    # A dispatch on any other ref would force-push that ref's whole diff into
    # the open refresh pull request under a chore title.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Not GITHUB_TOKEN, which opens a pull request no check ever runs on
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # The health section charts merges a week, which a shallow clone cannot read.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      # The home baseline `canon pr evidence` compares a page change against.
      # pr-visual-checks.yml runs the same script and reports whether it matches.
      - name: Capture Home Baseline
        run: bash scripts/core/capture-home.sh

      # The script holds the commit, rebase onto main, and pull request logic.
      # The token stays here so its scope reads off the workflow.
      - name: Open or Update the Refresh Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HUSKY: 0
        run: scripts/ci/refresh-frames-pr.sh
