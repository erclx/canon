name: Refresh Capture Frames
# canon-no-seed: regenerates this checkout's own landing-page frames from its
# own catalogs. Seeding it as-is would have a target regenerate frames it does
# not carry.

on:
  push:
    branches:
      - main
    paths:
      # The count and token inputs regen-hero.sh reads. The frames themselves
      # are not listed, so the refresh pull request merging does not start
      # another run.
      - 'src/design/**'
      - 'src/cli.ts'
      # The command count comes from the registered set, and a module here is
      # what registers one, so a branch adding a command moves the frame
      # without touching src/cli.ts.
      - 'src/commands/**'
      - 'governance/rules/**'
      - 'standards/**'
      - 'snippets/**'
      - 'claude/skills/**'
      - 'tooling/**'
      - 'assets/brand/mark.svg'
      - 'assets/captures/*.tmpl'
      - 'scripts/core/regen-hero.sh'
      # The inputs to the home render the hero frames do not share. The page is
      # built from web/ and reads its counts from the audit catalog under
      # src/audits/. assets/** stays off the list, since it holds the outputs
      # this job writes and would start a run from its own merge.
      - 'web/**'
      - 'src/audits/**'
      - 'scripts/core/capture-home.sh'
      # The version canon --version reads into the footer and nav of the home
      # page, so a release merge moves the baseline.
      - 'package.json'
      # GOV_STACK_COUNT in regen-hero.sh and the stacks web/src/lib/session.ts
      # reads, so a stack-only merge moves both renders.
      - 'governance/stacks/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One refresh at a time, and a newer merge supersedes an older run. A run renders
# from the commit that started it rather than main HEAD, so its push step moves
# the frames onto main as fetched at push time before force-updating the branch.
concurrency:
  group: refresh-capture-frames
  cancel-in-progress: true

jobs:
  refresh:
    name: 🖼️ Refresh Frames
    # A dispatch on any other ref would force-push that ref's whole diff into
    # the open refresh pull request under a chore title.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Not GITHUB_TOKEN, which opens a pull request no check ever runs on
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # The frames declare Noto Sans Mono, which the runner lacks, and the capture guard refuses a fallback render
      - name: Install Frame Font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-mono

      # Family from src/design/tokens.ts MONO, checked by name so a missing face fails here
      - name: Check Frame Font
        run: |
          family="Noto Sans Mono"
          if ! fc-list "$family" | grep -q .; then
            echo "::error::Font family '$family' does not resolve on this runner."
            exit 1
          fi

      # Exits 2 with no output on about one run in five on WSL2, so it retries
      # once and then fails loudly rather than leaving a refresh nobody sees.
      - name: Regenerate Frame Markup
        run: bash scripts/core/regen-hero.sh || bash scripts/core/regen-hero.sh

      # Only when the markup moved. A capture rewrites every image and stamp, and
      # a runner's chromium bytes differ from the committed ones, so capturing
      # unconditionally would open a pull request on every push to main.
      - name: Capture Frames
        run: |
          if [ -z "$(git status --porcelain assets/captures)" ]; then
            echo "Markup is current, nothing to capture."
            exit 0
          fi
          bun src/cli.ts capture assets/captures --selector .window --out assets/evidence

      # The home baseline `canon pr evidence` compares a page change against.
      # pr-visual-checks.yml runs the same script and reports whether its frames
      # match, so a merge that moves the render leaves a reviewed pull request
      # behind it instead of a stale baseline. It writes under assets/evidence,
      # which the status check and the add below already cover.
      - name: Capture Home Baseline
        run: bash scripts/core/capture-home.sh

      # Hooks off, since pre-push runs a check whose format step needs shfmt, which the runner lacks. verify.yml checks the pull request.
      # The frames commit where they rendered, then carry across as whole files
      # onto main fetched now, so a merge landing mid-run cannot leave the
      # branch on an older base. The pull request resolves by number, since
      # every merged refresh leaves a closed one on the same head.
      - name: Open or Update the Refresh Pull Request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HUSKY: 0
        run: |
          if [ -z "$(git status --porcelain assets/captures assets/evidence)" ]; then
            echo "Frames are current, nothing to refresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/captures assets/evidence
          git commit -m "chore(web): refresh capture frames"
          rendered=$(git rev-parse HEAD)
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B chore/refresh-capture-frames origin/main
          git checkout "$rendered" -- assets/captures assets/evidence
          if git diff --cached --quiet -- assets/captures assets/evidence; then
            echo "Main already carries these frames, nothing to refresh."
            exit 0
          fi
          git commit -m "chore(web): refresh capture frames"
          git push --force origin chore/refresh-capture-frames
          number=$(gh pr list --head chore/refresh-capture-frames --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head chore/refresh-capture-frames \
              --title "chore(web): refresh capture frames" \
              --body "## Key Changes

          - Regenerates the count and token bearing frames, their images, and their stamps from main.
          - Recaptures the home page baseline under assets/evidence/home.
          - Merges itself by squash once its required check passes."
            number=$(gh pr list --head chore/refresh-capture-frames --state open --json number --jq '.[0].number')
          fi
          # Every run, so a force-push from a later run leaves it queued either way
          gh pr merge "$number" --auto --squash
