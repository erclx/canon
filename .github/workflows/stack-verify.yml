name: Stack Verify
# canon-no-seed: scaffolds every stack from this checkout's own tooling and opens issues on this repository. A target has no stack catalog to verify and would file issues against a verb it does not run.

on:
  schedule:
    # Beside the advisory audit in verify.yml, so both weekly signals land together
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 🧪 Verify ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      # One red stack must not hide the result of the others
      fail-fast: false
      matrix:
        # Only the stacks that scaffold. A layer or an add-on is refused by the verb.
        # Keep in step with the stack list in the report job's loop
        stack: [astro, nextjs, vite-react, go, php, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        if: matrix.stack == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Check Go
        if: matrix.stack == 'go'
        run: |
          go version
          # The stack's prepare installs golangci-lint here, off the runner's PATH
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Read Runner Image
        if: contains(fromJSON('["astro","nextjs","vite-react"]'), matrix.stack)
        id: image
        run: |
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "key=playwright-apt-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Only warm-apt-cache.yml saves, since a pull request's cache is scoped to its merge ref
      - name: Restore Apt Archives
        if: contains(fromJSON('["astro","nextjs","vite-react"]'), matrix.stack)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ steps.image.outputs.key }}
          restore-keys: playwright-apt-${{ steps.image.outputs.os }}-

      # Latest, since the scaffold's Sync adds an unpinned @playwright/test
      - name: Install Playwright System Dependencies
        if: contains(fromJSON('["astro","nextjs","vite-react"]'), matrix.stack)
        timeout-minutes: 10
        run: scripts/ci/install-playwright-deps.sh --archives "$HOME/.cache/apt-archives" --package playwright@latest chromium firefox webkit

      - name: Install Playwright Browsers
        if: contains(fromJSON('["astro","nextjs","vite-react"]'), matrix.stack)
        run: bunx playwright@latest install chromium firefox webkit

      - name: Check PHP and Composer
        if: matrix.stack == 'php'
        run: |
          php --version
          composer --version

      - name: Install uv
        if: matrix.stack == 'python'
        run: pipx install uv

      - name: Verify stack
        id: verify
        run: bun src/cli.ts tooling verify ${{ matrix.stack }}

      - name: Record result
        if: always()
        run: |
          mkdir -p result
          echo "${{ steps.verify.outcome }}" > "result/${{ matrix.stack }}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.stack }}
          path: result/${{ matrix.stack }}
          retention-days: 1

  report:
    name: 📣 Report
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only job that writes, and only issues
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Open, update, or close issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Keep in step with the matrix above. A stack missing here gets no issue.
        run: scripts/ci/stack-issues.sh astro nextjs vite-react go php python
