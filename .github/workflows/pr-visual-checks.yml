name: PR Visual Checks
# canon-no-seed: builds and captures this checkout's own landing page. Seeding
# it as-is would have a target run these two jobs against a page it never
# built.

on:
  pull_request:
    paths:
      # Mirrors deploy-site.yml's own list. A page whose numbers are read at
      # build time goes stale when a catalog moves, not only when web/ is
      # edited, so the catalogs it reads are on this list beside the page
      # itself. Question 2 in .canon/plans/archive/feature-render-visibility.md
      # names the two literal copies rather than a single shared source.
      - 'web/**'
      - 'assets/**'
      - 'src/design/**'
      - 'governance/rules/**'
      - 'standards/**'
      - 'snippets/**'
      - 'claude/skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright System Dependencies
        run: bunx playwright install-deps chromium firefox webkit

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium firefox webkit

      - name: Verify Playwright Browsers Restored
        run: |
          for browser in chromium firefox webkit; do
            ls ~/.cache/ms-playwright 2>/dev/null | grep -q "^${browser}-" || {
              echo "Missing Playwright browser: ${browser}" >&2
              exit 1
            }
          done

      - name: Run E2E Tests
        run: bun run web:e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  capture:
    name: 📸 Landing Page Capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright System Dependencies
        run: bunx playwright install-deps chromium

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Verify Playwright Browsers Restored
        run: |
          ls ~/.cache/ms-playwright 2>/dev/null | grep -q "^chromium-" || {
            echo "Missing Playwright browser: chromium" >&2
            exit 1
          }

      - name: Build
        run: bun run web:build

      - name: Build gallery
        run: bun run web:gallery

      - name: Verify gallery excluded from build
        run: ./scripts/core/check-gallery-exclusion.sh

      # `tooling/web/configs/e2e/screenshot.ts` is reused as is (Constraints,
      # .canon/plans/archive/feature-render-visibility.md). This checkout has no
      # web/package.json, so the preview server and the two cases run against
      # the root-level scripts rather than through screenshot.sh, which assumes
      # a per-project `bun run build`/`bun run preview` pair.
      - name: Serve and capture
        working-directory: web
        run: |
          (cd .. && bun run web:preview) &
          for _ in $(seq 1 40); do
            curl -sSf http://localhost:4321/ >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -sSf http://localhost:4321/ >/dev/null 2>&1 || {
            echo "Preview server not responding on port 4321 after 10s." >&2
            exit 1
          }
          SCREENSHOT_BASE_URL=http://localhost:4321 bun ../tooling/web/configs/e2e/screenshot.ts

      # The frames land in their committed location so the report below diffs
      # them against the baseline this repository ships, and so the artifact
      # carries the two names a reader already knows.
      - name: Stage the captured frames
        run: |
          mkdir -p assets/evidence/home
          cp web/screenshots/localhost/home/default.png assets/evidence/home/light.png
          cp web/screenshots/localhost/home/dark.png assets/evidence/home/dark.png

      # Uploaded on success rather than on failure alone, against the artifact
      # rule in governance/rules/ci/700-ci-workflow.md. The frames are this
      # job's product now that it no longer commits them, so a failure-only
      # upload would leave a passing run with nothing to review.
      - name: Upload the captured frames
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-capture
          path: assets/evidence/home/
          retention-days: 7

      # This job used to commit the frames back onto the pull request branch
      # and push. It stopped because the drift it was correcting is not the
      # branch's. The render is byte-deterministic: on 2026-09-19 two capture
      # runs on two unrelated branches, four minutes apart on separate runners,
      # both rewrote light.png from blob 77a35b66 to 08936e29 and dark.png from
      # fa0121af to 1f91bc04. Those two bot commits were squash-merged and their
      # branches deleted, so read the same pair off main at fa07374d and
      # 71a5e183, which bracket the move. No noise means no tolerance to absorb.
      # What moves the bytes is the page reading catalog counts at build time,
      # which a merge touching no web/ file still changes, leaving the committed
      # baseline stale until some unrelated pull request re-renders it and
      # commits the correction onto a branch that never asked for it.
      #
      # Reporting rather than committing keeps that signal without the commit.
      # Refreshing the baseline on main is the other half of the fix and is out
      # of scope by an operator decision: a commit reaching the trunk with no
      # pull request and no reviewer is a larger change than this row was
      # scoped for. Until that lands the baseline still goes stale, and this
      # step is what says so.
      - name: Report whether the baseline moved
        run: |
          if git diff --quiet -- assets/evidence/home; then
            echo "The captured frames match the committed baseline." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### The landing page capture moved"
            echo
            echo "These frames differ from the committed baseline. That is expected"
            echo "when a catalog this page counts has moved, and it is not a failure."
            echo
            echo '```'
            git diff --stat -- assets/evidence/home
            echo '```'
            echo
            echo "Download the \`landing-page-capture\` artifact to view them."
          } >>"$GITHUB_STEP_SUMMARY"
