name: PR Visual Checks
# canon-no-seed: builds and captures this checkout's own landing page. Seeding
# it as-is would have a target run these two jobs against a page it never
# built and push a commit no branch of its own asked for.

on:
  pull_request:
    paths:
      # Mirrors deploy-site.yml's own list. A page whose numbers are read at
      # build time goes stale when a catalog moves, not only when web/ is
      # edited, so the catalogs it reads are on this list beside the page
      # itself. Question 2 in .canon/plans/archive/feature-render-visibility.md
      # names the two literal copies rather than a single shared source.
      - 'web/**'
      - 'assets/**'
      - 'src/design/**'
      - 'governance/rules/**'
      - 'standards/**'
      - 'snippets/**'
      - 'claude/skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright System Dependencies
        run: bunx playwright install-deps chromium firefox webkit

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium firefox webkit

      - name: Verify Playwright Browsers Restored
        run: |
          for browser in chromium firefox webkit; do
            ls ~/.cache/ms-playwright 2>/dev/null | grep -q "^${browser}-" || {
              echo "Missing Playwright browser: ${browser}" >&2
              exit 1
            }
          done

      - name: Run E2E Tests
        run: bun run web:e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  capture:
    name: 📸 Landing Page Capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright System Dependencies
        run: bunx playwright install-deps chromium

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Verify Playwright Browsers Restored
        run: |
          ls ~/.cache/ms-playwright 2>/dev/null | grep -q "^chromium-" || {
            echo "Missing Playwright browser: chromium" >&2
            exit 1
          }

      - name: Build
        run: bun run web:build

      - name: Build gallery
        run: bun run web:gallery

      - name: Verify gallery excluded from build
        run: ./scripts/core/check-gallery-exclusion.sh

      # `tooling/web/configs/e2e/screenshot.ts` is reused as is (Constraints,
      # .canon/plans/archive/feature-render-visibility.md). This checkout has no
      # web/package.json, so the preview server and the two cases run against
      # the root-level scripts rather than through screenshot.sh, which assumes
      # a per-project `bun run build`/`bun run preview` pair.
      - name: Serve and capture
        working-directory: web
        run: |
          (cd .. && bun run web:preview) &
          for _ in $(seq 1 40); do
            curl -sSf http://localhost:4321/ >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -sSf http://localhost:4321/ >/dev/null 2>&1 || {
            echo "Preview server not responding on port 4321 after 10s." >&2
            exit 1
          }
          SCREENSHOT_BASE_URL=http://localhost:4321 bun ../tooling/web/configs/e2e/screenshot.ts

      - name: Update the committed baseline
        run: |
          mkdir -p assets/evidence/home
          cp web/screenshots/localhost/home/default.png assets/evidence/home/light.png
          cp web/screenshots/localhost/home/dark.png assets/evidence/home/dark.png

      # HEAD_REF carries github.head_ref through env: rather than into the
      # script body directly, since that value is attacker-controlled on a
      # fork pull request and this job holds contents: write.
      #
      # A GITHUB_TOKEN push does raise a new run against its own commit, held
      # needing approval rather than starting on its own, and approving one
      # to get a check green un-gates it the same as any other run. What
      # actually stops the loop is that the second capture matches the
      # first: git diff --cached --quiet exits zero and nothing is
      # committed, so the second run's push step never fires at all.
      # Swapping in a personal token here does not reopen that guard, but it
      # does remove the approval gate, so an unapproved run and an
      # unattended loop both become possible together the moment a capture
      # stops being byte-identical.
      #
      # HUSKY=0 skips this checkout's own git hooks for the commit and the
      # push, since bun install already ran the prepare script that wires
      # them up. The pre-push hook runs bun run check, whose Formatting
      # stage shells out to shfmt, a binary this job never installs, and
      # this pull request's own Verify job already runs the gate this hook
      # would repeat.
      - name: Commit the baseline if it moved
        env:
          HEAD_REF: ${{ github.head_ref }}
          HUSKY: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/evidence/home
          if git diff --cached --quiet; then
            echo "No change in the captured baseline."
            exit 0
          fi
          git commit -m "chore(web): update the landing page capture baseline"
          git push origin "HEAD:$HEAD_REF"
