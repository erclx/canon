name: PR Visual Checks
# canon-no-seed: builds and captures this checkout's own landing page. Seeding
# it as-is would have a target run these two jobs against a page it never
# built.

on:
  pull_request:
    paths:
      # Mirrors deploy-site.yml's own list. The page builds from web/, assets/,
      # and src/design/ and reads no catalog. Its audits section reads code
      # outside these globs and refreshes only on a page deploy, and the list
      # stays as it is for the preview contract that file states. Question 2
      # in .canon/plans/archive/feature-render-visibility.md names
      # the two literal copies rather than a single shared source.
      # The e2e harness entry has no deploy counterpart: a harness edit changes
      # no byte of the built site, so it reports the capture and never deploys.
      # VISUAL_ONLY_GLOBS in src/gate/measures.ts declares it to the gate.
      - 'web/**'
      - 'assets/**'
      # Pull request screenshots, which the page never reads.
      - '!assets/evidence/**'
      - 'src/design/**'
      - '.github/workflows/deploy-site.yml'
      - 'tooling/web/configs/e2e/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The health section charts merges a week, which a shallow clone cannot read.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright System Dependencies
        timeout-minutes: 10
        run: scripts/ci/install-playwright-deps.sh chromium firefox webkit

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-webkit-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium firefox webkit

      - name: Verify Playwright Browsers Restored
        run: scripts/ci/check-browsers.sh chromium firefox webkit

      - name: Run E2E Tests
        run: bun run web:e2e

      - name: Lint the built page
        run: bunx html-validate web/dist/index.html

      - name: Upload E2E Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  capture:
    name: 📸 Landing Page Capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Verify Playwright Browsers Restored
        run: scripts/ci/check-browsers.sh chromium

      # Builds, serves, and captures the page, then clears and refills
      # assets/evidence/home so the report below diffs the frames against the
      # baseline this repository ships. refresh-capture-frames.yml calls the
      # same script to write that baseline, so the two cannot capture
      # differently.
      - name: Build, capture, and stage the frames
        run: bash scripts/core/capture-home.sh

      - name: Verify social card excluded from build
        run: bun run web:card:check

      # Uploaded on success rather than on failure alone, against the artifact
      # rule in governance/rules/tooling/ci-workflow.md. The frames are this
      # job's product now that it no longer commits them, so a failure-only
      # upload would leave a passing run with nothing to review.
      - name: Upload the captured frames
        uses: actions/upload-artifact@v7
        with:
          name: landing-page-capture
          path: assets/evidence/home/
          retention-days: 7

      # Reports drift and never commits it. Why: canon/context/development/web.md.
      - name: Report whether the baseline moved
        run: scripts/ci/report-baseline.sh
