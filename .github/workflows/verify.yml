name: Verify

on:
  pull_request:
    branches:
      - main
  # Inert until a merge_queue rule exists, which a personal repository cannot hold
  merge_group:
  push:
    branches:
      - main
  schedule:
    # An advisory is published against the index rather than against a
    # commit, so a weekly read reports what a per-push read never would.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's older run is cancelled on a new push. Every other event
# keys on the commit and never cancels, so main stays fully proven.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    # The ruleset requires this name, so renaming it strands branch protection
    name: 🛡️ Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, so origin/main resolves for the merge-base reads.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Install Plugin CLI
        # Pinned deliberately. Reason and revisit test in canon/context/development/ci.md
        run: bun install -g @anthropic-ai/claude-code@2.1.302

      - name: Verify
        run: bun run check:ci

      - name: Verify install
        run: bun run check:install

  changes:
    name: 🔍 Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The merge commit and its parents, so the base sha resolves.
          fetch-depth: 2

      - name: Detect Code Changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/docs-only.sh "$BASE_SHA"

  # The unit suite alone, since lint, types, format, shell, build, and browser
  # results do not differ by platform. Reason in canon/context/development/ci.md
  macos-unit-tests:
    name: 🍎 macOS Unit Tests
    runs-on: macos-latest
    timeout-minutes: 15
    needs: changes
    # The ruleset requires this check, so a Markdown-only pull request skips it
    # by condition, which reports success, rather than by a path filter, which
    # never reports. !cancelled() lets it run when changes is skipped on a push
    # or fails, so only a detector that succeeded can skip the tests.
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      !(github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, matching the Linux job, so a test reading origin/main resolves.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Pin Stock Bash
        # Every spawned `bash` resolves here first, so hooks run on the 3.2 a Mac ships
        run: |
          mkdir -p "$RUNNER_TEMP/stock-bash"
          ln -s /bin/bash "$RUNNER_TEMP/stock-bash/bash"
          echo "$RUNNER_TEMP/stock-bash" >> "$GITHUB_PATH"

      - name: Check Bash Version
        # Fails a missed pin rather than letting the suite pass on a newer bash
        run: bash -c 'echo "$BASH_VERSION"; [ "${BASH_VERSINFO[0]}" -eq 3 ]'

      - name: Unit Tests
        run: bun run test

  # Every *.e2e.test.ts skips itself when its browser or FFmpeg is missing, so
  # Static Checks passes them as skipped. This job installs both and proves
  # they landed before the suites start, so a missing tool reddens it rather
  # than skipping green. Informational: the ruleset does not require it.
  e2e-suites:
    name: 🎬 E2E Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The macOS job's condition, so a Markdown-only pull request skips it and
    # a push to main, where changes never runs, does not
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      !(github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The runner image lists no FFmpeg. A stalled mirror connection hangs
      # rather than fails, so the step bound turns a hang into a red step.
      - name: Install FFmpeg
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg

      # Its own key, since the capture job's cache holds no agent CLI revision
      # and a hit on it would skip the install below
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-e2e-suites-${{ hashFiles('bun.lock', 'src/browser/agent-cli.ts') }}

      # Lands the chromium and headless shell revisions playwright-core reads
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bunx playwright install chromium

      # The swipe suite launches the pinned agent CLI's Chromium, whose
      # revision differs from the engine's
      - name: Install Agent CLI Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bun src/cli.ts browser install-browser chromium

      - name: Verify Tools Present
        run: |
          scripts/ci/check-browsers.sh chromium chromium_headless_shell
          scripts/ci/check-e2e-tools.sh "$(bun -e "import { CHROMIUM_REVISION } from './src/browser/agent-cli'; console.log(CHROMIUM_REVISION)")"

      # Ubuntu 24.04's AppArmor kills the chrome-headless-shell the take engine
      # spawns with its sandbox on. Playwright's launches turn the sandbox off,
      # so only the take suites need this.
      - name: Allow Unprivileged User Namespaces
        timeout-minutes: 1
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run E2E Suites
        timeout-minutes: 15
        run: bun run test:e2e

  dependency-advisories:
    name: 📦 Dependency Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun src/cli.ts deps audit
