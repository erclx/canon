name: Verify

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
  schedule:
    # An advisory is published against the index rather than against a
    # commit, so a weekly read reports what a per-push read never would.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  static-checks:
    name: 🛡️ Static Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so origin/main resolves for the merge-base reads.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Shell Tools
        run: sudo apt-get install -y shfmt shellcheck

      - name: Install Plugin CLI
        # Pinned deliberately. Reason and revisit test in canon/context/ci/checks.md
        run: bun install -g @anthropic-ai/claude-code@2.1.236

      - name: Verify
        run: bun run check:ci

      - name: Verify install
        run: bun run check:install

  dependency-advisories:
    name: 📦 Dependency Advisories
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun src/cli.ts deps audit
