name: Release
# canon-no-seed: publishes this package to the registry as @erclx/canon and writes this checkout's own plugin.json version through extra-files. Seeding it as-is would have a target publish itself under this package's name.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        # Empty runs release-please as usual, a tag publishes that tag alone
        description: Tag to publish
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🏷️ Release Please
    runs-on: ubuntu-latest
    # A dispatch naming a tag republishes it, so no release is cut
    if: github.event_name == 'push' || inputs.tag == ''
    # Queues rather than cancels, since a cancel can land after the release exists and before its outputs do
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Runs before the tag exists, so a release is never cut it cannot publish
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: scripts/ci/verify-npm-token.sh

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Not GITHUB_TOKEN, which authors a bot pull request CI will not run
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: 📦 Publish
    needs: release-please
    # release-please is skipped on a tag dispatch, so the gate cannot need its success
    if: >-
      !cancelled()
      && (needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 10 runs prepare under --ignore-scripts, npm 11 honors the flag
      - name: Pin npm
        run: npm install -g npm@11

      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-check:
    name: 🔎 Publish Check
    # A tag dispatch is the repair for the gap this reports, so it never runs there
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the newest release reached npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci/publish-check.sh
