name: Deploy Site
# canon-no-seed: builds the landing page from this checkout and publishes it to this project's Cloudflare Pages site at canon.erclx.com. Seeding it as-is would have a target deploy this repository's page under this repository's domain.

on:
  push:
    branches:
      - main
    paths:
      # The page builds from web/, assets/, and src/design/ and reads no catalog.
      # src/pr/preview.test.ts holds a change outside this list off the site deploy.
      - 'web/**'
      - 'assets/**'
      # Pull request screenshots, which the page never reads.
      - '!assets/evidence/**'
      - 'src/design/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  # A closed pull request runs only the cleanup job below, which deletes the
  # preview deployments `canon pr preview` minted for its branch.
  pull_request:
    types: [closed]

# A running deploy finishes so a half-uploaded site is never live.
# The group is keyed on the ref, so a branch preview never displaces a production deploy.
concurrency:
  group: deploy-site-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🌐 Deploy Site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The health section charts merges a week, which a shallow clone cannot read.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # `web/src/lib/canon-cli.ts` runs this checkout's `src/cli.ts`, so the
      # page counts are this commit's.
      - name: Build
        run: bun run web:build

      - name: Verify social card excluded from build
        run: bun run web:card:check

      # `pages-deployment-alias-url` is an output from wrangler 3.78 on, so the
      # version is pinned rather than left to the action's default.
      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          command: pages deploy web/dist --project-name=canon --branch=${{ github.ref_name }}

      # `canon pr preview` reads this marker out of the run log. The alias comes
      # off the deploy, since Cloudflare may truncate a branch name.
      - name: Report preview alias
        if: steps.publish.outputs.pages-deployment-alias-url != ''
        env:
          ALIAS_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
        run: |
          echo "canon-preview-alias: $ALIAS_URL"
          echo "Preview: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: 🧹 Delete Branch Previews
    # Dependabot branches publish no preview and the run holds no Cloudflare secrets
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch, since a closed pull request may have no merge ref to
      # check out, and the script that holds the Cloudflare token should not
      # come from the branch being closed.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: scripts/ci/delete-previews.sh canon "$BRANCH"
