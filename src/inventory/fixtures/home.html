<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <style>
      button {
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid rgb(37, 99, 235);
        outline-offset: 2px;
      }
      a {
        outline: none;
      }
      a:focus-visible {
        outline: 2px solid rgb(37, 99, 235);
        outline-offset: 2px;
      }
      .bare,
      .bare:focus-visible {
        outline: none;
        outline-offset: 0;
      }
    </style>
  </head>
  <body>
    <button id="save">Save</button>
    <a id="docs" href="/pricing">Pricing</a>
    <button id="quiet" class="bare">Quiet</button>
  </body>
</html>
