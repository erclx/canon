<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Busy</title>
    <!--
      A hero canvas that redraws every frame and spends busy=<ms> of main
      thread work on each, so a frame takes about that long to render. A card
      sits about 2900px down, below the window, and the rail link scrolls to it.
      With timed=1 each frame spins on performance.now() instead, as the
      groundwork page did, which never ends once the stepper pauses virtual
      time.
    -->
    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: sans-serif;
      }

      nav {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 2;
      }

      nav a {
        display: block;
        padding: 12px 20px;
        background: #fff;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      section {
        height: 900px;
        border-top: 1px solid #ccc;
        padding: 40px;
      }

      .card {
        width: 400px;
        height: 240px;
        background: #ddd;
      }

      .card:hover {
        background: #f60;
      }
    </style>
  </head>
  <body>
    <nav><a id="rail" href="#cards">Cards</a></nav>
    <canvas id="hero"></canvas>
    <section>one</section>
    <section>two</section>
    <section id="cards"><div class="card" id="card">card</div></section>
    <section>four</section>
    <script>
      const params = new URLSearchParams(location.search)
      const busy = Number(params.get('busy') || 0)
      const timed = params.get('timed') === '1'
      const hero = document.getElementById('hero')
      hero.width = innerWidth
      hero.height = innerHeight
      const context = hero.getContext('2d')
      // The work is a count calibrated in real time on load, since a loop
      // timed by performance.now() never ends under a paused virtual clock.
      let sink = 0
      const spin = (count) => {
        for (let i = 0; i < count; i += 1) sink += Math.sqrt(i)
      }
      const measure = (ms) => {
        let count = 0
        const start = performance.now()
        while (performance.now() - start < ms) {
          spin(10000)
          count += 10000
        }
        return count / ms
      }
      // Warmed first, so the count matches the optimized loop a frame runs.
      measure(100)
      const work = Math.round(busy * measure(200))
      const draw = (time) => {
        if (timed) {
          const start = performance.now()
          while (performance.now() - start < busy) {}
        } else {
          spin(work)
        }
        context.fillStyle = `hsl(${(time / 10) % 360}, 60%, 50%)`
        context.fillRect(0, 0, hero.width, hero.height)
        requestAnimationFrame(draw)
      }
      requestAnimationFrame(draw)
    </script>
  </body>
</html>
