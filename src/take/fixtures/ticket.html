<!doctype html>
<body style="margin: 0">
  <button
    id="open"
    style="
      position: absolute;
      left: 100px;
      top: 100px;
      width: 200px;
      height: 60px;
    "
  >
    Open
  </button>
  <script>
    // Spins until the shell is killed, so the press stalls under any stall
    // limit in whichever phase it lands.
    document.getElementById('open').addEventListener('click', () => {
      for (;;) {}
    })
  </script>
</body>
