<!doctype html>
<body style="margin: 0">
  <button
    id="open"
    style="
      position: absolute;
      left: 100px;
      top: 100px;
      width: 200px;
      height: 60px;
    "
  >
    Open
  </button>
  <script>
    // The press blocks the main thread on a synchronous request the server
    // answers about 20 s late. The hold runs in real time on the server, so a
    // contended runner cannot shorten it under the loaded stall limit the way
    // it shortened a spin calibrated on load, and a paused virtual clock in
    // the page never stretches it.
    document.getElementById('open').addEventListener('click', () => {
      const request = new XMLHttpRequest()
      request.open('GET', '/ticket/hold', false)
      request.send()
    })
  </script>
</body>
