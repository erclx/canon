<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Viewport</title>
    <link rel="stylesheet" href="/tokens.css" />
    <!--
      A toolbar that folds its actions into a menu below 1200 px, so a take
      filmed at the default window shows every action and one filmed in a
      narrower window shows the fold and the menu it opens.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Geist, system-ui, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        background: #ffffff;
        border-bottom: 1px solid #d4d4d8;
      }

      h1 {
        margin: 0 auto 0 0;
        font-size: 20px;
      }

      button {
        font: inherit;
        font-size: 16px;
        padding: 10px 18px;
        border: 1px solid #a1a1aa;
        border-radius: 8px;
        background: #ffffff;
        color: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      #more,
      #menu {
        display: none;
      }

      #menu {
        position: absolute;
        right: 24px;
        top: 72px;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        background: #ffffff;
      }

      @media (max-width: 1199px) {
        .action {
          display: none;
        }

        #more {
          display: inline-block;
        }

        #menu[data-open] {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Release checklist</h1>
      <button class="action" id="share" type="button">Share</button>
      <button class="action" type="button">Duplicate</button>
      <button class="action" type="button">Export</button>
      <button class="action" type="button">Archive</button>
      <button
        id="more"
        type="button"
        aria-expanded="false"
        aria-controls="menu"
      >
        More actions
      </button>
    </header>
    <div id="menu" role="group" aria-label="More actions">
      <button type="button">Share</button>
      <button type="button">Duplicate</button>
      <button type="button">Export</button>
      <button type="button">Archive</button>
    </div>
    <script>
      const more = document.getElementById('more')
      const menu = document.getElementById('menu')
      more.addEventListener('click', () => {
        const open = !menu.hasAttribute('data-open')
        menu.toggleAttribute('data-open', open)
        more.setAttribute('aria-expanded', String(open))
      })
    </script>
  </body>
</html>
