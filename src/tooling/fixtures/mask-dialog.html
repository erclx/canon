<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        height: 2000px;
        background: #fff;
      }
      .edited,
      .below {
        position: absolute;
        width: 200px;
        height: 40px;
        background: #ccc;
      }
      #under-panel {
        left: 100px;
        top: 100px;
      }
      #under-backdrop {
        left: 700px;
        top: 100px;
      }
      .below {
        left: 100px;
        top: 1800px;
      }
      .base {
        position: absolute;
        left: 1000px;
        top: 100px;
        width: 200px;
        height: 40px;
        background: #888;
      }
      .badge {
        position: absolute;
        left: 1050px;
        top: 110px;
        width: 100px;
        height: 20px;
        background: #ccc;
        pointer-events: none;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
      }
      .panel {
        position: fixed;
        left: 50px;
        top: 50px;
        width: 400px;
        height: 200px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <span class="edited" id="under-panel"></span>
    <span class="edited" id="under-backdrop"></span>
    <span class="below"></span>
    <div class="base"></div>
    <span class="badge"></span>
    <div class="backdrop"></div>
    <div class="panel" role="dialog"></div>
    <script>
      if (location.search === '?closed') {
        for (const node of document.querySelectorAll('.backdrop, .panel')) {
          node.remove()
        }
      }
    </script>
  </body>
</html>
