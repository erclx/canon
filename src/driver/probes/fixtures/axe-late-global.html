<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Late global</title>
    <script>
      const read = window.getComputedStyle.bind(window)
      window.getComputedStyle = (...args) => {
        window.lateGlobal = 'the page'
        return read(...args)
      }
    </script>
  </head>
  <body>
    <main><p>Readable text</p></main>
  </body>
</html>
