<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      button {
        outline: none;
        border: 1px solid #999;
        background: #fff;
      }
      button:focus-visible {
        outline: 2px solid rgb(37, 99, 235);
        outline-offset: 2px;
      }
      #quiet,
      #quiet:focus-visible {
        outline: none;
      }
      #pinned {
        position: fixed;
        top: 10px;
        right: 10px;
      }
      #pinned,
      #pinned:focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body>
    <button id="ring">Save</button>
    <button id="quiet">Quiet</button>
    <button id="pinned">Pinned</button>
  </body>
</html>
