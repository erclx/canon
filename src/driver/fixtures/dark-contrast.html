<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dark contrast</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #ffffff;
        color: #222222;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #333333;
          color: #555555;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p id="note">This line reads in light and fades in dark.</p>
    </main>
  </body>
</html>
