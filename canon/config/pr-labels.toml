# Labels git-pr adds to a pull request, by path prefix.
# Create them with canon labels sync. Every key: canon docs config
# Matching is prefix-anchored, so a dotted folder needs its own prefix.

[domains]
# Shipped skills, internal skills, and the marketplace entry.
skills = ["claude/skills/", ".claude/skills/", ".claude-plugin/"]
governance = [
  "governance/",
  ".claude/rules/",
  "internal/rules/",
  "internal/governance.toml",
]
tooling = ["tooling/"]
# A new scripts/ folder goes bare until canon labels audit names it.
cli = ["src/", "scripts/eval/"]
sandbox = ["sandbox/", "src/sandbox/"]
# assets/loops/ holds the README's loops, so it rides with the README.
docs = [
  "docs/",
  "wiki/",
  "README.md",
  "CONTRIBUTING.md",
  "examples/",
  "assets/loops/",
]
# The landing page, built and deployed apart from every row above.
web = ["web/"]
# The hooks enforce what the verify gate cannot, and settings.json
# registers them, so both ride here.
ci = [
  ".github/",
  "scripts/ci/",
  "scripts/core/",
  ".husky/",
  ".claude/hooks/",
  ".claude/settings.json",
]
# The context entries and the design record, with the hand-drawn brand
# marks and canon/design/, whose index is written by hand.
context = [
  "canon/context/",
  "canon/REQUIREMENTS.md",
  "canon/DESIGN.md",
  "canon/design/",
  "CLAUDE.md",
  "assets/brand/",
]
# Repository configuration belonging to no domain, this map included.
# A folder prefix, so a new file in canon/config/ is labelled too.
repo = [
  ".gitignore",
  "canon/config/",
  "vitest.config.ts",
  "vitest.setup.ts",
  "commitlint.config.js",
  "commitlint.config.test.ts",
]

# Paths deliberately left unlabelled, keyed by the reason.
[declined]
# Release automation opens its own pull request and applies its own label.
# Every change to the plugin manifest is a release.
release-managed = [
  "CHANGELOG.md",
  "package.json",
  ".release-please-manifest.json",
  "claude/.claude-plugin/",
]
# Written by a command, riding in the commit that changed its source.
# An assets/ entry is a stem, covering the light sibling and the stamp.
generated = [
  "assets/evidence/catalog",
  "assets/evidence/home/",
  "canon/config/baseline.json",
]
# Formatting configuration nobody reviews for behavior.
formatting = [
  ".oxfmtrc.jsonc",
  ".prettierrc",
  ".prettierignore",
  ".lintstagedrc",
]
