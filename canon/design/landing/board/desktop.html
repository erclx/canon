<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../assets/landing-v6/lang/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      :root {
        --ground: #fdfdfc;
        --card: #fff;
        --band: #f0f0ee;
        --grid: #ececea;
        --rule: #d6d6d2;
        --line: #ececea;
        --edge: #e4e4e1;
        --outline: #121212;
        --ink: #121212;
        --body: #3b3b38;
        --muted: #6b6a66;
        --accent: #c2380e;
        --waiting: #b07d1a;
        --shadow: 5px 5px 0 #121212;
        --shadow-s: 3px 3px 0 #121212;
        --size-display: 50px;
        --size-lede: 21px;
        --size-small: 13px;
        --size-vs: 12px;
        --pad: 112px 64px;
        --mono: 'Geist Mono Variable', 'DejaVu Sans Mono', monospace;
        --sans: 'Geist Variable', 'DejaVu Sans', sans-serif;
      }
      html[data-theme='dark'] {
        --ground: #1e1e1c;
        --card: #292927;
        --band: #3d3d39;
        --grid: #242421;
        --rule: #3d3d39;
        --line: #474742;
        --edge: #4d4d48;
        --outline: #8d8c86;
        --ink: #f2f2f0;
        --body: #cfcdc8;
        --muted: #a9a7a0;
        --accent: #ff6b42;
        --waiting: #e5b567;
        --shadow: 5px 5px 0 #5c5b56;
        --shadow-s: 3px 3px 0 #5c5b56;
      }
      @media (max-width: 900px) {
        :root {
          --size-display: 40px;
          --size-lede: 18px;
          --size-vs: 11px;
          --pad: 80px 32px;
        }
      }
      @media (max-width: 640px) {
        :root {
          --size-display: 32px;
          --size-lede: 17px;
          --size-small: 12.5px;
          --pad: 48px 20px;
        }
      }
      body {
        background-color: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .lab {
        font: 500 12px/1.4 var(--sans);
        padding: 8px 14px;
        color: var(--muted);
        border-bottom: 1px solid var(--rule);
        background: var(--ground);
      }
      .part {
        padding: var(--pad);
        overflow-x: clip;
      }
      .w {
        max-width: 1180px;
        margin: 0 auto;
      }
      h2 {
        margin: 0;
        max-width: 16ch;
        font-size: var(--size-display);
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 600;
        color: var(--ink);
        text-wrap: balance;
      }
      .lede {
        margin: 0;
        max-width: 44ch;
        font-size: var(--size-lede);
        line-height: 1.48;
        color: var(--muted);
        text-wrap: pretty;
      }
      .top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 64px;
        align-items: end;
      }
      @media (max-width: 900px) {
        .top {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
      }
      .note {
        font-family: var(--mono);
        font-size: var(--size-vs);
        font-weight: 500;
        line-height: 1.35;
        color: var(--muted);
      }
      .ink {
        background: var(--card);
        border: 1.5px solid var(--outline);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .drawn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1.5px solid var(--outline);
        border-radius: 8px;
        background: var(--card);
        box-shadow: var(--shadow-s);
        font-family: var(--mono);
        font-size: var(--size-vs);
        font-weight: 500;
        line-height: 1;
        color: var(--ink);
      }
      figure {
        margin: 0;
      }
      .ba {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 80px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        margin-top: 64px;
      }
      .stamp {
        margin: 0 0 12px;
        font-size: var(--size-small);
      }
      .after .stamp {
        font-weight: 600;
        color: var(--ink);
      }
      .mid {
        align-self: center;
        margin: 0;
        text-align: center;
        color: var(--ink);
      }
      .bd {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .ln {
        min-height: 200px;
        padding: 9px;
        border-radius: 8px;
        background: var(--band);
      }
      html[data-theme='dark'] .ln {
        background: color-mix(in srgb, var(--band) 45%, var(--ground));
      }
      .lh {
        margin: 0 0 10px;
      }
      .cards {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cd {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 8px;
        padding: 7px 9px;
        border: 1.5px solid var(--outline);
        border-radius: 4px;
        background: var(--card);
        font-family: var(--mono);
      }
      .cd b {
        font-size: var(--size-vs);
        font-weight: 500;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .cd span {
        font-size: var(--size-vs);
        line-height: 1.35;
        color: var(--muted);
      }
      .before .cd {
        border-style: dashed;
      }
      .cd.wt {
        border-color: var(--waiting);
        box-shadow: 3px 3px 0 var(--waiting);
      }
      .cd.wt span {
        color: var(--ink);
      }
      .gl {
        margin-right: 6px;
        font-style: normal;
        color: var(--waiting);
      }
      .replay {
        margin-top: 14px;
      }
      .pg {
        height: 4px;
        margin: -4px 0 12px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--line);
      }
      .pg i {
        display: block;
        height: 100%;
        background: var(--ink);
      }
      @media (max-width: 1100px) {
        .ba {
          grid-template-columns: minmax(0, 1fr);
        }
        .mid {
          text-align: left;
        }
      }
      @media (max-width: 640px) {
        .bd {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="lab">
      board · two boards with the moves between, as the page ships it after
      #3379
    </div>
    <section class="part" id="board">
      <div class="w">
        <div class="top">
          <h2>Come back to finished pull requests</h2>
          <p class="lede">
            Queue features on the task board before you leave. Canon builds and
            reviews them, and holds each merge for you.
          </p>
        </div>
        <div class="ba">
          <figure class="side before">
            <p class="stamp note">23:00 · you step out</p>
            <div class="bd">
              <div class="ln">
                <p class="lh note">Up next</p>
                <ul class="cards">
                  <li class="cd"><b>gate-stages</b><span>plan linked</span></li>
                  <li class="cd"><b>film-beats</b><span>needs a plan</span></li>
                  <li class="cd"><b>take-timer</b><span>plan linked</span></li>
                </ul>
              </div>
              <div class="ln">
                <p class="lh note">In flight</p>
                <ul class="cards">
                  <li class="cd">
                    <b>sync-stamp</b><span>worker, slice 3 of 3</span>
                  </li>
                  <li class="cd">
                    <b>review-lift</b><span>worker, slice 2 of 2</span>
                  </li>
                  <li class="cd">
                    <b>sync-coverage</b><span>review, first pass</span>
                  </li>
                  <li class="cd">
                    <b>drive-check</b><span>review, second pass</span>
                  </li>
                </ul>
              </div>
              <div class="ln">
                <p class="lh note">Ready to merge</p>
                <ul class="cards"></ul>
              </div>
            </div>
          </figure>
          <p class="mid note">6 moves →</p>
          <figure class="side after">
            <p class="stamp note">02:14 · what you come back to</p>
            <div class="pg"><i></i></div>
            <div class="bd">
              <div class="ln">
                <p class="lh note">Up next</p>
                <ul class="cards">
                  <li class="cd"><b>gate-stages</b><span>plan linked</span></li>
                  <li class="cd"><b>film-beats</b><span>needs a plan</span></li>
                </ul>
              </div>
              <div class="ln">
                <p class="lh note">In flight</p>
                <ul class="cards">
                  <li class="cd">
                    <b>take-timer</b><span>worker, slice 2 of 3</span>
                  </li>
                  <li class="cd">
                    <b>sync-stamp</b><span>review, second pass</span>
                  </li>
                  <li class="cd wt">
                    <b>review-lift</b
                    ><span
                      ><i class="gl" role="img" aria-label="waits for you">◆</i
                      >one question for you</span
                    >
                  </li>
                </ul>
              </div>
              <div class="ln">
                <p class="lh note">Ready to merge</p>
                <ul class="cards">
                  <li class="cd">
                    <b>sync-coverage</b><span>review closed</span>
                  </li>
                  <li class="cd">
                    <b>drive-check</b><span>review closed</span>
                  </li>
                </ul>
              </div>
            </div>
            <span class="drawn replay">Replay the night</span>
          </figure>
        </div>
      </div>
    </section>
  </body>
</html>
