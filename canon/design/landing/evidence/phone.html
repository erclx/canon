<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../assets/landing-v6/lang/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      :root {
        --ground: #fdfdfc;
        --card: #fff;
        --band: #f0f0ee;
        --grid: #ececea;
        --rule: #d6d6d2;
        --line: #ececea;
        --edge: #e4e4e1;
        --outline: #121212;
        --ink: #121212;
        --body: #3b3b38;
        --muted: #6b6a66;
        --accent: #c2380e;
        --waiting: #b07d1a;
        --shadow: 5px 5px 0 #121212;
        --shadow-s: 3px 3px 0 #121212;
        --size-display: 50px;
        --size-lede: 21px;
        --size-small: 13px;
        --size-vs: 12px;
        --pad: 112px 64px;
        --mono: 'Geist Mono Variable', 'DejaVu Sans Mono', monospace;
        --sans: 'Geist Variable', 'DejaVu Sans', sans-serif;
      }
      html[data-theme='dark'] {
        --ground: #1e1e1c;
        --card: #292927;
        --band: #3d3d39;
        --grid: #242421;
        --rule: #3d3d39;
        --line: #474742;
        --edge: #4d4d48;
        --outline: #8d8c86;
        --ink: #f2f2f0;
        --body: #cfcdc8;
        --muted: #a9a7a0;
        --accent: #ff6b42;
        --waiting: #e5b567;
        --shadow: 5px 5px 0 #5c5b56;
        --shadow-s: 3px 3px 0 #5c5b56;
      }
      @media (max-width: 900px) {
        :root {
          --size-display: 40px;
          --size-lede: 18px;
          --size-vs: 11px;
          --pad: 80px 32px;
        }
      }
      @media (max-width: 640px) {
        :root {
          --size-display: 32px;
          --size-lede: 17px;
          --size-small: 12.5px;
          --pad: 48px 20px;
        }
      }
      body {
        background-color: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .lab {
        font: 500 12px/1.4 var(--sans);
        padding: 8px 14px;
        color: var(--muted);
        border-bottom: 1px solid var(--rule);
        background: var(--ground);
      }
      .part {
        padding: var(--pad);
        overflow-x: clip;
      }
      .w {
        max-width: 1180px;
        margin: 0 auto;
      }
      h2 {
        margin: 0;
        max-width: 16ch;
        font-size: var(--size-display);
        line-height: 1.06;
        letter-spacing: -0.03em;
        font-weight: 600;
        color: var(--ink);
        text-wrap: balance;
      }
      .lede {
        margin: 0;
        max-width: 44ch;
        font-size: var(--size-lede);
        line-height: 1.48;
        color: var(--muted);
        text-wrap: pretty;
      }
      .top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 64px;
        align-items: end;
      }
      @media (max-width: 900px) {
        .top {
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
      }
      .note {
        font-family: var(--mono);
        font-size: var(--size-vs);
        font-weight: 500;
        line-height: 1.35;
        color: var(--muted);
      }
      .ink {
        background: var(--card);
        border: 1.5px solid var(--outline);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .drawn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1.5px solid var(--outline);
        border-radius: 8px;
        background: var(--card);
        box-shadow: var(--shadow-s);
        font-family: var(--mono);
        font-size: var(--size-vs);
        font-weight: 500;
        line-height: 1;
        color: var(--ink);
      }
      figure {
        margin: 0;
      }
      .reel {
        width: fit-content;
        max-width: 100%;
        margin: 64px auto 0;
      }
      @media (max-width: 900px) {
        .reel {
          margin-top: 40px;
        }
      }
      .screen {
        padding: 10px 10px 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        box-shadow: 5px 5px 0 var(--rule);
      }
      @media (max-width: 640px) {
        .screen {
          padding: 6px 6px 0;
        }
      }
      .frame {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        outline: 1px solid var(--edge);
        outline-offset: -1px;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 4px;
        font-family: var(--mono);
        font-size: var(--size-vs);
        color: var(--muted);
      }
      .play {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1.5px solid var(--ink);
        border-radius: 8px;
        font-weight: 500;
        line-height: 1;
        color: var(--ink);
      }
      .glyph {
        width: 0;
        height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 8px solid currentColor;
      }
      figcaption {
        margin-top: 14px;
        font-size: var(--size-small);
        line-height: 1.5;
        color: var(--body);
      }
      figcaption a {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--outline);
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="lab">
      evidence · one reel with its play control, as the page ships it after
      #3396
    </div>
    <section class="part" id="evidence">
      <div class="w">
        <div class="top">
          <h2>See the interface evidence before you merge</h2>
          <p class="lede">
            Every pull request comes with a short film of the new screen working
            in the app.
          </p>
        </div>
        <figure class="reel">
          <div class="screen">
            <img
              class="frame"
              src="../../assets/landing-v6/evidence/reel-still.webp"
              width="960"
              height="600"
              alt="The opening frame of the reel on pull request #385 on erclx/frameboard"
            />
            <div class="bar">
              <span class="play"
                ><span class="glyph"></span><span>Play the reel</span></span
              ><span>5 s</span>
            </div>
          </div>
          <figcaption>
            The reel canon posted on
            <a>pull request #385 on erclx/frameboard</a>
          </figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
