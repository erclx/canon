# What a correct `/canon:target-setup indexes` run leaves behind against a bare folder of
# five raw markdown files with no frontmatter and no index.md. Read by
# `canon sandbox check`, which only asserts against what a run left behind
# and drives nothing itself. `scripts/sandbox/run.sh infra:indexes
# "/canon:target-setup indexes" bootstrap` drives this arm headlessly the same way
# it drives any `claude:target-setup` arm, category is not what gates it.
#
# Driven twice on 2026-09-07: the scan finds `docs/` as the sole candidate
# and the skill reaches `## Present candidates`, which lists it and asks
# which folder to bootstrap, a question no reply channel reaches on a single
# headless turn. Both runs left `docs/` untouched, at 9 and 4 turns
# ($0.137 and $0.120), and each phrased the follow-up differently ("Would
# you like me to bootstrap `docs/`? (yes / no — or name it explicitly if you
# want a different scope)" against "Which folder would you like to
# bootstrap? You can say `docs`, `all`, or `none`."). Both phrasings share
# `docs/` and `bootstrap`, so the reply pin below asserts the run reached the
# candidate question rather than only that nothing was written.

max_turns = 16

absent = ["docs/index.md"]

reply = ["docs/", "bootstrap"]

manual = [
  "The reply names docs/ as the sole candidate, its file count, and its frontmatter coverage, before asking which folder to bootstrap. Semantic: the exact phrasing varies run to run beyond the two pinned tokens, and the correctness of the paraphrase is a judgment no pattern can carry",
]

# Proves docs/architecture.md gained no frontmatter, without pinning the
# seeded body's prose, which a later rewrite of seed_bare_folder could reword
# without changing whether the run touched the file.
[[content]]
path = "docs/architecture.md"
pattern = '^# Architecture\n'
