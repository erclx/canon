# What a correct `/canon:ui-test` run leaves behind on the default arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.
#
# The e2e file is an ordinary project file and always landed inside the sandbox.
# The checklist is shared session scratch, which used to escape the tree as well
# as being conditional. The sandbox provisions outside the toolkit worktree now,
# so the escape is closed, and what keeps the checklist demoted is that the skill
# decides whether to write one at all.

# The precondition, asserted rather than described. No corpus installs into a
# target, so the project copy is absent and the plugin fallback is the only route
# to the slug transform. An arm that staged a copy of its own would resolve the
# project path and void the premise here, so the absence is asserted where that
# edit lands.
absent = [".claude/standards/skill.md", "standards/skill.md"]

paths = ["e2e/*.spec.ts", "src/components/*.test.tsx"]

# The skill writes a component test beside the component, adds a spec for the
# route change, writes the checklist under
# `.claude/`, and installs Playwright to run what it wrote. Nothing else on the
# branch is its to touch, and a run that edited `src/components/TaskList.tsx` has
# fixed the implementation rather than tested it.
#
# `node_modules/**` is here because the skill's body tells it to run the tests,
# which needs the install. A run on 2026-08-02 wrote 184 files under it and the
# scope reported every one as a violation, which was the declaration being wrong
# rather than the run.
#
# `bun.lock` and `test-results/**` are the rest of what running the tests
# produces, measured on 2026-08-02 once the tests got far enough to execute.
# Earlier runs never reached them, so the declaration read as complete while only
# covering the install half of what the skill's body asks for.
write_scope = [
  ".claude/**",
  "e2e/**",
  "src/components/*.test.tsx",
  ".canon/tmp/**",
  "node_modules/**",
  "bun.lock",
  "test-results/**",
]

# A clean run cost 21 turns on 2026-08-02, against 29 for the run before the
# fixture was corrected, where the skill spent its budget reporting the unmounted
# input. A run on 2026-09-03, from a branch that only rewrote the checklist's
# destination and touched no line here, came in at 31, one over the ceiling.
# That is a second sample showing the cost moved rather than one showing it
# held, so the ceiling stays until a third pass says which reading was noise.
max_turns = 30

manual = [
  "The checklist lands at `.canon/tmp/handoff/ui-checklist/task-filter.md`, which is the slug transform in `standards/slug.md` applied to branch `feat/task-filter`, with the leading type segment dropped. The transform appears in no skill body, so the filename is the evidence that the plugin fallback resolved. Semantic: the skill writes a checklist only for changes it judges visual-only, and a run on 2026-08-02 classified every change as behavioral and correctly wrote none. Declaring the path asserts that judgment rather than the citation, and goes red on a run the skill's own body permits",
  "The checklist carries the `- [ ]` checkbox syntax the skill's format fixes. Semantic: same conditional, since a format assertion over a file the run is allowed not to write cannot separate a wrong format from an absent file",
  "The spacing, padding, and color changes land on the checklist and the filter input does not. Semantic: the split between automatable and visual is the skill's judgment, and a pattern matching one item cannot tell a correct classification from a lucky one",
  "The chat output names the checklist path alone and does not repeat the checklist body. Unwired: the claim is about what the reply omits, and a negative substring passes on every reply that phrases it differently",
  "The failed Playwright run is reported rather than passed over. Unwired: no browser is installed in the sandbox, so the honest-degradation path is the only one reachable here and the working one stays untested",
]

# Every key above this line is top level. `max_turns` and all five `manual`
# entries sat below the content blocks until 2026-08-02, which in TOML bound them
# to the last block: the ceiling never asserted, the entries never reached the
# unchecked count, and coverage read the arm as armed the whole time.
# `contentArray` rejects that now.

# The routing this arm exists to check. The loading state is reachable by a
# component test, so it lands beside the component and never in `e2e/`. The route
# change needs a real browser to navigate, so it lands in a spec. A body that
# sends both to Playwright fails the first block.
[[content]]
path = "src/components/*.test.tsx"
pattern = 'Loading tasks'

[[content]]
path = "e2e/*.spec.ts"
pattern = '/archive'

# The seeded test survives. The skill adds to the existing file rather than
# replacing it, and a run that overwrote the file has deleted coverage while
# reporting that it added some.
[[content]]
path = "e2e/task-list.spec.ts"
pattern = 'task list renders the seeded tasks'

# A test for the empty state, which is the one component-layer change with a
# single correct reading. The filter input and the count-after-filtering cases
# are describable in wording no pattern anticipates.
[[content]]
path = "src/components/*.test.tsx"
pattern = 'No tasks|empty'
