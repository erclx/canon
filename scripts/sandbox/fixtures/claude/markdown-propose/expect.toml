# What a correct `/markdown-propose` Propose run leaves behind.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# Measured across five runs against this fixture while it was being written:
# 18, 41, and 12 turns on the shape that shipped, plus two earlier runs against
# a since-corrected fixture. The spread is real rather than noise, since one run
# spent extra turns cleaning banned punctuation out of its own draft. 45 sits
# above the widest observed rather than at the default, per
# canon/context/sandbox/headless.md.
max_turns = 45

# The slug is pinned by the invocation rather than left to the run, per the same
# rule the claude:intake arm carries.
paths = [
  ".canon/proposals/inflated-claims/01-CLAUDE.md",
  ".canon/proposals/inflated-claims/02-overview.md",
]

write_scope = [".canon/proposals/**"]

reply = [".canon/proposals/inflated-claims/"]

manual = [
  "The tagline change (no source anywhere in the tree) carries three labelled variants under 02-overview.md, and the framework-claim changes in both files carry one each. Semantic: which change gets Open: is a judgment about invention against correction, beyond what the presence patterns below can pin.",
  "The three variants on the tagline change differ in approach rather than in wording. Judgment: a near-rephrasing and a real alternative match identically against any pattern.",
  "Both framework-claim replacements match what docs/limitations.md already states. Semantic: whether the drafted text was actually recovered from that file, rather than independently invented to the same effect, is not something a pattern can tell apart.",
]

# 01-CLAUDE.md carries one corrected change: a diff fence, a reason, and an
# empty answer slot. No Open: and no variants, since the replacement already
# exists in the tree.
[[content]]
path = ".canon/proposals/inflated-claims/01-CLAUDE.md"
pattern = '^```diff$'

[[content]]
path = ".canon/proposals/inflated-claims/01-CLAUDE.md"
pattern = '^- \*\*Why:\*\* '

[[content]]
path = ".canon/proposals/inflated-claims/01-CLAUDE.md"
pattern = '^- \*\*You:\*\*$'

# 02-overview.md carries the second corrected change and the drafted one, so it
# is where the variant machinery has to show up.
[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^```diff$'

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^- \*\*Why:\*\* '

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^- \*\*You:\*\*$'

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^- \*\*Open:\*\*'

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^#### A'

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^#### B'

[[content]]
path = ".canon/proposals/inflated-claims/02-overview.md"
pattern = '^#### C'
