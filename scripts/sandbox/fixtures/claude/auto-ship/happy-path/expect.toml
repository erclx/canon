# What a correct `/canon:auto-ship` run leaves behind on the happy-path
# arm, once Step 7 and what follows it have run. Read by `canon sandbox check`.
# Patterns use TOML literal strings so a regex needs no backslash escaping.

# `#1242` routed Step 7 through a body carrying `disable-model-invocation`,
# which halted every chained run before it committed while a green board and a
# green gate both read the run as clean. Steps 1 through 6 already have their
# own arms, `prose-informational` and `prose-executable` beside this one among
# them, so this declares only what a run reaching Step 7 leaves that one
# halting before it would not: the completion line `auto-ship`'s own
# Output contract mandates.

# No max_turns yet. A real pass on 2026-08-30 came in at 74 turns, well past
# the 30 this row dropped for want of a number, which is what the drop was
# for. One sample of a chain whose cost follows however much capture, both
# doc syncs, and review find to do is not enough to set a ceiling from.

# `git-ship`'s sequence reaches this exact line only after memory capture, both
# doc syncs, staging, the commit, the branch rename, and the pull request have
# all run, with the draft marking landing before the CI watch. A chain halted
# at or before Step 7, silently or on a refused invocation, ends its reply
# somewhere else, which is what makes this the one assertion that would have
# failed `#1242` and every other stop point in the chain's own recovery table.
reply = ["Autoshipped (draft)"]

manual = [
  "The pull request itself opened, and opened as a draft. Unwired: the sandbox tree and the reply text are what expect.toml can read, and confirming the PR object needs a gh call this declaration has no channel for.",
  "Capture found something worth persisting and Step 9 ran Propose over the pen, leaving a receipt at .canon/memory/review/memory-review-add-farewell.md. Judgment: the fixture's plan carries no Risks or Questions and the run is a single headless pass with no user exchange, so a correct run may just as well report 'Nothing worth capturing' and skip Step 9, and either shape is consistent with a working chain.",
  "docs-sync and docs-fold left the tree exactly where a run with no public docs and no owning task would leave it. Semantic: both skills sync against what a session finds, and a project this small may give either nothing to change, so an assertion pinned to a specific edit would fail a correct run that found none to make.",
]
