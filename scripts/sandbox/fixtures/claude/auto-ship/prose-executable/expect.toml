# What a correct `/canon:auto-ship` run leaves behind on the
# prose-executable arm. Read by `canon sandbox check`. Patterns use TOML literal
# strings so a regex needs no backslash escaping.

# The diff here is all markdown, same as `prose-informational`, but
# `.claude/skills/deploy-check/SKILL.md` sits under a behavior path, so the
# extension half of Step 5's skip test passes and the path half fails. A
# skipped review here is the defect this arm exists to catch, which is the
# mirror image of its sibling's absent assertion below.

# No max_turns yet. A first pass on 2026-08-30 came in at 78 turns, well past
# the 30 this row dropped for want of a number, and a second on 2026-08-31 came
# in at 116. The two disagree on how much this chain costs, which is one more
# reason no ceiling is declared here yet rather than a reason to average them.

# `review-branch` writes this file when it runs. A classifier that reads the
# markdown extension alone and skips despite the behavior path never creates
# it.
paths = [".canon/review/branch-tighten-deploy-check.md"]

# The same Step-7 completion signal the other two autoship arms pin.
reply = ["Autoshipped (draft)"]

manual = [
  ".claude/skills/deploy-check/SKILL.md carries the stop condition the plan describes. Judgment: the wording is the run's own, and a substring anchored to it goes red on any correct rephrasing.",
  "The pull request itself opened, and opened as a draft. Unwired: confirming the PR object needs a gh call this declaration has no channel for.",
]

