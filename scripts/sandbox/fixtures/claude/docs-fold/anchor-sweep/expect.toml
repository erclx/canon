# What a correct `/docs-fold` run leaves behind on the anchor-sweep arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# Step 6 reports and never writes, so every file assertion here is a negative.
# The record has to come out of the run byte-identical: no anchor refreshed on
# the entry the sweep flagged, none written onto the entry that carries none,
# and no claim edited beside either marker.

# The reply is what keeps the negatives honest. A run where Step 6 never fires
# leaves the record untouched and satisfies every content pin, so an
# all-negative declaration passes hardest on the skip it exists to detect. These
# substrings fail that run and nothing in the tree can.
#
# The third names the decision citing `CLAUDE.md`, a file at the repository root
# and the case where the match rules read as contradicting each other: it is a
# file citation and it is also a single segment. The skip reaches folders alone,
# so this entry has to fire, and the decision title is what says it did.
reply = [
  "Anchor stale",
  "src/gov/install.ts",
  "The toolkit states its rules in one file",
]

write_scope = [".claude/**"]

# Every top-level key sits above the first [[content]] block. A bare key written
# below one belongs to that table in TOML, and the whole declaration then fails
# to parse rather than silently asserting less.
manual = [
  "The run reports neither the drift entry nor the planner entry. Unwired: `reply` takes positives only, since a negative substring passes on any reply that words the thing differently",
]

# Three clean runs cost 16, 17, and 18 turns on 2026-08-06. Set above the widest
# so the ceiling catches a blowup rather than firing on every run, and below the
# harness default of 30 so it asserts something that cap does not already enforce.
max_turns = 26

# The flagged entry keeps the anchor it arrived with. Refreshing the date is the
# failure this arm exists to catch, because the sweep measured nothing and a
# date it wrote would assert a read that never happened.
[[content]]
path = ".claude/ARCHITECTURE.md"
pattern = 'installer at `src/gov/install\.ts` carries 4 rules today, which is small enough that copying costs nothing and a pointer would cost every project a resolver\. Measured at a1b2c3d4 on 2026-07-20\.$'

# The unanchored entry stays unanchored. Its cited path changes on this branch
# too, so a sweep keying on the path rather than on the anchor annotates it, and
# a writer ignoring the forward scope dates a decision written before the rule.
[[content]]
path = "canon/ARCHITECTURE.md"
pattern = 'Overwriting keeps the target uniform and discards the local edits a project made deliberately, and those edits are the reason install copies in the first place\.\n\n### The planner runs ahead of the installer$'

# The control entry is anchored and its cited path never enters the diff, so it
# is the one the sweep has to stay silent about. Pinned whole, since an edit
# anywhere in it means the pass reached an entry no signal pointed at.
[[content]]
path = ".claude/ARCHITECTURE.md"
pattern = '^`src/gov/plan\.ts` resolves which rules a stack pulls in before anything is written, chosen over resolving inside the writer\. The planner reaches 3 stacks and a single pass over them is cheap, while a writer that resolves as it goes cannot report what it is about to do\. Measured at a1b2c3d4 on 2026-07-20\.$'

# The root-file entry is reported and still not written. Its cited count moves
# from 2 rules to 4 on this branch, which is exactly the claim a refreshed anchor
# would silently bless without anyone re-reading it.
[[content]]
path = ".claude/ARCHITECTURE.md"
pattern = '^`CLAUDE\.md` carries 2 standing rules today, chosen over a folder of path-scoped files\. That is few enough for a reader to take in one pass, and splitting them would cost more to find than to read\. Measured at a1b2c3d4 on 2026-07-20\.$'
