# What a correct `/docs-fold` run leaves behind on the classify-findings arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# Two uncommitted edits stage two shapes Step 10's classify call exists to
# catch, after Step 3 and Step 7 have already run:
#
# `canon/context/retrieval.md` appends a branch-narrated re-measurement below
# the count it restates, instead of rewriting the count in place. Step 7's own
# session judgment reliably folds this on its own, measured across two clean
# runs, since the diff sits inside the entry Step 7 already maps to and reads.
# It is kept here as an end-to-end content check on the final doc, not as
# evidence Step 10 ran, since Step 7 alone is sufficient to produce it.
#
# `canon/wireframes/search-panel.md` appends a bullet naming the source file
# implementing the panel, which is a `MOVE` verdict rather than a `REPLACE` or
# `HISTORY` one. Nothing else in the fold touches a wireframe's prose this way:
# Step 7 never reads `canon/wireframes/`, and Step 4's own sweep only checks
# for a contradicted literal string or an uncovered surface, neither of which
# this edit is. Only Step 10's classify call can remove it, which is what
# makes this half of the arm evidence that the step actually ran, rather than
# the retrieval.md half above.

# No backend is configured in the sandbox, so the regex layer is the only
# deterministic one. `diffPatternVerdict` never returns REPLACE, only KEEP,
# HISTORY, or MOVE. The wireframe edit names a `.tsx` file in backticks, which
# `src/context/classify/patterns.ts`'s `MECHANISM_IN_WIREFRAME` pattern
# matches, firing a regex-decided MOVE that `classify.md` says to cut outright.

# Pinned on the report line itself, not on the source-file name alone. A run
# that mentions "SearchPanel.tsx" while narrating an incorrect move into
# another file, or while describing a rewrite that never actually cut the
# sentence, still passed a looser check on that name. The exact `✂ Cut:` line
# only prints when Step 10 itself applied a regex-decided MOVE per
# `classify.md`'s Report section, so it is the one string that distinguishes
# "Step 10 ran and cut it" from every other way the file could end up clean.
# `canon sandbox check`'s content matcher runs every pattern with the `m`
# flag (`src/sandbox/expect.ts`), which makes `$` match before any newline
# rather than only at the true end of file, so an end-of-paragraph anchor on
# the surviving text cannot rule out a trailing addition either; a literal
# string unique to the correct code path is what this arm has instead.
reply = ["✂ Cut: canon/wireframes/search-panel.md"]

write_scope = ["canon/**"]

# Unmeasured against a live run. Set to the harness default rather than a
# number nobody has read a clean run against yet.
max_turns = 30

manual = [
  "The old count, 42,000, no longer appears anywhere in canon/context/retrieval.md. Unwired: `absent` asserts over paths rather than content, and there is no path to assert absent here.",
  "No narration phrase (`moved again`, `at this branch`, or similar) survives in canon/context/retrieval.md. Unwired: same reason.",
  "`src/features/search/SearchPanel.tsx` no longer appears anywhere in canon/wireframes/search-panel.md, and no new section such as `## Hidden contracts` was added to canon/context/retrieval.md to hold it. Unwired: same reason, and the `m`-flag content matcher above cannot express an end-of-file anchor either.",
]

# The new count is stated once, in the decision's own sentence, once the
# narrated paragraph below it has been folded back in rather than left beside
# the count it restates.
[[content]]
path = "canon/context/retrieval.md"
pattern = "58,500 chunks"

# The decision's own reasoning survives the rewrite. A run that dropped the
# paragraph instead of rewriting it in place loses the reasoning along with
# the narration.
[[content]]
path = "canon/context/retrieval.md"
pattern = "blurs the boundary a citation should point at"

# The wireframe's original behavior bullets survive the cut. A run that
# dropped the whole file, or the whole section, rather than cutting the one
# misplaced bullet, fails here even though the mechanism mention is also gone.
[[content]]
path = "canon/wireframes/search-panel.md"
pattern = "streaming in below it as the query lengthens"

[[content]]
path = "canon/wireframes/search-panel.md"
pattern = "the document title, a one-line snippet, and a relevance score"

