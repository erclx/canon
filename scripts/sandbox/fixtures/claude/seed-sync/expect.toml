# What a correct `/canon:seed-sync` run leaves behind on the default arm,
# through the propose pass alone. Read by `canon sandbox check`. Patterns use TOML
# literal strings so a regex needs no backslash escaping.
#
# The skill's product is a proposal a reader judges, so the mechanical claims are
# the path it lands at, the slug inside it, and the two markers separating a
# proposal that found drift from an empty file. The drift reasoning itself sits
# in `manual`.

# A clean run cost 28 turns on 2026-08-03 against the default cap of 30.
# Correcting from that observation lands on the cap anyway, since a ceiling sits
# above the cost it measured and the only room above 28 is the two turns to the
# cap. This arm has almost none of that gap to spare.
max_turns = 30

# The filename carries the slug transform in `standards/slug.md` applied to
# branch `chore/seed-drift`. `seed-sync.sh` checks that branch out explicitly, so
# this path does not move with the machine's `init.defaultBranch`.
#
# `chore` comes off because the transform drops a leading segment naming a type
# when a further segment follows it, which leaves `seed-drift`. The declaration
# expected `chore-seed-drift` until a run measured the skill writing the stripped
# form, so the type-carrying spelling here predated the rule rather than testing
# it. The `claude/review`, `claude/memory-review`, and `claude/ui-checklist`
# declarations carried the same spelling and were corrected from this rule rather
# than from a run of their own.
paths = [".canon/review/seed-audit-seed-drift.md"]

# Propose writes the proposal and nothing else. Step 5 applies edits to the
# seed files one at a time behind a permission dialog, which a headless propose
# pass never reaches, so a run that touched those files applied without approval.
# The 2026-08-03 run wrote exactly the one file this glob admits, so the scope is
# measured rather than projected.
write_scope = [".canon/review/**"]

manual = [
  "The truncated `CLAUDE.md` sections are proposed as Add rather than as Update. Semantic: which verdict a missing section earns is the skill's judgment and both spellings put the section name in the same file",
  "The mutated `## Context` bullet is judged by appearance rather than by history, since the skill runs `canon` from a global install carrying no `.git`, and reads as Stale rather than Customized, proposed as an Update rather than recorded in the scope table alone. Semantic: the customized-versus-stale call is the reasoning under test and a pattern matching either label cannot tell a correct call from a coincidence",
  "No target file is written before the user fills in a `Decision:`. Semantic: an assertion naming what a run must not have written passes for the file being elsewhere rather than for the run being correct",
]

# Every key above this line is top level. A bare key written below a
# `[[content]]` header belongs to that table in TOML, so anything moved down here
# would parse clean and assert nothing.

# The slug a second time, inside the file rather than in its name, so a proposal
# written to the right path from the wrong branch still goes red.
[[content]]
path = ".canon/review/seed-audit-seed-drift.md"
pattern = '^# Seed audit: seed-drift'

# The scope table is what reports a file the pass read and left alone, so a
# proposal carrying items without it describes a subset while reading as whole.
[[content]]
path = ".canon/review/seed-audit-seed-drift.md"
pattern = '^## Scope'

# One numbered pending item. This is the assertion separating a proposal that
# found drift from a well-formed file that found none, which is the failure a
# path check alone reports green.
[[content]]
path = ".canon/review/seed-audit-seed-drift.md"
pattern = '^## 1\. 📝 '
