# What a correct `/canon:canon-rollout` run leaves behind when one target is held
# in two clones and only one of them is current. Read by `canon sandbox check`.
# Patterns use TOML literal strings so a regex needs no backslash escaping.

# The arm exists for the one failure in this skill whose damage lands in a
# repository this toolkit has no test coverage over. A worker branching from a
# stale base ships a diff against a tree the remote already moved past, and the
# census behind this rule found three local clones still owing the repair where
# every one of them was behind its remote and nothing else. Picking by listing
# order is also the shape a real repair took, which ran in one clone while the
# count was taken against another.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so an array written at the bottom parses
# clean and asserts nothing.

# Measured rather than defaulted. The first driven run took 9 turns at $0.21 on
# sonnet, reading two histories, fetching, deciding, and writing two lines. The
# ceiling sits above that with room for a run that reads the skill body twice,
# and it is one sample, so a run landing near it is a signal to re-measure
# rather than to raise it.
max_turns = 15

# The control, and the proof that the run fetched. Both clones are staged by
# provisioning, so the two config files prove the arm ran against the pair it
# claims rather than against a tree holding one.
#
# `FETCH_HEAD` is the load-bearing entry. `git clone` does not write one, checked
# against a provisioned tree, so the file exists in `kestrel-a` only if something
# fetched there during the run. That is the whole decision this arm scores: the
# clones read level until a fetch, so a run that skipped it and still answered
# correctly guessed between two checkouts that looked identical. This entry was
# a `manual` line until the first driven run showed the file in its write list.
paths = [
  "targets/kestrel-a/canon/config/config.json",
  "targets/kestrel-b/canon/config/config.json",
  "targets/kestrel-a/.git/FETCH_HEAD",
]

# The narration scopes the run to a decision, so a correct one branches nothing
# in either clone. The stale clone is the one that matters, since a branch cut
# there is the damage the currency rule exists to prevent, and the current clone
# is listed beside it because a run that ignored the scope and started building
# is also a wrong run whatever it picked.
#
# A newly created branch in a repository this small writes a loose ref, so the
# path is the branch. Both worktree folders are named as well, since
# `session-worktree` builds `.claude/worktrees/<name>/` inside the target it
# enters and that folder is the other thing a build leaves behind.
absent = [
  "targets/kestrel-a/.git/refs/heads/chore/agents",
  "targets/kestrel-b/.git/refs/heads/chore/agents",
  "targets/kestrel-a/.claude/worktrees",
  "targets/kestrel-b/.claude/worktrees",
]

# Two destinations, and the second is what the first driven run corrected. A
# scope admitting scratch alone failed this arm for doing the one thing it
# exists to require: the fetch wrote `FETCH_HEAD` in both clones plus the
# remote-tracking ref, the log behind it, and three objects in `kestrel-a`, and
# all seven read as escapes against a skill that had behaved correctly.
#
# What stays out is everything a fetch never touches. No working-tree path under
# either clone, nothing under `targets/origin.git/`, so a push to the shared
# remote still fails here, and no `refs/heads/**`, so a run that cuts
# `chore/agents` fails this as well as the `absent` entry above. Remote-tracking
# refs move on a fetch and local heads do not, which is what makes the split
# between those two ref spaces the right place to cut.
#
# One shape passes unreported, and it is accepted rather than unseen. `objects/**`
# is admitted because a fetch writes objects and nothing scopes that narrower, and
# a commit writes objects too, so a run committing on a detached head clears this
# scope and every other assertion here: it moves no local head, so the `absent`
# entries hold, and it changes no file the `paths` entries read. Anyone widening
# this scope for a different reason is widening it from there rather than from the
# split above.
write_scope = [
  ".canon/tmp/rollout/**",
  "targets/*/.git/FETCH_HEAD",
  "targets/*/.git/objects/**",
  "targets/*/.git/logs/refs/remotes/**",
  "targets/*/.git/refs/remotes/**",
]

# Empty rather than absent, because this arm's only tested path is the refusal:
# the narration tells the run to dispatch no worker, so a correct run reaches
# neither clone's own checkout and touches nothing `run.sh` watches. Declaring
# the bound at zero turns a run that reached the toolkit's own scratch anyway
# into a mechanical failure instead of the unattributed warning `escape_roots`
# alone produces. A future arm actually driving the dispatch widens this from a
# measured run rather than from a guess at what a worker touches.
escape_scope = []

# Fixture vocabulary rather than a phrasing the run chooses. A run that never
# read the pair names neither clone, which is what separates a wrong pick from
# an idle session. It does not separate the two picks from each other, since a
# correct answer names both clones and so does a wrong one. The two content
# blocks below are what reach that difference.
reply = ["kestrel-a", "kestrel-b"]

manual = [
  "The reason given for refusing kestrel-a is that it is behind its remote, rather than some other property that happens to separate the two. Judgment: the narration fixes the line and leaves the reason as free text, and no pattern reads whether the reason is the right one. The first driven run gave the right one, naming the commit count and both short SHAs.",
  "The run treated the two directories as one target rather than as two. Semantic: the assertions below read which path was chosen and cannot tell a run that resolved a shared origin from one that picked between two projects it thought were unrelated.",
  "The run's `sessions.new` list is empty and `sessions.watched` is true. Semantic: a nested background dispatch reports beside the verdict rather than inside it, so no declaration key here reads it and `escape_scope` above deliberately does not cover it. This is the arm the dispatch incident came from, and a `watched` of false means the registry was absent rather than that the run dispatched nothing.",
]

# The decision itself, in the shape the narration fixes. Anchored to the line
# start under the `m` flag the checker compiles with, so the clone named on the
# dispatch line is the assertion rather than a clone mentioned anywhere in the
# file.
#
# This is the half `reply` cannot reach. A run that picks by listing order
# writes kestrel-a here and fails, where every other assertion in this arm
# passes for it, since picking wrong and branching nothing leaves the same tree
# as picking right and branching nothing.
[[content]]
path = ".canon/tmp/rollout/dispatch.md"
pattern = '^Dispatch into: targets/kestrel-b'

# The refusal, pinned separately from the pick. A run naming the current clone
# and saying nothing about the stale one has answered half the question, and a
# wave reporting only where it dispatched leaves a clone nobody knows was
# skipped.
[[content]]
path = ".canon/tmp/rollout/dispatch.md"
pattern = '^Refused: targets/kestrel-a'
