# What a correct `/canon:project-commands` run leaves behind on the missing arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# A clean run cost 2 turns on 2026-07-31. Set above that rather than at it, so
# the ceiling catches a blowup instead of firing on ordinary variance. The guard
# fires before anything is read, which is why this is the cheapest of the three.
max_turns = 8

# The whole assertion. `dev` in package.json touches this file, so its presence
# proves the skill fell back to a source the guard forbids. An absence check is
# the right shape here because the correct behavior is that nothing ran.
absent = ["fell-back.txt"]

# The path is the load-bearing token. A guard that fires without naming the file
# it wants leaves the reader nothing to act on, and the name is the one part of
# the reply that cannot be reworded.
reply = ["canon/context/development.md"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply does not suggest a command reconstructed from package.json. Semantic: a negative substring passes on every reply that phrases the suggestion differently",
]
