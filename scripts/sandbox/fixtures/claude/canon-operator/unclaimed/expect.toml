# What a correct `/canon:canon-operator` run replies on a target holding a
# folder at a root the toolkit dropped. Read by `canon sandbox check`. Patterns
# use TOML literal strings so a regex needs no backslash escaping.
#
# The arm scores a report rather than a route. Every other entry the operator
# reads names a command or a skill, and this one names neither, so the failure it
# covers is a run that treated an unclaimed folder as drift and proposed a move.

# Declared at the default cap. The route resolves off one report read with
# nothing to execute behind it, so a clean run should land well under it.
max_turns = 30

# Both tokens are needed. The first run of this arm answered from a filesystem
# walk of its own, because the CLI on that machine predated the `reverse` field
# and returned no such key, and `dropped` landed in the prose describing that
# walk while the arm scored nothing. Provisioning now refuses a CLI that reports
# no reverse section, and the folder name is pinned beside the verdict so a reply
# reaching the word by another route does not carry the assertion on its own.
reply = ["dropped", "prompts"]

# Nothing moved. The operator reports the folder and no command in the toolkit
# touches it, so a run that relocated it under `.claude/` or deleted it decided
# correctly and then acted anyway, which is the one wrong outcome a reply pin
# cannot see. The folder rather than a file inside it, since which file the
# fixture restores is history's call.
paths = ["prompts"]

absent = [".claude/prompts"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply does not offer to delete, move, or sync the folder. Semantic: a negative substring passes on every reply that phrases the wrong proposal differently, and proposing a move is the specific mistake the attribution work exists to prevent",
  "The `since` revision is reported as where the content was published rather than as when the folder was dropped. Semantic: both readings put the same short hash in the reply",
  "The verdict came off the report's `reverse` section rather than from the run listing the tree itself. Semantic: both routes name the same folder, and provisioning proves the section attributed it without proving the run is what read it",
]
