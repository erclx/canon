# What a correct `/canon:canon-operator` run replies on a target the toolkit has
# never touched. Read by `canon sandbox check`. Patterns use TOML literal strings
# so a regex needs no backslash escaping.
#
# The arm scores a routing decision rather than an artifact. The skill is a
# router that writes nothing on this path, so what it can get wrong is which
# skill the reply hands off to, and `reply` is the only kind that reaches it.
#
# Being reply-only, this arm reports FAIL under a standalone `canon sandbox check`
# against a provisioned tree, with `no assertion ran against this sandbox`. That
# is the checker refusing a pass it asserted nothing for rather than a defect
# here: the reply arrives with the run envelope, so only `scripts/sandbox/run.sh`
# can score this arm. The three siblings carry tree assertions and score either
# way.

# The one arm of the four with no observed cost. Its 2026-08-04 run passed and
# `record_run` failed to write the record, so the envelope carrying the turn count
# went with it. The ceiling stays at the cap on the shape of the run instead: it
# continued into `target-setup`, installed six domains and ran verify behind them,
# which is what `claude/target-setup/fresh` does at 20 turns against the same cap.
max_turns = 30

# The route, named by the skill the body hands off to rather than by the command
# that skill runs. `target-setup` resolves a stack before it calls `canon init`, so
# a reply routing correctly and naming only the skill would fail a pin on the
# command while the routing decision was right.
#
# What this scores is the `managed` gate. Without it a directory the toolkit has
# never touched reports every seed as missing, which routes a fresh project to
# the skill that reconciles seed drift section by section instead of to the one
# that installs.
reply = ["target-setup"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply does not route to `seed-sync`. Semantic: a negative substring passes on every reply that phrases the wrong route differently, and the positive above already fails a reply that named only the seed skill",
  "The three `canon docs` calls ran before anything was decided. Unwired: the claim is about which commands were invoked, which the envelope does not carry",
  "Nothing was installed inline. Semantic: a handoff to `target-setup` may legitimately continue into that skill and write the whole scaffold, so no path or scope assertion separates the router doing the work from the router routing to something that does it",
]
