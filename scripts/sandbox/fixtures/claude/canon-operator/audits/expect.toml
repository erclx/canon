# What a correct `/canon:canon-operator` run replies on a target carrying two of
# the four audit surfaces. Read by `canon sandbox check`. Patterns use TOML
# literal strings so a regex needs no backslash escaping.
#
# The arm scores the condition on each offer rather than the offer itself. A
# reply naming all four audits passes a check that only looks for the two the
# target can answer, so the withheld one is what separates a conditioned route
# from a list of every command the CLI registers.

# The reply lists commands rather than running them, so the run costs less than
# the routes that execute. The ceiling takes the 2026-08-14 passing run at 7
# turns and adds headroom rather than pinning the number, since the cap is
# asserted after the run rather than enforced during it and a ceiling equal to
# the one observation fails the next run that is slower for an unrelated reason.
# A truncated run still fails, since it reports one turn past the runner's cap
# and only a declaration above that cap passes the assertion.
max_turns = 12

# The two audits whose surface the fixture staged, named as commands since
# `## Route` states the offer as the command a user picks, plus the lifecycle row
# the same target fires. The fixture stages no install, so the scaffold row and
# two audit conditions fire together, and the body ranks the row first with the
# offers alongside it rather than behind it. Pinning the handoff beside the offers
# is what separates that ranking from a reply reaching the audits by dropping the
# handoff.
reply = ["setup", "canon context audit", "canon records validate"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The scaffold handoff is named ahead of the audit offers rather than behind them. Unwired: the reply pins are an unordered substring set, so a reply that offers the audits and mentions the handoff last carries both tokens",
  "The reply does not offer `canon comments scan`. Semantic: a negative substring passes on every reply that phrases the withheld offer differently, including one that never considered it",
  "The offer names `plans` as the record kind and no other. Semantic: the fixture stages one of the four record folders, and a reply naming every kind has skipped the per-folder condition while still carrying the command token",
  "The audits were offered rather than run. Unwired: the envelope carries the reply, not whether a command executed, so an audit fired unasked reads the same as one listed",
  "No audit finding was treated as a reason to stop. Semantic: the fixture stages a context entry short of the required sections, and a run that reports the finding as a blocker phrases it differently every time",
]

# The staged surfaces survive. An audit reads and never writes, so a run that
# changed either file ran something other than the audit it offered.
[[content]]
path = "canon/context/billing.md"
pattern = 'Subscriptions renew nightly'

[[content]]
path = ".canon/plans/feature-invoice-retry.md"
pattern = 'Retry a timed-out renewal once'
