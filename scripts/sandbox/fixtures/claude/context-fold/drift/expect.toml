# What a correct `/context-fold` run leaves behind on the drift arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# Compared against the envelope's `num_turns`, which is not the same unit as the
# harness `--max-turns` cap: a run capped at 20 reported 21 num_turns on
# 2026-07-30. Set above observed cost so the ceiling catches a blowup rather than
# firing on every run, which would be a vacuous assertion pointing the other way.
max_turns = 30

# Both plans stay live. Marking an outcome settles nothing about a plan, which
# the merge settles through `canon tasks archive`, so a run that moved the
# closing task's plan has swept on a tick this same run wrote three steps
# earlier. The second path is the control that was never cited by any task.
paths = [
  ".canon/plans/feature-postgres-migration.md",
  ".canon/plans/feature-some-old-plan.md",
]

# No plans archive. An `absent` entry over the live paths would pass on a run
# that created the folder and moved nothing, and the folder is what a sweep
# leaves behind whatever it decided to carry.
absent = [
  ".canon/plans/archive/feature-postgres-migration.md",
  ".canon/plans/archive/feature-some-old-plan.md",
]

# The arm runs under `bypassPermissions`, because no permission mode both allows
# writes under `.claude/` and scopes them. This is what replaces the denial count
# the envelope can no longer supply. The record root is named beside it, since a
# run that moved a plan would write there and nowhere under `.claude/`.
write_scope = [".claude/**", ".canon/**"]

# Prose the checker cannot assert, each with the reason it stays here. Kept beside
# the mechanical assertions rather than left in the scenario's log lines, which is
# the only thing that stops them rotting once the rest are machine-checked.
manual = [
  "ARCHITECTURE.md storage section rewritten from SQLite to Postgres. Semantic: a pattern matching Postgres passes on a sentence saying the run did not migrate to it",
  "REQUIREMENTS.md non-goals updated, multi-user moved in-scope. Semantic: the claim is which side of a list an item sits on, and a pattern matching the item passes from either side",
]

[[content]]
path = ".canon/tasks/v01.0-postgres-migration.md"
pattern = '^- \[x\] Outcome: tasks persist in Postgres'

# The pointer stays where the fixture wrote it. A run that retargeted the line
# without moving the plan leaves the only pointer to it aimed at a path holding
# no file, and `.canon/plans/` is gitignored so nothing recovers it.
[[content]]
path = ".canon/tasks/v01.0-postgres-migration.md"
pattern = '^Plan: \[feature-postgres-migration\]\(\.\./plans/feature-postgres-migration\.md\)'
