purpose = "tooling inject base ships the phase-label-gate workflow through the base config rather than leaving it checkout-root only."

paths = [
  { path = ".github/workflows/phase-label-gate.yml", why = "Lands at the same relative path a target's own .github/workflows/ resolves." },
  { path = ".github/workflows/pr-local-preview.yml", why = "Ships beside the gate in the same inject." },
  { path = ".github/workflows/verify.yml", why = "Every base inject already carried it, so a missing one means the inject regressed." },
]

manual = [
  "The seeded copy's triggers, `if:`, and job name match the checkout-root original, and it deliberately carries no Install Dependencies step, since `bunx` needs no local dependency tree and the step would fail outright on a target with no lockfile of its own. Semantic: a content pin can confirm the scan step invokes the published CLI, but cannot confirm the rest of the job shape was copied rather than reinvented",
  "The checkout-only `src/cli.ts` path never leaked into the seeded copy. Semantic: `test()` runs per line under the `m` flag, so a negative pattern matches on any line that lacks the substring rather than asserting no line carries it, which the single scan-step pin below already covers by naming the one invocation the step takes",
]

[[content]]
path = ".github/workflows/phase-label-gate.yml"
pattern = 'bunx -y @erclx/canon labels scan'
why = "The scan step names the published CLI rather than this checkout's source tree. A verbatim copy of the checkout-root file would fail here, since a target has no src/cli.ts to resolve."
