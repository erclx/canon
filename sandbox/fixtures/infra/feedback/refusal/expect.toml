purpose = "canon feedback refuses a report with no Proposed fix section, run outside the checkout with the report on stdin."

paths = [
  { path = "install/refusal.log", why = "The refusal message, which the content entries read." },
  { path = "install/refusal-status.txt", why = "The exit status the run captured." },
  { path = "install/refusal-stdout-bytes.txt", why = "The stdout byte count the run captured." },
]

absent = [
  { path = "install/.canon", why = "No record root opened under the working directory. A report that passes validation files a real issue outside the tree, so this is all the sandbox can see of the refusal." },
]

manual = [
  "The refusal reaches a producer as a repair it can act on. Semantic: a pattern can pin the field name but cannot tell a sentence that reads as an instruction from one that reads as a crash",
]

[[content]]
path = "install/refusal.log"
pattern = 'missing its "### Proposed fix" section'
why = "Names the omitted field rather than a generic shape failure. Every required field appears in the full list, so the pattern pins the missing-field clause."

[[content]]
path = "install/refusal.log"
pattern = '### Surface, ### Observed, ### Proposed fix'
why = "The repair, being the list of what a conforming report carries."

[[content]]
path = "install/refusal-status.txt"
pattern = '^1$'
why = "Refused rather than written. A zero would be the command reporting success on a report it should not accept."

[[content]]
path = "install/refusal-stdout-bytes.txt"
pattern = '^0$'
why = "The success path prints the written path on stdout, so any byte means a piping consumer read a path for a report never filed."
