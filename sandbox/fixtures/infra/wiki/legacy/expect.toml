# What a correct `canon wiki init` run leaves behind on the legacy arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The arm's whole assertion, and a pair rather than a single path. The scaffold
# landing proves the verb ran, and the authored page surviving proves it reported
# the root folder rather than moving it. Asserting only the scaffold would read
# green on a run that migrated the page away, which is the one failure this arm
# exists to catch.
paths = ["wiki/setup.md", ".claude/wiki/index.md"]

# No `max_turns`. The arm runs the CLI directly with no agent driving it, so no
# envelope is produced and a ceiling here would sit permanently skipped rather
# than assert anything.

# Prose the checker cannot assert, each with the reason it stays here. Both are
# about stderr, and the reply kind reads the envelope, which this arm has none of.
manual = [
  "The run warns that wiki/ was found at the target root and is not migrated. Unwired: the warning goes to stderr, and no assertion kind reads it",
  "The warning names the folder rather than the individual page. Unwired: same stderr, and the claim is which of two names the line carries",
]
