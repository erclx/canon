# What a correct `canon wiki init` run leaves behind on the init arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The scaffold lands under `.claude/`, and nothing lands at the root. The absence
# is the half that would have caught the pre-move behavior, so it is asserted
# rather than assumed from the presence check above it.
paths = [".claude/wiki/index.md"]

absent = ["wiki"]

# No `max_turns`. The arm runs the CLI directly with no agent driving it, so no
# envelope is produced and a ceiling here would sit permanently skipped rather
# than assert anything.

[[content]]
path = ".claude/wiki/index.md"
pattern = '^title: Wiki$'
