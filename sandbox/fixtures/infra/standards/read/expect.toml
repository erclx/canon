# What `canon standards skill` leaves behind when it runs from a target holding
# no standards folder of its own. Read by `canon sandbox check`. Patterns use TOML
# literal strings so a regex needs no backslash escaping.
#
# This is the arm for the last root in `src/standards/read.ts`, the package
# corpus that is the only root a target has. `src/standards/read.test.ts`
# already covers the resolve against fixture roots. What only this arm reaches is
# the command running from a working directory outside the toolkit checkout,
# where `PROJECT_ROOT` comes off the module's own location rather than off `pwd`.

paths = ["install/read-frame.log", "install/read-body.md"]

# The premise, asserted rather than assumed from the banner. A resolve that
# answered from the authoring root would report the same document and a content
# pin on the body alone would pass, so the absence is what makes the `<canon>`
# prefix below mean the package corpus won rather than a project copy.
#
# `.claude/standards` is named alongside it because a target left holding one
# from an older install must not resolve through it any more.
absent = ["install/.claude/standards", "install/standards"]

# Declared above the content blocks deliberately. A bare key below a
# `[[content]]` header binds to that table rather than to the document.
#
# No `max_turns`. The arm runs the CLI directly with no agent driving it, so no
# envelope is produced and a ceiling here would sit permanently skipped.
manual = [
  "The body carries the standard with its frontmatter stripped. Semantic: a pattern can pin the first heading but cannot tell a `---` block that was removed from one that was never there",
  "No shipped skill body invokes this verb, so the arm covers the command rather than a caller. Semantic: an assertion over one sandbox cannot see the catalog it is not measuring",
]

# The winning root. `<canon>` is the one label no project path can produce, since
# `standardRoots` spells the other two as `.claude/standards` and `standards`,
# and both are relative to a root a report could join. A pattern naming the
# standard without the prefix passes whichever root answered.
[[content]]
path = "install/read-frame.log"
pattern = '<canon>/standards/skill\.md'

# The read returned the document rather than the miss path, which prints a
# warning and the catalog to stderr and writes nothing to stdout.
[[content]]
path = "install/read-body.md"
pattern = '^# Claude skill reference$'
