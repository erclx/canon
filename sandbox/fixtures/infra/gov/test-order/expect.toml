purpose = "canon gov test-order on a history with one module per verdict exits 2 with a pure-data record on stdout."

paths = [
  { path = "test-order-record.json", why = "The record the verb printed on stdout." },
  { path = "test-order-frame.log", why = "The frame rendering on stderr." },
  { path = "test-order-status.txt", why = "The exit status the run captured." },
]

manual = [
  "The commit hashes the record names are the commits the fixture wrote, in the order it wrote them. Semantic: a pattern can pin a subject to an array but cannot tell a correct hash from a well-formed wrong one",
  "The frame's Read past line reports 0 because the fixture stages only .ts files. Semantic: an arm that stages no unreadable path cannot demonstrate that one would be named rather than dropped",
]

[[content]]
path = "test-order-record.json"
pattern = '"findings":\[\{"subject":"src/parser\.ts"'
why = "Each verdict array holds one member here, so anchoring the subject to the array's opening brace separates a module classified correctly from one merely mentioned in the record."

[[content]]
path = "test-order-record.json"
pattern = '"satisfied":\[\{"subject":"src/reader\.ts"'
why = "Pinned by position for the same reason as the findings entry."

[[content]]
path = "test-order-record.json"
pattern = '"unclassified":\[\{"subject":"src/seed\.ts"'
why = "Pinned by position for the same reason as the findings entry."

[[content]]
path = "test-order-record.json"
pattern = 'the implementation predates the range'
why = "A module the range modified rather than added has to say why it could not be read. An unclassified verdict with no reason would satisfy the pin above and tell a reader nothing."

[[content]]
path = "test-order-record.json"
pattern = '"scope":\{"extensions":\[""?\.ts'
why = "Coverage is stated on every run rather than implied. A record without scope reports verdicts over a corpus it never names."

[[content]]
path = "test-order-status.txt"
pattern = '^2$'
why = "The exit a finding produces. The verb reports rather than gates and no stage consumes the code, so a drift to 0 would tell any caller branching on it that the tree is clean."

[[content]]
path = "test-order-frame.log"
pattern = '→'
why = "A --json run keeps stderr to warnings while stdout holds the record alone. Each finding leaves a `subject → test` warning there, so this catches one sent to stdout or quieted."

[[content]]
path = "test-order-record.json"
pattern = '^\{"ok":true'
why = "The record opens as data with nothing printed ahead of it."
