purpose = "canon sync --check --json on a target with a correct layout and stale content reports the drift, attributed."

paths = [
  { path = "drift-report.json", why = "The scenario writes the report itself, so the assertions read a file rather than a headless envelope." },
]

[[content]]
path = "drift-report.json"
pattern = '"state": "drifted"'
why = "A standard the scenario appended to must come back attributed rather than as a bare difference, which proves the history fallback ran on an unstamped target."

[[content]]
path = "drift-report.json"
pattern = '"rel": "CLAUDE.md"'
why = "CLAUDE.md gained a section the seed never shipped, so the seeds section has to carry it."

[[content]]
path = "drift-report.json"
pattern = '"seeds"'
why = "Asserted apart from the entry above so a report that dropped the section reads differently from one that kept it empty."

[[content]]
path = "drift-report.json"
pattern = '"superseded": \[\]'
why = "A superseded file here would mean the stem rule matched something it should not."

[[content]]
path = "drift-report.json"
pattern = '"unmigrated": \[\]'
why = "Neither of the other two classes fires on this arm."
