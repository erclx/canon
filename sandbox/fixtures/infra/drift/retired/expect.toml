purpose = "canon sync --check --json names the files a seed folder replaced and leaves them on disk."

paths = [
  { path = "drift-report.json", why = "The report the command wrote, which every content entry reads." },
  { path = ".claude/TASKS.md", why = "A superseded entry queues no change, so the file survives. An absence check alone cannot tell a move from a delete." },
  { path = ".claude/CONTEXT.md", why = "Survives for the same reason as TASKS.md." },
  { path = ".claude/TASKS-ARCHIVE.md", why = "Survives for the same reason as TASKS.md." },
]

manual = [
  "`.claude/TASKS-ARCHIVE.md` appears in the report only as a file on disk, never in the superseded list. Semantic: the distinction is which array the name sits in, and a bare filename pattern passes from either",
]

[[content]]
path = "drift-report.json"
pattern = '"rel": "\.claude/TASKS\.md"'
why = "Names the retired task file. Nothing detected it before, since the relocation walk reads a stamp and no real target carries one."

[[content]]
path = "drift-report.json"
pattern = '"replacedBy": "\.canon/tasks"'
why = "Names the folder that replaced it."

[[content]]
path = "drift-report.json"
pattern = '"rel": "\.claude/CONTEXT\.md"'
why = "Names the second retired artifact against its replacement."
