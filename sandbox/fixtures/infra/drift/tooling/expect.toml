purpose = "canon sync --check --json reports tooling as unmeasured on a target that never recorded a stack chain."

paths = [
  { path = "drift-report.json", why = "The report the command wrote, which every content entry reads." },
]

absent = [
  { path = ".claude/tooling", why = "The target never installed tooling, so no stack reference landed either." },
]

manual = [
  "`covers` does not list tooling, since it names only the domains a target actually stamped. Semantic: the assertion is that a key is missing from a JSON array, and a content pattern asserts presence rather than absence",
  "The rendered run prints a `tooling` section naming the state and the command that records one, rather than omitting the domain. Semantic: the assertion is about the stderr render, and the JSON report carries no rendered line",
]

[[content]]
path = "drift-report.json"
pattern = '"measured": false'
why = "The unmeasured state is why tooling carries this field. A target that never installed tooling and one whose tooling is current both produce zero changes, so the count alone is a claim without it."

[[content]]
path = "drift-report.json"
pattern = '"chain": \[\]'
why = "An empty chain. Entries would mean the report read a record this arm never wrote, which is the backfill-by-inference the record replaces."
