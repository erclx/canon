purpose = "canon sync --check --json reports a folder at a root the toolkit stopped shipping, attributed as dropped."

paths = [
  { path = "drift-report.json", why = "The report the command wrote, which every content entry reads." },
]

manual = [
  "The rendered run names the folder under `No longer shipped by the toolkit` and proposes nothing. Semantic: the assertion is that the section offers no command, and the JSON report carries no rendered text",
  "`--exit-code` still exits 0 on this target once its other sections are clean. Semantic: the JSON carries the finding either way, so the gate has to be observed from the exit status rather than read out of the report",
]

[[content]]
path = "drift-report.json"
pattern = '"unclaimed"'
why = "The folder is reported at all. Every other section enumerates toolkit-owned keys, so a folder the toolkit deleted appeared in none of them."

[[content]]
path = "drift-report.json"
pattern = '"attribution": "dropped"'
why = "A project-authored folder and a dropped one look identical on disk, so the verdict is what makes the entry safe to act on."

[[content]]
path = "drift-report.json"
pattern = '"since": "[0-9a-f]{7}'
why = "A verdict with no revision behind it is a guess wearing an attribution."

[[content]]
path = "drift-report.json"
pattern = '"files": [1-9]'
why = "An entry with no files would mean the walk fired on an empty directory."

[[content]]
path = "drift-report.json"
pattern = '"files": 2'
why = "The sibling file the toolkit never shipped is counted in the same folder rather than reported as its own entry."
