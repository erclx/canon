# What `canon indexes regen` leaves behind against a parent folder holding one
# nested folder with its own index.md. Read by `canon sandbox check`.
#
# Neither sibling here carries a `category` field, so `renderIndex` takes its
# flat branch: a sub-catalog link sorts among the entries by name rather than
# under a `## Sub-catalogs` heading, which only the grouped branch emits. The
# child folder name "guides" sorts after both "alpha.md" and "beta.md", which
# is the "after the sibling files" order the scenario's own log_info states.

paths = ["docs/index.md", "docs/guides/index.md"]
absent = []

manual = []

[[content]]
path = "docs/index.md"
pattern = '\[Alpha\]\(alpha\.md\)[\s\S]*\[Beta\]\(beta\.md\)[\s\S]*\[Guides\]\(guides/index\.md\): Step-by-step how-tos'

[[content]]
path = "docs/guides/index.md"
pattern = '\[Setup\]\(setup\.md\): Local environment bootstrap'

[[content]]
path = "docs/guides/index.md"
pattern = '\[Deploy\]\(deploy\.md\): Release and rollback steps'
