purpose = "A run of /canon:target-setup indexes against a bare folder of raw markdown reaches the candidate question and writes nothing."

max_turns = 16

absent = [
  { path = "docs/index.md", why = "The skill asks which folder to bootstrap, which no reply channel reaches on a single headless turn, so the run must leave docs/ untouched." },
]

reply = [
  { text = "docs/", why = "Names the sole candidate. The two phrasings a run uses share this token." },
  { text = "bootstrap", why = "Shows the run reached the candidate question rather than only writing nothing." },
]

manual = [
  "The reply names docs/ as the sole candidate, its file count, and its frontmatter coverage, before asking which folder to bootstrap. Semantic: the exact phrasing varies run to run beyond the two pinned tokens, and the correctness of the paraphrase is a judgment no pattern can carry",
]

[[content]]
path = "docs/architecture.md"
pattern = '^# Architecture\n'
why = "Proves the file gained no frontmatter without pinning the seeded body's prose, which could be reworded without changing whether the run touched it."
