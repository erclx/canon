purpose = "canon indexes regen --dry-run --json against a folder that would change emits one would-write record."

paths = [
  { path = "json-record.json", why = "The record the verb printed on stdout." },
  { path = "json-status.txt", why = "The exit status the run captured." },
]

[[content]]
path = "json-record.json"
pattern = '"dryRun":true'
why = "The record states it was a dry run."

[[content]]
path = "json-record.json"
pattern = 'docs/index\.md","action":"would-write"'
why = "One would-write record naming the folder that would change. The path is absolute and differs per run, so the pattern anchors on the suffix."

[[content]]
path = "json-status.txt"
pattern = '^2$'
why = "The documented exit for a dry run that found drift."
