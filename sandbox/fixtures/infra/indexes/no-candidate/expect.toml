purpose = "A /canon:target-setup indexes run against a bare CLAUDE.md with no markdown-heavy folder skips to the closeout and writes nothing."

max_turns = 8

absent = [
  { path = "docs/index.md", why = "The scan finds no candidate, so no index is bootstrapped. This holds whether the run closes correctly or crashes before the closeout, which the manual entry tells apart." },
]

manual = [
  "The reply reports the empty scan and ends on exactly one `Bootstrap complete.` closeout, with no `Convention seed:` line and no offer to add an `## Indexes` section to `CLAUDE.md`. Semantic: the absence of an offer is read from the whole reply, which no single substring pin can carry",
]

[[content]]
path = "CLAUDE.md"
pattern = '^# Project\n\nSample project for testing the indexes phase of the setup skill on an empty scan\.\n$'
why = "CLAUDE.md is untouched, since the governance rule carries the Indexes convention and the phase no longer offers to append it. This proves nothing was written, not that the closeout happened."
