purpose = "canon indexes regen skips a folder opted out with auto: false and leaves its index untouched."

paths = [
  { path = "docs/index.md", why = "The opted-out index still exists after the walk." },
]

[[content]]
path = "docs/index.md"
pattern = '^auto: false$'
why = "The opt-out field survives. The walk reads it ahead of any render and returns skipped rather than touching the file."

[[content]]
path = "docs/index.md"
pattern = 'Stale content that should be overwritten'
why = "The seeded body survives, which is what separates a skip from a rewrite that happened to keep the frontmatter."
