# What a correct `/canon:restate-plainly docs/retry.md` run leaves behind on the seeded
# document. Read by `canon sandbox check`. Patterns use TOML literal strings so a
# regex needs no backslash escaping.
#
# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so an array written at the bottom parses
# clean and silently asserts nothing.
#
# This arm asserts that the run left the tree alone and answered in chat. What it
# cannot assert is whether the restatement kept the deciding half, which is the
# whole judgment the skill exists to make, so those claims sit under `manual`.

paths = ["docs/retry.md"]

# A correct run writes nothing, so this reports as skipped with the run wrote
# nothing rather than as a pass. It is declared for the failing run: a body that
# writes its restatement to a file lands outside this scope and goes red.
#
# The source is admitted, and what catches a rewrite of it is narrower than the
# scope. The three pins below reach the frontmatter, the hedge paragraph, and one
# sentence, so a run that rewrote `## Operational notes` or appended to the file
# passes every one of them and passes the scope with it. Admitting the source is
# what keeps a legitimate in-place touch from reading as an escape, not a second
# assertion over the file's whole content.
#
# `write_scope = []` is not the stricter form it looks like. `src/sandbox/expect.ts`
# returns early on an empty array, so it asserts nothing at all and would drop the
# check that catches a body writing its restatement to a file.
write_scope = ["docs/retry.md"]

# The reply names the source path and closes on the label the output template
# fixes. Both tokens are fixed by the fixture and the body rather than chosen by
# the run, which is what keeps them out of `manual`.
reply = ["docs/retry.md", "Cut:"]

# Observed at 5 turns and 0.15 dollars on 2026-08-25, from one run.
#
# The declaration stays at the runner default rather than dropping to a corrected
# ceiling, because the cost has a moving part: the body sends the run to the
# `write-human` skill, whose tells catalog sits behind a trigger a run may or may
# not reach. One observation does not bound a cost that follows what the run
# finds. Correct it downward from the widest of several runs.
#
# Never raise it above the cap of 30: a truncated run reports one turn past the
# cap, so a declaration above it goes green on exactly the truncation the
# assertion exists to catch.
max_turns = 30

manual = [
  "The restatement keeps all three deciding facts: at most three retries, which statuses retry, and Retry-After winning over the backoff schedule. Semantic: the claim is about which facts survived a rewrite in chat, and the reply kind matches substrings rather than reading for a fact.",
  "The hedge survives, so the restatement still says the ceiling may no longer match the upstream read timeout. Semantic: dropping a hedge manufactures a certainty, and a run that drops it words the sentence differently rather than omitting a token.",
  "The jitter arithmetic and the metrics section were dropped as supporting rather than deciding. Semantic: a correct run may legitimately keep either where it reads as deciding, so the tell is whether the Cut: line accounts for what left.",
  "No term of art survives unexplained. Semantic: policy envelope, attempt budget, and residual attempt state are shapes rather than tokens once restated, and a near-synonym reads identically to a plain equivalent in any string match.",
  "The restatement reads as prose rather than as a list of verbless fragments. Semantic: this is the failure a compression pass produces, and cadence is a property of a passage that no single pattern counts.",
  "The run loaded the write-human skill before writing the restatement. Unwired: the claim is about which skills were loaded, which the envelope does not carry.",
  "No fact, number, or name entered the restatement that docs/retry.md does not carry. Semantic: an invented claim is an addition to prose the harness never captures as a file.",
  "The restatement carries no banned character. Unwired: the bans are gated over files by canon markdown audit, and a reply is prose the harness captures as text rather than as a path. The run of 2026-08-25 returned a correct restatement carrying an em dash, so read this one rather than assuming the citation reached it.",
]

# The source document, pinned from its frontmatter through the paragraph
# carrying the hedge. `content` matches positively, so pinning the block whole is
# how the arm asserts the run did not revise the file it was pointed at. A run
# that rewrote a line inside the block pushes the rest and fails the match.
[[content]]
path = "docs/retry.md"
pattern = '^---\ntitle: Retry\ndescription: [^\n]+\n---$'

[[content]]
path = "docs/retry.md"
pattern = 'The ceiling was chosen against the upstream read\ntimeout and has not been revalidated since that timeout moved'

[[content]]
path = "docs/retry.md"
pattern = 'A call is retried at most three times\.'
