# What a correct `/session-worktree` run leaves behind on the port-offset arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# Step 6 reads the port helper rather than restating a number, so what this arm
# asserts is that the skill reported what the helper derived. The helper itself
# is covered by `src/worktree-port.test.ts`, which is where the three directory
# shapes are separated. This arm covers the reporting line above it.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so an array written at the bottom parses
# clean and asserts nothing.

max_turns = 30

# The worktree the entry creates, named for the plan the branch matches. The
# helper travels into it because the seed commit landed before the arm branched,
# so the file is on the base ref the entry forks from.
paths = [
  ".claude/worktrees/corge/scripts/worktree-port.sh",
  ".claude/worktrees/stale/package.json",
]

# The stale sibling is the control. Entry derives its name from the plan and
# stops on a directory collision, so a run that swept the folder away or entered
# it instead of creating its own goes red here rather than passing on the
# worktree it did create.

# The offset the helper derives for a worktree folder named `corge`, being the
# cksum of the name modulo the band of 50, plus one. Pinning the number rather
# than the shape is what separates a skill that read the helper from one that
# printed a plausible integer.
#
# The dependency line above it lands on the last of Step 6's four bullets, since
# the arm seeds no manifest inside the worktree. No other arm reaches that
# bullet, which is the one that keeps the step honest on a stack it cannot read.
reply = [
  "Port offset 27",
  "No package manifest",
]

manual = [
  "The refusal branch of the port line is unreachable from this skill. Unwired: Step 4 registers whatever it creates, so a fresh entry always lands on a worktree the helper answers for, and no arm can stage the entry onto the stale sibling.",
  "The offset is read rather than assigned. Semantic: a run that hardcoded 27 from a held copy of this file would pass, and only the helper's own test separates the two.",
]
