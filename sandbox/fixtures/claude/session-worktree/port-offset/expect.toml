purpose = "/session-worktree reports the port offset the helper derived for the worktree it created, rather than restating a number. The helper's own test separates the three directory shapes, and this arm covers the reporting line above it."

max_turns = 30

paths = [
  { path = ".claude/worktrees/corge/scripts/worktree-port.sh", why = "The worktree the entry creates, named for the plan the branch matches. The helper travels into it because the seed commit landed before the arm branched." },
  { path = ".claude/worktrees/stale/package.json", why = "The stale sibling is the control. Entry derives its name from the plan and stops on a directory collision, so a run that swept the folder away or entered it goes red here rather than passing on the worktree it did create." },
]

reply = [
  { text = "Port offset 27", why = "The offset the helper derives for a folder named corge, being the cksum of the name modulo the band of 50, plus one. Pinning the number rather than the shape separates a skill that read the helper from one that printed a plausible integer." },
  { text = "No package manifest", why = "The dependency line lands on the last of Step 6's four bullets, since the arm seeds no manifest inside the worktree. No other arm reaches it, and it keeps the step honest on a stack it cannot read." },
]

manual = [
  "The refusal branch of the port line is unreachable from this skill. Unwired: Step 4 registers whatever it creates, so a fresh entry always lands on a worktree the helper answers for, and no arm can stage the entry onto the stale sibling.",
  "The offset is read rather than assigned. Semantic: a run that hardcoded 27 from a held copy of this file would pass, and only the helper's own test separates the two.",
]
