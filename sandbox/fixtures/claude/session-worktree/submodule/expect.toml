purpose = "/session-worktree run from inside a submodule stops at the guard before entry and writes nothing. The arm runs against the prompt `cd vendor, then /canon:session-worktree`, so the directory change lands before the skill reads any git state, and against the bare prompt it fails every assertion, which is the submodule-root arm."

max_turns = 30

paths = [
  { path = "vendor/lib.js", why = "The arm's precondition rather than its subject. A run that found no populated vendor had no submodule to be guarded against, so every assertion below would pass for the wrong reason." },
]

absent = [
  { path = ".claude/worktrees/grault", why = "The guard stops before entry, so no worktree is created." },
  { path = "vendor/.claude", why = "The sharper of the two. It is where the run lands if the guard is removed and every derivation after it takes the submodule for the project." },
]

reply = [
  { text = "Inside a submodule", why = "The fixed half of the guard's message. The message names the superproject by absolute path, which moves per machine, so only the fixed half is matched." },
]

manual = [
  "The stop names the superproject by absolute path, which is the sandbox root and moves per machine, so the reply assertion matches the fixed half of the message alone. Semantic: a run that named the wrong root would pass this.",
  "Whether the operator is told to re-run from the superproject is carried by the same sentence and not separated here. Unwired: no assertion kind reads a message's second clause apart from its first.",
]
