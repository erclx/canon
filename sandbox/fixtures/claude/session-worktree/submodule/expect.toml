# What a correct `/session-worktree` run leaves behind on the submodule guard arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# This arm asserts the guard. It is written against the prompt
# `cd vendor, then /canon:session-worktree`, since the expectation format carries
# no prompt field and the runner takes one as a free argument. The session's
# `Bash` working directory persists across calls, so the directory change lands
# before the skill reads any git state. Run against the bare skill prompt this
# arm fails every assertion below, which is `submodule-root` next door.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so an array written at the bottom parses
# clean and asserts nothing.

max_turns = 30

paths = ["vendor/lib.js"]

# The submodule file is the arm's precondition rather than its subject. A run
# that found no populated `vendor` had no submodule to be guarded against, so
# every assertion below would pass for the wrong reason.

absent = [
  ".claude/worktrees/grault",
  "vendor/.claude",
]

# The guard stops before entry, so neither path is written. `vendor/.claude` is
# the sharper of the two: it is where the run lands if the guard is removed and
# every derivation after it takes the submodule for the project.

reply = [
  "Inside a submodule",
]

manual = [
  "The stop names the superproject by absolute path, which is the sandbox root and moves per machine, so the reply assertion matches the fixed half of the message alone. Semantic: a run that named the wrong root would pass this.",
  "Whether the operator is told to re-run from the superproject is carried by the same sentence and not separated here. Unwired: no assertion kind reads a message's second clause apart from its first.",
]
