purpose = "/session-worktree on a project carrying both a node and a python manifest reads both ecosystems independently and reports each on its own line, rather than the first of four ordered lines that matched."

max_turns = 30

paths = [
  { path = ".claude/worktrees/quux/package.json", why = "Both manifests travel into the worktree because the seed commit landed before the arm branched. A run that dropped either during entry loses the precondition this arm tests." },
  { path = ".claude/worktrees/quux/pyproject.toml", why = "The python manifest travels into the worktree beside the node one." },
]

reply = [
  { text = "bun install", why = "Neither manifest's installed folder exists, so neither ecosystem reads as installed. Pinning this token separates a run that named the node case from one that only reported the python line." },
  { text = "virtual environment", why = "The same holds against a run reporting only node. Both present is what a first-match regression cannot produce." },
]

manual = [
  "Only the not-installed branch of each check is exercised here. Semantic: neither manifest's installed folder is staged, so a regression collapsing the two 'Dependencies are installed.' branches back into one first-match check, reached only once both ecosystems already have their folders present, would still pass this arm blind to it.",
]
