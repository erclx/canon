purpose = "/session-worktree run from the superproject root of a tree holding a submodule enters its worktree and leaves the submodule guard silent. This is the control for the submodule arm, which asserts the guard fires."

max_turns = 30

paths = [
  { path = ".claude/worktrees/grault/.canon/plans/feature-grault.md", why = "The plan reaching the worktree proves entry read the superproject's own tree rather than a root it derived from somewhere else." },
  { path = "vendor/lib.js", why = "The precondition. A tree with no populated vendor cannot show the guard stayed silent for the right reason." },
]

reply = [
  { text = "feat/grault", why = "The branch the entry created." },
  { text = "No package manifest", why = "The dependency line for a tree with no manifest." },
]

manual = [
  "That the guard stayed silent rather than never running is not separable here. Unwired: a skipped read and a read returning empty produce the same output, and only the sibling arm shows the command is wired at all.",
]
