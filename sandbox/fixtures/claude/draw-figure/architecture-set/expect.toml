purpose = "A /canon:draw-figure request for an architecture view lands the figure in the document the user named through the Mermaid path, and nothing reaches the retired diagrams folder."

max_turns = 30

paths = [
  { path = "canon/context/components.md", why = "The destination the request names." },
  { path = ".canon/tmp/figures/*.mmd", why = "The Mermaid source stays after the checks confirm, since a later refresh redraws from it. Its presence shows the run took the Mermaid path rather than drawing by hand." },
]

absent = [
  { path = ".canon/diagrams/**", why = "The retired per-kind folder. A run that fell back to it wrote here instead of the named destination." },
]

write_scope = [
  { path = "canon/context/components.md", why = "The destination." },
  { path = ".canon/tmp/figures/**", why = "The Mermaid scratch the render writes." },
]

reply = [
  { text = "canon/context/components.md", why = "The output template's first line names the destination." },
  { text = "architecture", why = "The render path line spells the decided path." },
]

manual = [
  "The rendered PNG was read back before confirming. Unwired: the skill deletes the PNG once the checks confirm, so a conforming run leaves no file to assert.",
  "The drawing reads as the four layers the components entry names, inside the boundary. Semantic: whether the boxes say what the entry says is a judgment over the picture.",
]

[[content]]
path = "canon/context/components.md"
pattern = '<figure'
why = "The figure landed in the named entry, wrapped."

[[content]]
path = "canon/context/components.md"
pattern = '<figcaption'
why = "The figure is captioned."

[[content]]
path = "canon/context/components.md"
pattern = '<svg'
why = "The shipped drawing is the rendered SVG with an accessible name, not a fence left as source."

[[content]]
path = "canon/context/components.md"
pattern = 'var\(--'
why = "Colors were rewritten into custom properties rather than left as the hex values Mermaid writes."

[[content]]
path = "canon/context/components.md"
pattern = 'A request crosses four layers'
why = "The seeded prose survives the write."
