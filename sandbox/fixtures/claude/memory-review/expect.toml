# What a correct `/canon:memory-review` run leaves behind on the default
# arm, through the propose pass alone. Read by `canon sandbox check`. Patterns use
# TOML literal strings so a regex needs no backslash escaping.
#
# The propose pass writes one file and that file is shared session scratch, which
# used to escape the sandbox and demoted every claim over it. The sandbox
# provisions outside the toolkit worktree now, so the proposal lands inside the
# tree and the assertions over it run.

# The precondition, asserted rather than described. No corpus installs into a
# target, so the project copy is absent and the plugin fallback is the only route
# to the slug transform. An arm that staged a copy of its own would resolve the
# project path and void the premise here, so the absence is asserted where that
# edit lands.
absent = [".claude/standards/skill.md", "standards/skill.md"]

# The filename is the evidence. `memory-review-memory-sweep.md` is the slug
# transform in `standards/skill.md` applied to branch `chore/memory-sweep`, and
# that transform appears in no skill body, so a proposal at this exact path is
# what proves the plugin fallback resolved.
paths = [".canon/memory/review/memory-review-memory-sweep.md"]

# Propose writes the proposal and nothing else. The apply pass, which edits
# the always-loaded rule target and the skill body and moves entries into the
# archive, needs a second turn the headless run never takes, so a run that
# reached those files applied without approval.
# Those targets are ordinary project files and land inside the snapshot, and the
# proposal itself now does too, so the scope has a write to check on a correct
# run rather than only on a wrong one.
write_scope = [".canon/memory/review/**"]

# No max_turns. One clean run cost 23 turns on 2026-08-02 against the default cap
# of 30. A single observation sets a ceiling too tight to trust, so the arm waits
# for a second before declaring one.

manual = [
  "`no-obvious-comments` and `comments-explain-why` are fused into one promote rather than proposed separately. Semantic: consolidation is the skill's judgment and both filenames appear in the proposal either way",
  "`feedback-zz-pad-19.md`, `feedback-zz-pad-20.md`, and `feedback-small-pull-requests.md` appear nowhere in the proposal. The first two sort past the batch of 25 and the third was reviewed today. Manual: the checker declares positives only",
  "`zod-in-src-routes` targets the path-scoped skill body and `confirm-destructive-commands` targets an always-loaded rule, either an existing file under `.claude/rules/project/` or a handoff to `create-rule` since the fixture seeds no project rule folder. Semantic: the routing rule is the point of the arm, and a pattern matching a target name cannot tell a correct route from a coincidence",
]

# Every key above this line is top level. A bare key written below a
# `[[content]]` header belongs to that table in TOML, so anything moved down here
# would parse clean and assert nothing. `contentArray` rejects that now.

# The heading carries the slug a second time, inside the file rather than in its
# name, so a proposal written to the right path from the wrong branch still goes
# red.
[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = '^# Memory review: memory-sweep'

# The slot each item needs for the pass the proposal exists to open. An item
# written without one strands the decision round.
[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = '^Decision:'

# Both reach the proposal as items, the first stating nothing actionable and the
# second already absorbed into the seeded `CLAUDE.md`. A pass that dropped either
# reviewed a subset while reporting the whole.
[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = 'feedback-be-careful\.md'

[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = 'feedback-memory-location\.md'

# The batch is the verb's first 25 due entries. The one citing a missing path
# opens it, the last padding entry inside it closes it, and the header states
# the batch against the 27 due, so a pass that swept the whole pen or reordered
# it by hand goes red on one of the three.
[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = 'feedback-legacy-handlers-own-auth\.md'

[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = 'feedback-zz-pad-18\.md'

[[content]]
path = ".canon/memory/review/memory-review-memory-sweep.md"
pattern = '^\*\*Batch:\*\* 25 of 27'
