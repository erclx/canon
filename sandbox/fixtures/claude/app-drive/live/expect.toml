purpose = "A run of /canon:app-drive on the live app the operator names leaves the operator's board untouched and registers no worktree."

paths = [
  { path = ".canon/intake/*/drive.json", why = "The record mapping every goal." },
  { path = ".canon/intake/*/evidence/drive-log.md", why = "The drive log." },
]

absent = [
  { path = ".git/worktrees/*/HEAD", why = "No copy is made, so no registration appears at any point." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Intake files land in the folder the pass opens." },
  { path = ".canon/tmp/app-drive/**", why = "The drive keeps its scratch here." },
  { path = ".canon/proposals/**", why = "The proposals folder, where a fallback mock goes." },
  { path = "dist/**", why = "The Action names the launch, so the build output is the one checkout write a correct run makes." },
]

escape_scope = []

manual = [
  "The run's own `canon intake drive-check <slug> --json` returned clean. Unwired: a command's exit is not in the envelope.",
  "The server was stopped only on a port `canon pr local --root <checkout>` reported. Unwired: a command's arguments are not in the tree.",
  "No undo, redo, select-all, or bulk action ran in the page. Unwired: browser input is not in the tree.",
]

[[content]]
path = "boards/board.json"
pattern = '^\{"frames":\["frame 1"\]\}$'
why = "The operator's board is untouched. Saving a frame would write it, which a live drive never does, so the Frames goal is driven as a read or marked not-driven with its reason."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'adds a frame to the board and sees it saved'
why = "The first goal is mapped."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'exports the board to PNG'
why = "The second goal is mapped."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = '"worktree":\s*null'
why = "The live value, in an indented record and a one-line one."

[[content]]
path = ".canon/intake/*/evidence/drive-log.md"
pattern = '^\| Copy\s.*live app'
why = "The log names the live app as the copy driven."
