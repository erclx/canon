purpose = "A run of /canon:app-drive on the seeded board app maps every goal, leaves the checkout untouched, and removes its worktree registration."

# A single run at 22 turns sets the cap; a truncated run fails by its subtype.
max_turns = 30

paths = [
  { path = ".canon/intake/*/drive.json", why = "The record mapping every goal." },
  { path = ".canon/intake/*/evidence/*.png", why = "The evidence screenshots." },
  { path = ".canon/intake/*/evidence/drive-log.md", why = "The drive log." },
]

absent = [
  { path = ".git/worktrees/*/HEAD", why = "The worktree registration `git worktree list` reads. A headless run has no operator, so the Action carries the word to close up front, and a run that parks before the close fails here. A bare `.git/worktrees/*` matches nothing, since the scan returns files only." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Any write to boards/, dist/, or another tracked path fails, which stands in for the check's changed axis." },
  { path = ".canon/tmp/app-drive/**", why = "The drive keeps its scratch here." },
  { path = ".canon/picks/**", why = "The config's proposals folder, where a taste item's frames go. A scope without it passes a run with no taste item and fails a correct one that has one." },
]

escape_scope = []

manual = [
  "The run's own `canon intake drive-check <slug> --json` returned clean. Unwired: a command's exit is not in the envelope, and the reply renders the word inside a code span, so a reply substring is brittle.",
  "A not-driven goal carries a reason. Unwired: the Export goal may be driven as a finding or marked not-driven, and `content` matches positives only.",
  "No goal entry names a goal the requirements lack. Unwired: an absence inside a file.",
  "Each finding was sorted as a bug, a requirements conflict, or a taste call. Semantic: the kind is a judgment over the item's text.",
  "The close removed the /tmp folder as well as the registration. Unwired: the checker reads the sandbox alone.",
]

[[content]]
path = "boards/board.json"
pattern = '^\{"frames":\["frame 1"\]\}$'
why = "The seed is untouched, which a drive served from the checkout would break. It is byte-exact against the scenario's seed, so a reformat there moves this pattern too."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'adds a frame to the board and sees it saved'
why = "The first goal is mapped. It matches on the goal text, so a kept bold label or a dropped period still passes."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'exports the board to PNG'
why = "The second goal is mapped."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = '"worktree":\s*"/'
why = "The field that arms the check's worktree-left axis is present. The pattern matches an indented record and a one-line one."

[[content]]
path = ".canon/intake/*/evidence/drive-log.md"
pattern = '^\| Commit\s'
why = "The log opens on its setup table, which every run writes. A run can find no finding at all, so a finding heading is never asserted."
