purpose = "A run of /canon:app-drive on a project carrying a board leaves the drive record, the board pages in the drawing convention, and no checkout writes."

paths = [
  { path = ".canon/intake/*/drive.json", why = "The record mapping every goal." },
  { path = ".canon/intake/*/evidence/drive-log.md", why = "The drive log, opening on its setup table." },
  { path = ".canon/intake/*/evidence/*/*.png", why = "Evidence grouped by surface." },
  { path = ".canon/intake/*/evidence/*/*-options.png", why = "The option frames the pick question names." },
  { path = ".canon/intake/*/evidence/mocks/*/*", why = "The mocks the options were drawn from." },
  { path = ".canon/board/drive-*/project.json", why = "The drive's board project." },
  { path = ".canon/board/drive-*/00-current/layout.json", why = "The current-state page leads the board." },
  { path = ".canon/board/drive-*/00-current/*-390.html", why = "A frame at the narrow width." },
  { path = ".canon/board/drive-*/00-current/*-768.html", why = "A frame at the middle width." },
  { path = ".canon/board/drive-*/00-current/*-1280.html", why = "A frame at the wide width." },
]

absent = [
  { path = ".git/worktrees/*/HEAD", why = "The worktree registration is gone after the close. Each entry names a file, since the scan returns files only and a bare folder matches nothing." },
  { path = ".canon/board/untitled/project.json", why = "`serve` starts a project named untitled, which the drive deletes while it holds nothing." },
  { path = ".canon/board/drive-*/page-1/layout.json", why = "`project add` makes an empty page-1, which the drive deletes while it holds nothing." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Intake files land in the folder the pass opens." },
  { path = ".canon/tmp/app-drive/**", why = "The drive keeps its scratch here." },
  { path = ".canon/proposals/**", why = "The proposals folder, where a fallback mock goes." },
  { path = ".canon/board/**", why = "The default scope plus the board root, where a board run writes its pages." },
]

escape_scope = []

manual = [
  "The pick question carried the board page address and named each option's frame. Unwired: the question is a turn in the transcript, which the checker does not read.",
  "The app's address was handed before driving, and the board's before the first frame drawn. Unwired: an ordering inside the reply.",
  "The board server and the app server ended. Unwired: a listener is not a file in the sandbox tree.",
  "The run's own `canon intake drive-check <slug> --json` returned clean. Unwired: a command's exit is not in the envelope.",
]

[[content]]
path = "boards/board.json"
pattern = '^\{"frames":\["frame 1"\]\}$'
why = "The seed is untouched, which a drive served from the checkout would break."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'adds a frame to the board and sees it saved'
why = "The first goal is mapped."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = 'exports the board to PNG'
why = "The second goal is mapped."

[[content]]
path = ".canon/intake/*/drive.json"
pattern = '"worktree":\s*"/'
why = "The field that arms the check's worktree-left axis is present."

[[content]]
path = ".canon/intake/*/evidence/drive-log.md"
pattern = '^\| Commit\s'
why = "The log opens on its setup table, which every run writes."

[[content]]
path = ".canon/intake/*/evidence/drive-log.md"
pattern = '^\| Board\s.*drive-\d+'
why = "The Board row names the drive's project."

[[content]]
path = ".canon/board/drive-*/project.json"
pattern = '"pages":\s*\[\s*"00-current"'
why = "00-current leads the page order. The pattern matches a pretty-printed file and a compact one."
