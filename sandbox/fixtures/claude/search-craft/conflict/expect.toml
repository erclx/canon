purpose = "/canon:search-craft given two recorded result sets that disagree keeps the side the field's own record supports and notes the disagreement. The arm replays the sets and never searches, so it proves the reconciliation rules once the skill is loaded and nothing about whether a session scopes a search."

max_turns = 30

paths = [
  { path = "notes/research.md", why = "The notes the run wrote from the recorded sets." },
]

write_scope = [
  { path = "notes/**", why = "A fetch attempt is a failure of the arm's own setup, since the recorded sets are the whole evidence. The tool list allows no fetch, so the run's denial count catches it." },
  { path = ".claude/**", why = "Seeds and settings the harness injects land here." },
  { path = ".canon/**", why = "The record root the harness writes under." },
]

manual = [
  "The notes say the scoped and open results disagreed and name the side kept. Semantic: a disagreement is worded many ways, and a substring cannot tell stating it from restating one answer.",
  "The kept answer rests on the field's own record, its reference docs and changelog, rather than on the count of results. Semantic: the open side outnumbers the scoped side, so a run that counted would keep 3.9.0 and the version alone shows only the outcome.",
  "The result outside the scoped domain list is discarded or flagged as unverified, not cited as support. Semantic: whether a source supports a claim is a judgment the file's links do not carry.",
]

[[content]]
path = "notes/research.md"
pattern = '4\.2\.0'
why = "The kept version is the one the field's own record states."

[[content]]
path = "notes/research.md"
pattern = 'https?://[^\s)]+'
why = "At least one claim carries a link to its source."
