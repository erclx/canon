# What a correct `/context-fold` run leaves behind on the board-sweep arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The arm asserts that outcome state alone moves no plan. `context-fold` marks
# outcomes and nothing else, and a plan is settled by the merge through
# `canon tasks archive`, so a run here leaves all three plans exactly where it
# found them however many tasks it closes.
#
# It reads board-wide for the same reason it always did. The rate-limit task
# closed in an earlier session and nothing in the prompt mentions it, so a run
# that reached past its own diff to sweep is what this arm has to see and refuse.

# The arm runs under the default cap. A clean run on 2026-07-31 cost 28 turns,
# just under `drift`'s 29, so the ceiling matches the default 30 the way `drift`
# already does. That reading predates the plans sweep coming out, and the cap
# stays where it is: the work this arm dropped was two moves against a board it
# reads and reasons about once, which is where the turns actually go.
#
# Correcting from that 28 lands on the cap anyway. A ceiling has to sit above the
# observation to catch a blowup rather than fire on ordinary variance, and the
# only room above 28 is the two turns to the cap.
max_turns = 30

# All three plans stay live. `feature-pagination.md` belongs to the task this
# session's diff closes and `feature-rate-limit.md` to a task that closed in an
# earlier session, so a run that still swept on outcome state would move both.
# `feature-search.md` is the third: its task carries open outcomes and nothing in
# HEAD ships search, so it stays live under every reading and separates a run
# that moved nothing from one that moved everything.
paths = [
  ".canon/plans/feature-pagination.md",
  ".canon/plans/feature-rate-limit.md",
  ".canon/plans/feature-search.md",
]

# No plans archive at all. An `absent` entry over the three live paths would pass
# on a run that created the folder and moved nothing into it, and the folder is
# what a sweep leaves behind whatever it decided to carry.
absent = [
  ".canon/plans/archive/feature-pagination.md",
  ".canon/plans/archive/feature-rate-limit.md",
  ".canon/plans/archive/feature-search.md",
]

write_scope = [".claude/**", ".canon/**"]

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^- \[x\] Outcome: a list request accepts a page size and an offset'

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^Plan: \[feature-pagination\]\(\.\./plans/feature-pagination\.md\)'

# Every pointer stays live, the closing task's included. A run that retargeted a
# line without moving the plan leaves the only pointer to it aimed at a path
# holding no file, and `.canon/plans/` is gitignored so nothing recovers it.
[[content]]
path = ".canon/tasks/v01.0-rate-limit.md"
pattern = '^Plan: \[feature-rate-limit\]\(\.\./plans/feature-rate-limit\.md\)'

[[content]]
path = ".canon/tasks/v03.0-search.md"
pattern = '^Plan: \[feature-search\]\(\.\./plans/feature-search\.md\)'

# Its outcomes stay open. HEAD ships no search, so a run marking either one has
# matched on the board rather than on the diff.
[[content]]
path = ".canon/tasks/v03.0-search.md"
pattern = '^- \[ \] Outcome: a query matches against task titles'
