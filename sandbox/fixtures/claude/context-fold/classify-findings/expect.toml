# What a correct `/context-fold` run leaves behind on the classify-findings arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# One uncommitted edit stages the shape Step 9's classify call exists to
# catch, after Step 3 and Step 6 have already run:
#
# `canon/context/retrieval.md` appends a branch-narrated re-measurement below
# the count it restates, instead of rewriting the count in place. Step 6's own
# session judgment reliably folds this on its own, measured across two clean
# runs, since the diff sits inside the entry Step 6 already maps to and reads.
# This arm is therefore an end-to-end content check on the final doc, not
# evidence Step 9 ran, since Step 6 alone is sufficient to produce it. The
# classify step is covered by `src/context/classify` unit tests.

write_scope = ["canon/**"]

# Unmeasured against a live run. Set to the harness default rather than a
# number nobody has read a clean run against yet.
max_turns = 30

manual = [
  "The old count, 42,000, no longer appears anywhere in canon/context/retrieval.md. Unwired: `absent` asserts over paths rather than content, and there is no path to assert absent here.",
  "No narration phrase (`moved again`, `at this branch`, or similar) survives in canon/context/retrieval.md. Unwired: same reason.",
]

# The new count is stated once, in the decision's own sentence, once the
# narrated paragraph below it has been folded back in rather than left beside
# the count it restates.
[[content]]
path = "canon/context/retrieval.md"
pattern = "58,500 chunks"

# The decision's own reasoning survives the rewrite. A run that dropped the
# paragraph instead of rewriting it in place loses the reasoning along with
# the narration.
[[content]]
path = "canon/context/retrieval.md"
pattern = "blurs the boundary a citation should point at"
