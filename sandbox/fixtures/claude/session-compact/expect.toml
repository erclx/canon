purpose = "/canon:session-compact writes one compact note with its sections and touches no task."

max_turns = 30

paths = [
  { path = ".canon/compact/*.md", why = "The note's name is derived from the work, so the entry is a glob." },
  { path = ".canon/tasks/index.md", why = "The board is the control. A compact note writes one file outside it and has no reason to touch a task." },
  { path = ".canon/tasks/v01.0-pagination.md", why = "The control task, untouched." },
]

absent = [
  { path = ".canon/tasks/session-*.md", why = "The orchestrator's spelling, which is what a run reaching for the wrong skill writes. A path negative fails on the file existing rather than on wording." },
]

write_scope = [{ path = ".canon/compact/**", why = "The compact note." }]

manual = [
  "The note is a single file. Semantic: the glob above finds one match and reports it, so a second note for the same work passes unseen.",
  "The decision names what it beat. Semantic: a cursor chosen over offset paging, with the insert-between-reads reason, reads in free prose.",
  "`## Where to pick up` carries one instruction rather than a menu. Semantic: its body is free prose.",
]

[[content]]
path = ".canon/compact/*.md"
pattern = '(?<![\s\S])(?![\s\S]*^## State$)'
why = "The skill states the negative outright: a session that committed nothing has no state a reader could not get from the tree. The lookbehind pins the match to the start of the file, so the lookahead reads the whole note once."

[[content]]
path = ".canon/compact/*.md"
pattern = '^## Where to pick up$'
why = "The note says where to resume."

[[content]]
path = ".canon/compact/*.md"
pattern = '^## What was decided$'
why = "The note records what was decided."
