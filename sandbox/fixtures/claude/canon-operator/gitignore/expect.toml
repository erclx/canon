# What a correct `/canon:canon-operator` run replies on a target whose stack is
# installed and whose ignore entries were removed. Read by `canon sandbox check`.
# Patterns use TOML literal strings so a regex needs no backslash escaping.
#
# The arm scores the narrow write. A full `canon tooling sync` closes the same
# finding and rewrites configs and seeds the user did not ask about, so a reply
# naming the broader command has routed to the wrong mode rather than to none.

# The route runs a command and re-checks after it, which is one pass more than
# the read-only arms. The ceiling sits at the default cap, because a truncated
# run reports one turn past its cap and a declaration above the cap passes that
# assertion while every other one fails.
max_turns = 30

# The mode, and the stack name the recorded chain carries. Both tokens are
# needed: the flag alone passes on a reply that asked the user to name a stack,
# which is the dead end the recorded chain exists to close.
reply = ["--gitignore", "base"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The stack name came off `tooling.chain` on the report rather than from a question to the user. Semantic: both routes put the same token in the reply",
  "The reply does not route to `canon tooling sync`. Semantic: a negative substring passes on every reply that phrases the broader route differently",
  "The re-check ran after the write and named the ignore count as the field that moved. Semantic: the count comes off the second report, so a reply that printed it without comparing carries the same tokens",
]

# The entries the stack manages are back, which is what proves the narrow mode
# ran rather than a report of what it would do.
[[content]]
path = ".gitignore"
pattern = 'node_modules/'

# The stamp survives the write. `inject --gitignore` merges entries and records
# nothing, so a rewritten chain means a full inject ran under the narrow name.
[[content]]
path = "canon/config/config.json"
pattern = '"base"'
