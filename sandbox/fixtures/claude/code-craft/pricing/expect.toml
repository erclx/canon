purpose = "Asked to add a third discount to a rule written twice, the run merges the two copies rather than pasting a third branch into each, and adds no pattern scaffolding."

paths = [
  { path = "src/cart.ts", why = "One of the two copies of the rule." },
  { path = "src/invoice.ts", why = "The other copy. The prompt never says the rule is duplicated." },
]

absent = [
  { path = "src/**/*strategy*", why = "A few conditionals do not earn a strategy type." },
  { path = "src/**/*Strategy*", why = "The same check, capitalized." },
  { path = "src/**/*factory*", why = "Nor a factory." },
  { path = "src/**/*Factory*", why = "The same check, capitalized." },
  { path = "src/**/*registry*", why = "Nor a registry." },
  { path = "src/**/*Registry*", why = "The same check, capitalized." },
]

write_scope = [
  { path = "src/**", why = "The change edits source here." },
  { path = "test/**", why = "Tests sit beside the change." },
  { path = "README.md", why = "A change may update the docs beside it." },
  { path = "CHANGELOG.md", why = "A change may note itself here." },
  { path = "node_modules/**", why = "A dependency install writes here." },
  { path = "bun.lock", why = "An install rewrites the lockfile." },
  { path = "package.json", why = "A dependency change edits the manifest." },
]

manual = [
  "The rule may land in `src/cart.ts` with the invoice importing it, or in a new module both import. Either passes, which no single content assertion expresses, so confirm `src/cart.ts` holds at most one copy. Semantic: the merged rule can be spelled several ways.",
  "The staff discount applies to every order size, not only the 100 threshold the member rule carries. Semantic: the condition can be written several ways.",
  "The run named the duplicated member rule as the reason to merge before adding the variant. Unwired: the claim is about the session's turns, which the checker does not read.",
]

[[content]]
path = "src/invoice.ts"
pattern = '(?<![\s\S])(?![\s\S]*0\.[89]\b)'
why = "The invoice no longer carries its own discount arithmetic, so it reads the rule from wherever the merge put it."

[[content]]
path = "src/cart.ts"
pattern = '(?<![\s\S])(?![\s\S]*(?:Strategy|Factory))'
why = "No strategy or factory type for the variant inside the cart either."
