# What a correct `/canon:ui-record` run leaves behind on the seeded inbox app.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.
#
# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so an array written at the bottom parses
# clean and silently asserts nothing.
#
# The storyboard names two beats, so every per-beat path below is named once for
# `01-` and once for `02-`, since a glob alone passes on one beat. The slug and
# the beat names are the session's own, so no path spells either. The route a
# beat took is not asserted, since a stepped beat falling back to the screencast
# is a correct run.

paths = [
  ".canon/tmp/ui-record/*/plan.json",
  ".canon/tmp/ui-record/*/takes/take.json",
  ".canon/tmp/ui-record/*/takes/01-*/clip.mp4",
  ".canon/tmp/ui-record/*/takes/01-*/log.json",
  ".canon/tmp/ui-record/*/takes/01-*/camera.json",
  ".canon/tmp/ui-record/*/takes/02-*/clip.mp4",
  ".canon/tmp/ui-record/*/takes/02-*/log.json",
  ".canon/tmp/ui-record/*/takes/02-*/camera.json",
  ".canon/tmp/ui-record/*/takes/01-*/still.jpg",
  ".canon/tmp/ui-record/*/takes/02-*/still.jpg",
]

# The throwaway copy Step 1 adds is gone. The copy itself sits under /tmp,
# outside the tree the checker reads, so this names the registration file under
# the shared git dir. A bare `.git/worktrees/*` matches nothing even while one
# is live, since the scan returns files only.
absent = [".git/worktrees/*/HEAD"]

# Any write outside the skill's scratch fails, the stand-in for "no tracked file
# changed". The seed's `src/index.html` and `canon/config/app-drive.toml` are
# the files a run serving from the checkout or writing the config would touch.
write_scope = [".canon/tmp/ui-record/**"]

escape_scope = []

# Observed at 15 turns and 0.19 dollars on 2026-10-26, from one run. Declared
# with headroom rather than tightened from a single observation, since a
# selector miss costs a refusal and a second take.
max_turns = 25

manual = [
  "The beats were shown in plain words before any take ran. Unwired: the Action narration approves them up front for a headless run, and the order lives in the transcript.",
  "Each still was opened and described beside its beat. Semantic: a description is a judgment over the image.",
  "The archive still shows the invoice row gone and the search still shows the list narrowed to the review notes. Visual: the checker cannot read pixels.",
  "A beat that fell back to the screencast was named to the operator. Unwired: a reply substring is brittle, and a run with no fallback has nothing to name.",
]

# The plan holds both storyboard beats as steps the verb reads.
[[content]]
path = ".canon/tmp/ui-record/*/plan.json"
pattern = '"kind":\s*"click"'

[[content]]
path = ".canon/tmp/ui-record/*/plan.json"
pattern = '"kind":\s*"fill"'

# The record lists both beats and the route that filmed each.
[[content]]
path = ".canon/tmp/ui-record/*/takes/take.json"
pattern = '"dir":\s*"02-'

[[content]]
path = ".canon/tmp/ui-record/*/takes/take.json"
pattern = '"route":\s*"(step|screencast)"'

# The archive beat's log carries its click with the target's box.
[[content]]
path = ".canon/tmp/ui-record/*/takes/01-*/log.json"
pattern = '"kind":\s*"click"'

# The search beat's log carries the typing burst.
[[content]]
path = ".canon/tmp/ui-record/*/takes/02-*/log.json"
pattern = '"kind":\s*"type"'

# Each camera track carries its frames.
[[content]]
path = ".canon/tmp/ui-record/*/takes/01-*/camera.json"
pattern = '"frames":\s*\[\{'
