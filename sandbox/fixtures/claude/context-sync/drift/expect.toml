purpose = "A run of /context-sync repairs the context entry the diff made untrue and writes neither the plans, the board, nor the requirements record."

# The ceiling reads num_turns, which runs past the --max-turns cap, so it sits above observed cost to catch a blowup rather than fire on every run.
max_turns = 30

paths = [
  { path = ".canon/plans/feature-postgres-migration.md", why = "The fold reads the plan for the decisions it carries and moves nothing. Archiving belongs to task-complete and the merge's tasks archive, so a moved plan means the run reached past its own surface." },
  { path = ".canon/plans/feature-some-old-plan.md", why = "The control plan, never cited by any task, stays live too." },
]

absent = [
  { path = ".canon/plans/archive/feature-postgres-migration.md", why = "An absence over the live paths alone passes on a run that created the archive folder and moved nothing, which a sweep leaves behind whatever it decided to carry." },
  { path = ".canon/plans/archive/feature-some-old-plan.md", why = "The control plan stays live as well." },
]

write_scope = [
  { path = ".claude/**", why = "The arm runs under bypassPermissions, since no mode both allows writes under .claude/ and scopes them, so this scope replaces the denial count the envelope no longer supplies." },
  { path = "canon/context/**", why = "The one tracked folder the fold writes, where the storage rewrite lands." },
  { path = ".canon/**", why = "The record root, named since a run that moved a plan would write there and nowhere under .claude/." },
]

manual = [
  "canon/context/storage.md rewritten from SQLite to Postgres, since the diff makes its SQLite bullet untrue and the fold edits that bullet in place. Semantic: a pattern matching Postgres passes on a sentence saying the run did not migrate to it",
  "REQUIREMENTS.md unwritten, backed by the content assertion below. Semantic: the assertion proves the non-goal survived, and a reader confirms no other line of the record moved",
  "The report carries one line naming document-health for the multi-user direction change. Semantic: the line is in the session transcript rather than in a file the checker reads",
]

[[content]]
path = "canon/REQUIREMENTS.md"
pattern = '^- No multi-user support$'
why = "The fold never writes the requirements record. The narrated pivot moved multi-user in scope, so a run that wrote the record anyway drops this line."
