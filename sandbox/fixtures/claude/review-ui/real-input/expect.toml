purpose = "/canon:review-ui drives a wheel box with real spaced input and a tap box in a mobile session. Box 1 fails because proximity snapping leaves scrollY at 0 on the spaced pace, which a pass that scrolled by script would miss, and box 2 passes only if the tap reveals the caption. The arm runs by hand, bills a session, and needs the pinned CLI's browser installed once per machine through `canon browser install-browser chromium`."

paths = [
  { path = ".canon/tmp/pr/review-ui/body-*.md", why = "The review body the pass drives to." },
]

write_scope = [
  { path = ".canon/tmp/pr/review-ui/**", why = "The body, snapshots, and frames the pass drives from." },
]

manual = [
  "Box 1's evidence quotes a read after each spaced notch and the burst's read, rather than one position where the page ended.",
  "Box 2 was driven in a second session opened with `--mobile`, and the desktop session was not resized to stand in for it.",
  "The mobile session's width was read at open (360) and again after the resize to the box's 390, so the pass stated the width it drove at.",
  "Box 2's evidence reads slide 2's caption hidden before the tap and visible after it, rather than visible from the start.",
  "The comment reached the pull request as a review rather than an issue comment, so the poll's UI read sees it. The thread is remote state, and no assertion kind reads it.",
]

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = '^## UI review[ \t]*$'
why = "A failed box is owed, so the review cannot close."

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = '1 failed · 0 needs? your eyes · 1 passed · 0 not driven'
why = "The wheel box fails and the tap box passes."

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = '[Ss]paced'
why = "The fail names the pace that stuck, since six notches sent apart leave scrollY at 0 where six sent in a burst reach 522."

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = '522'
why = "The burst read sits beside the spaced one."

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = 'hover: hover'
why = "The tap box quotes the hover query the mobile session read, which is what decides whether the caption can reveal on hover."

[[content]]
path = ".canon/tmp/pr/review-ui/body-*.md"
pattern = '<!-- review-ui: head=[0-9a-f]{7,40} -->'
why = "The marker the poll reads to decide whether the verdict covers the head."
