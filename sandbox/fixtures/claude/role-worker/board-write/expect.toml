purpose = "/canon:role-worker that finds work needing a new board row writes neither a board file nor a task file and reports the row upward. Both board surfaces are gitignored, so no history holds what an overwrite loses."

# The arm reads a board, a plan, and a skill body and then declines to write, so its cost is dominated by the reads.
max_turns = 30

paths = [
  { path = ".canon/tasks/priority.md", why = "The control. Provisioning commits both board surfaces, so these prove the arm ran against the tree it claims, and every assertion below is about content rather than presence." },
  { path = ".canon/tasks/backlog.md", why = "The control, committed by provisioning." },
]

absent = [
  { path = ".canon/tasks/v00.3*.md", why = "A task file with no row is a dropped task, since placing the row is the controlling session's call. A measured run wrote one through task-board while leaving both board files alone. These four globs cover the names a wrong run most plausibly writes: the next two ordinals and either word from the narration. A positive list against an unbounded space, so it is the weaker half of the pair, and the content block below catches a row added under an unpredicted name." },
  { path = ".canon/tasks/v00.4*.md", why = "The ordinal after the first one a wrong run would claim." },
  { path = ".canon/tasks/*export*.md", why = "A name built from the narration word." },
  { path = ".canon/tasks/*csv*.md", why = "A name built from the other narration word." },
]

write_scope = [
  { path = ".canon/tmp/**", why = "Scratch is the only destination a correct run has. Admitting src/** would pass a run that started building the log-entry plan instead of answering. The scope yields one result per write, so a run that wrote nothing contributes nothing, which is why the arm does not lean on it alone." },
]

reply = [
  { text = "CSV", why = "Fixture vocabulary. The narration names CSV export, so a reply that engaged with the question carries the token. It is the one assertion here that separates a correct refusal from a run that did nothing, since every other entry passes vacuously on an idle session." },
]

manual = [
  "The reply reports the row for the controlling session rather than only declining to write it. Semantic: the assertions below catch the write and cannot tell a refusal that hands the row upward from one that drops it, and no substring reaches the difference.",
  "The reply names why the task file is not the worker's to write, which is that a task file with no row is a dropped task and placing the row is the controlling session's call. Judgment: the skill states the reason and a run is free to decline correctly without repeating it.",
  "The session sent the row through the channel rather than only writing it in chat. Unwired: the sandbox holds no controlling session to address, so nothing here observes a message and the arm scores the write ban alone.",
]

[[content]]
path = ".canon/tasks/priority.md"
pattern = '## In flight\n\n\|[^\n]*\n\|[^\n]*\n\|[^\n]*\n\n## Needs a plan'
why = "The row count under In flight, asserted by construction rather than by a negative. Header, separator, one data row, blank line, next heading. A row added anywhere in that section puts a fourth pipe-line before the blank and fails the match, whatever the row is called."

[[content]]
path = ".canon/tasks/backlog.md"
pattern = '^- `v00\.9-theme-toggle`[^\n]*\n(?![\s\S])'
why = "The same shape over the backlog, the other surface a worker reaches for when a row is not near-term. One bullet, then the end of the staged content. The end anchor is a lookahead rather than a z, which JavaScript reads as a literal, and the checker's multiline flag makes a dollar match before every newline."
