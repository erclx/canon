purpose = "A run of /canon:document-repair rewrites the failing document and lists both folders as gated through the verb."

paths = [
  { path = "docs/overview.md", why = "The document the run rewrites." },
  { path = "canon/config/markdown.toml", why = "The gated list the run adds both folders to." },
]

write_scope = [
  { path = "docs/**", why = "The documents the run edits or updates." },
  { path = "canon/config/markdown.toml", why = "The gated list the run extends." },
]

manual = [
  "docs/overview.md passes `canon markdown audit docs/` after the rewrite. Semantic: the exit status of a command the run made is not in the envelope.",
  "The rewrite lists both folders through `canon markdown gated add` and never by hand. Unwired: how the file was written is not in the envelope.",
  "The skill states no limit number. Unwired: an absence in the reply, and `reply` asserts positives only.",
]

[[content]]
path = "canon/config/markdown.toml"
pattern = '^  "docs/",$'
why = "The failing folder is gated after its rewrite."

[[content]]
path = "canon/config/markdown.toml"
pattern = '^  "canon/context/",$'
why = "The passing folder is gated with no rewrite."

[[content]]
path = "docs/overview.md"
pattern = 'cach'
why = "The rewrite keeps the reason the scan caches, which is the seeded reason."
