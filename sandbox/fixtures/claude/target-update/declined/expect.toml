purpose = "/canon:target-update on a target one release behind, with the worktree declined, creates chore/update-canon in the checkout and commits the sync there."

paths = [
  { path = ".git/HEAD", why = "The checkout's head, which moved onto the new branch." },
  { path = ".claude/rules/canon/canon/git.md", why = "The stale rule the sync restores." },
]

reply = [
  { text = "context.md", why = "The report names the customized rule it kept." },
]

manual = [
  "No commit subject names a canon version.",
  "The preview stopped before the write, and the prompt's go-ahead is what carried the run past it. Semantic: the reply or transcript shows the preview ahead of the sync.",
  "The reply reports the governance state of the kept rule as behind. Semantic: any non-zero count but matching reads as behind, so the word current is wrong here.",
]

[[content]]
path = ".git/HEAD"
pattern = '^ref: refs/heads/chore/update-canon$'
why = "The checkout moved onto the branch the skill created."

[[content]]
path = ".git/logs/refs/heads/chore/update-canon"
pattern = 'commit'
why = "A commit landed on that branch."

[[content]]
path = ".claude/rules/canon/canon/git.md"
pattern = '^# \S'
why = "The stale rule came back, H1 included."

[[content]]
path = ".claude/rules/canon/canon/context.md"
pattern = 'project-written bullet'
why = "The customized rule kept the project's bullet."
