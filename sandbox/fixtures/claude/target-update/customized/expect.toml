purpose = "/canon:target-update on a target one release behind, with the worktree taken, commits the sync in a linked worktree while the shared checkout stays on main. It restores the stale rule and keeps the one the project edited."

paths = [
  { path = ".git/HEAD", why = "The shared checkout's head, which must not move." },
  { path = ".claude/rules/canon/canon/git.md", why = "The stale rule in the shared checkout." },
]

reply = [
  { text = "context.md", why = "The report names the customized rule it kept." },
]

manual = [
  "No commit subject names a canon version.",
  "The preview stopped before the write, and the prompt's go-ahead is what carried the run past it. Semantic: the reply or transcript shows the preview ahead of the sync.",
  "The reply reports the governance state of the kept rule as behind. Semantic: any non-zero count but matching reads as behind, so the word current is wrong here.",
]

[[content]]
path = ".git/HEAD"
pattern = '^ref: refs/heads/main$'
why = "The shared checkout stayed on main."

[[content]]
path = ".git/worktrees/*/logs/HEAD"
pattern = 'commit'
why = "A commit landed in the linked worktree."

[[content]]
path = ".claude/worktrees/*/.claude/rules/canon/canon/git.md"
pattern = '^# \S'
why = "The stale rule came back, H1 included."

[[content]]
path = ".claude/worktrees/*/.claude/rules/canon/canon/context.md"
pattern = 'project-written bullet'
why = "The customized rule kept the project's bullet."
