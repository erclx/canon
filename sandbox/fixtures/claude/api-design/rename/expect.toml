purpose = "Asked to rename a field a script outside the command parses, the run adds the new name beside the old one rather than renaming in place."

paths = [
  { path = "src/cli.ts", why = "The seeded command the run edits." },
  { path = "scripts/nightly-report.sh", why = "The caller outside the command. The prompt never names it, so a run that only reads the file it was pointed at renames and breaks it." },
]

write_scope = [
  { path = "src/**", why = "The change edits source here." },
  { path = "scripts/**", why = "A caller in scripts may need migrating beside the command." },
  { path = "README.md", why = "A change may update the docs beside it." },
  { path = "CHANGELOG.md", why = "A change may note itself here." },
  { path = "docs/**", why = "The documents the run edits or updates." },
  { path = "node_modules/**", why = "A dependency install writes here." },
  { path = "bun.lock", why = "An install rewrites the lockfile." },
  { path = "package.json", why = "A dependency change edits the manifest." },
]

manual = [
  "The run named the nightly script, or callers it could not see, as the reason to keep the old field. Unwired: the claim is about the session's turns, which the checker does not read.",
  "The run recorded the deprecation of `buyer` where a caller looks, such as a comment on the output or a note in the README, naming `customerId` as the replacement. Semantic: many spellings read the same.",
  "The command's output still comes from a shape built for the caller rather than spreading the stored row. Semantic: a mapping can be written several ways.",
]

[[content]]
path = "src/cli.ts"
pattern = 'customerId'
why = "The new field name is in the command."

[[content]]
path = "src/cli.ts"
pattern = '''\bbuyer['"]?\s*:'''
why = "The old field is still printed beside the new one."

[[content]]
path = "scripts/nightly-report.sh"
pattern = '\.buyer\b'
why = "The script outside the command still reads the field it always read."
