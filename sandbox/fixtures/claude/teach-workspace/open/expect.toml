# What a correct `/teach-workspace` run leaves behind on the open arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The workspace is gitignored in every target, so nothing in a repository checks
# its shape. This arm and its sibling are the only things that ever will, which
# is why they assert the ordinal and the mission contract rather than only that
# a folder appeared.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so a `manual` array written at the bottom
# parses clean and asserts nothing.

# Measured at 22 turns and 0.92 dollars on 2026-08-19, passing every assertion.
# The ceiling stays at 30, which is the observed count with room for a reply that
# runs longer without the skill having changed. Its sibling arm sits higher
# because it reaches the runner's own cap and this one does not.
max_turns = 30

# The topic is pinned by the invocation rather than left to the run, matching
# how the intake arms pin their slug. The ordinal is not pinned by anything but
# the rule: this is the first workspace, so a correct derivation lands on `01`
# and any other value fails here. What the arm gives up is the topic derivation,
# which is one line of the body against the whole of the workspace shape.
paths = [
  ".canon/teach/01-regex/MISSION.md",
  ".canon/teach/01-regex/RESOURCES.md",
  ".canon/teach/01-regex/GLOSSARY.md",
]

# Three wrong turns, none of them present in the seeded tree. The first two
# catch a workspace opened with no ordinal or with the ordinal counting from
# zero, and the third catches a run that answered the request by planning it.
absent = [
  ".canon/teach/regex",
  ".canon/teach/00-regex",
  ".canon/plans",
]

# The floor the skill's own guard states. A run that wrote a lesson into the
# project source or dropped a page beside the code fails here rather than in a
# reading.
write_scope = [".canon/teach/**"]

# The output names the workspace it opened. `01-regex` is the load-bearing
# token, since a reply naming the topic without the ordinal reads the same
# whether the folder was named correctly or not.
reply = [".canon/teach/01-regex/"]

manual = [
  "The starting point in the mission reflects what the invocation supplied rather than a guess. Semantic: the section is prose either way, and a pattern over it cannot tell an answer from an assumption.",
  "A run whose invocation omits the starting point asks for it and writes nothing. Unwired: that is the correct behavior and it satisfies no assertion here, so this arm carries the starting point in the prompt and covers the write instead. The first measured run of this arm, at 8 turns and 0.29 dollars, failed every content assertion for exactly that reason.",
  "The success lines name things the learner can be asked to do rather than things they will understand. Semantic: both forms are bullets under the same heading, and the difference is the verb.",
  "Nothing in the mission or the glossary rests on recall without saying so. Unwired: the sandbox has no network, so the research step cannot run at all, and this arm asserts the workspace shape rather than the sourcing.",
  "Whether the opening pass should teach as well as open. Semantic: the measured run wrote a lesson, a reference page, a learning record, and the shared stylesheet on the same pass, and a run that opened the workspace and stopped satisfies every assertion above just as well. Nothing here decides which is correct.",
  "The workspace was created through `canon teach open` rather than by hand. Unwired: the claim is about which commands were invoked, which the envelope does not carry, so a run that ignored the verb and wrote the three files itself passes every assertion above. The skill body routes the open through the verb because a linked worktree gives a heredoc no way to derive the ordinal, and this arm stopped reaching that half once the body changed.",
]

# The mission frontmatter. `date` is the day the workspace opened and it is the
# only date in the folder, so a run that dated each file instead leaves this
# field missing.
[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^title: \S'

[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^description: \S'

[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^date: \d{4}-\d{2}-\d{2}$'

# The three sections the mission owes. The success list is the one a later
# session reads as exit criteria, so a mission carrying the other two and not
# this one can never be called finished.
[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^## Starting point$'

[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^## Success looks like$'

[[content]]
path = ".canon/teach/01-regex/MISSION.md"
pattern = '^## Out of scope$'

# The resources file splits what was read from what was found. The leads heading
# is what stops a link to an unopened page being cited as a source.
[[content]]
path = ".canon/teach/01-regex/RESOURCES.md"
pattern = '^#+ [Ll]eads'

[[content]]
path = ".canon/teach/01-regex/GLOSSARY.md"
pattern = '^title: \S'
