purpose = "A request to load review-craft and review the branch writes a findings file that grades the unpinned package, the stale README claim outside the hunk, the weakened shellcheck run, and the risky dependency upgrade."

paths = [
  { path = ".canon/review/branch-*release-tag.md", why = "The glob covers both slugs a run derives from feat/release-tag, with and without the type segment." },
]

write_scope = [
  { path = ".claude/**", why = "Seeds and settings the harness injects land here." },
  { path = ".canon/review/**", why = "The findings file the request names." },
]

manual = [
  "The report names the unused `dry_run` as something built that nobody calls, and states the cost rather than a taste. Semantic: a design finding can be worded many ways.",
  "The unpinned package is graded critical or should-fix rather than minor. Semantic: severity belongs to the procedure body's ladder and a substring cannot tell a correct grade from a word that happens to appear.",
]

[[content]]
path = ".canon/review/branch-*release-tag.md"
pattern = 'unpinned|Unpinned|supply chain|Supply chain|supply-chain|Supply-chain|@latest[^\n]*(pin|Pin|version|Version)'
why = "The package fetched at @latest and run on every release. A floor the craft skill must not lose, since runs caught it before review-craft existed."

[[content]]
path = ".canon/review/branch-*release-tag.md"
pattern = '^- \*\*[a-z-]+\*\*:[^\n]*Safety|README\.md\n+- \*\*(critical|should-fix|minor)\*\*'
why = "The Safety claim the diff made false sits outside every hunk. Either a graded finding names the section, or the README block opens with a graded finding rather than a clean note. This is the part of the arm that discriminates."

[[content]]
path = ".canon/review/branch-*release-tag.md"
pattern = '^- \*\*[a-z-]+\*\*:[^\n]*(check\.sh|shellcheck|ShellCheck)|check\.sh\n+- \*\*(critical|should-fix|minor)\*\*'
why = "The branch leaves the changed script out of the shellcheck run in scripts/check.sh and says why nowhere. Either a graded finding names the weakened check, or the block for that file opens with one."

[[content]]
path = ".canon/review/branch-*release-tag.md"
pattern = '^- \*\*[a-z-]+\*\*:[^\n]*(color-shim|install script|changelog|Changelog|breaking change|major (version|bump))'
why = "The upgrade bumps two dependencies in one commit, one across a major version, and the lockfile adds a package the manifest never names, carrying an install script. A graded finding names the unread range, the split, or the lockfile addition."
