purpose = "A pick-only run of /canon:deploy-app with no shell picks Cloudflare from the tree and stops at the first CLI call it is denied."

max_turns = 30

paths = [{ path = "wrangler.toml", why = "The signal file the pick reads." }]

reply = [
  { text = "Host: cloudflare", why = "The Pick step's own output line, which the body fixes, so a run that picked the other host or skipped the line goes red." },
]

write_scope = [
  { path = "wrangler.toml", why = "A pick-only run writes nothing. The signal file is admitted so the scope has a member, since an empty scope asserts nothing, and any write past the pick, such as a project config, lands outside it." },
]

manual = [
  "Semantic: whether the run stopped because the shell was denied or because it chose to stop is not readable from the tree or the reply.",
  "Unwired: that no wrangler, vercel, or gh call ran rests on the permission mode the run was driven under, which the checker does not read.",
]
