purpose = "/canon:test-craft on a page that already has an end to end spec puts the loading state in a component test instead of extending the spec. This asserts the with arm only, since the without arm fails this check by design and is scored by reading its files."

paths = [
  { path = "src/pages/Orders.*.tsx", why = "The component test for the page." },
  { path = "e2e/orders.spec.ts", why = "The existing spec, which pulls a session toward extending it." },
]

write_scope = [
  { path = "src/**", why = "The change edits source here." },
  { path = "e2e/**", why = "Browser specs sit here." },
  { path = "node_modules/**", why = "A dependency install writes here." },
  { path = "bun.lock", why = "An install rewrites the lockfile." },
  { path = "package.json", why = "A dependency change edits the manifest." },
  { path = "vitest.config.ts", why = "A component test may need the runner configured." },
  { path = "test-results/**", why = "Playwright writes its run output here." },
]

manual = [
  "The component test renders `Orders` with a stubbed `load` that has not resolved, rather than mocking React or the effect. Semantic: many spellings of a stub read the same to a pattern.",
  "The run named the layer before writing the test. Unwired: the claim is about the session's turns, which the checker does not read.",
]

[[content]]
path = "src/pages/Orders.*.tsx"
pattern = '(?:loading|Loading)'
why = "The loading state lands in the component test."

[[content]]
path = "e2e/*.spec.ts"
pattern = '(?<![\s\S])(?![\s\S]*(?:loading|Loading))'
why = "The spec gains no loading assertion. The anchor pins the lookahead to the start of the file, which makes it an absence over the whole spec."
