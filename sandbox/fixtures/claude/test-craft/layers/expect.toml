purpose = "/canon:test-craft places each behavior's test at the smallest layer that can catch its break: the price formatter at unit, the loading and empty states at component, and the order journey at end to end."

paths = [
  { path = "src/lib/price.test.ts", why = "The formatter's unit test." },
  { path = "src/components/OrderList.*.tsx", why = "The component test. The glob accepts either suffix a run may pick and excludes OrderList.tsx itself, since it demands a second dot segment." },
  { path = "e2e/*.spec.ts", why = "The browser spec for the journey." },
]

absent = [
  { path = "e2e/*.test.ts", why = "The suffix rule reserves .test.ts for unit tests. A browser spec named that way is the defect the layer routing this skill replaces used to write." },
]

write_scope = [
  { path = "src/**", why = "The change edits source here." },
  { path = "e2e/**", why = "Browser specs sit here." },
  { path = "node_modules/**", why = "A dependency install writes here." },
  { path = "bun.lock", why = "An install rewrites the lockfile." },
  { path = "package.json", why = "A dependency change edits the manifest." },
  { path = "test-results/**", why = "Playwright writes its run output here." },
]

manual = [
  "The run named the layer for each behavior before writing it. Unwired: the claim is about the session's turns, which the checker does not read.",
  "The component test renders `OrderList` with a stubbed `load` rather than mocking React or the effect. Semantic: many spellings of a stub read the same to a pattern.",
  "The unit test covers the refused input as well as the main path, being a negative or fractional price. Semantic: the case can be spelled several ways.",
  "The Playwright spec waits on web-first assertions and carries no fixed pause. Unwired: an absence inside a file whose name the run derives.",
]

[[content]]
path = "src/lib/price.test.ts"
pattern = 'formatPrice'
why = "The unit test exercises the formatter."

[[content]]
path = "src/components/OrderList.*.tsx"
pattern = 'Loading orders'
why = "The loading state is tested at the component layer."

[[content]]
path = "src/components/OrderList.*.tsx"
pattern = 'No orders yet'
why = "The empty state is tested at the component layer."

[[content]]
path = "e2e/*.spec.ts"
pattern = '/confirmation|Order placed'
why = "The journey spec reaches the confirmation."

[[content]]
path = "e2e/*.spec.ts"
pattern = '(?<![\s\S])(?![\s\S]*Loading orders)'
why = "The loading state is reachable in a component test, so no browser spec asserts it. The anchor pins the lookahead to the start of the file, which makes it an absence over the whole spec."
