purpose = "The file phase of /backlog-triage writes an overview and numbered cluster files under a fresh intake folder and moves no task."

max_turns = 40

paths = [
  { path = ".canon/intake/01-backlog-triage/00-overview.md", why = "The seeded tree opens with neither an intake nor a groundwork folder, so the claimed ordinal can only be 01 and the skill fixes the slug." },
]

absent = [
  { path = ".canon/tasks/declined", why = "The file phase writes nothing outside its folder, so no task is declined." },
  { path = ".canon/tasks/archive", why = "Nor is any task archived." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Intake files land in the folder the pass opens." },
]

reply = [
  { text = ".canon/intake/01-backlog-triage/", why = "The reply names the folder it wrote." },
]

manual = [
  "v03.0 is suggested keep and v05.0 is suggested decline. Semantic: which cluster file holds each item is the run's call, so a pattern cannot anchor the verdict to its row.",
  "v08.0 is suggested decline although its unused export reproduces, since the row names no cost and no reach. Semantic: same reason.",
  "v02.0 is suggested archive naming positions 1 and 2 and #58, and v04.0 is suggested promote naming the pagination in #61. Semantic: same reason.",
  "Every problem line carries a count, a path, or a commit measured this pass. Semantic: any digit in the file would satisfy a pattern.",
  "No `You:` slot is filled. Unwired: `canon intake list 01-backlog-triage --unread --json` reports seven unread items when it holds.",
]

[[content]]
path = ".canon/intake/01-backlog-triage/00-overview.md"
pattern = '^date: \d{4}-\d{2}-\d{2}$'
why = "The overview carries its date in frontmatter."

[[content]]
path = ".canon/intake/01-backlog-triage/00-overview.md"
pattern = '\]\((?!00-)\d\d-[a-z][a-z0-9-]*\.md'
why = "The index links a numbered cluster file, which proves the numbering and the domain half of each filename together."

[[content]]
path = ".canon/tasks/priority.md"
pattern = '^\| \[v07\.0 auth tokens\]\(v07\.0-auth-tokens\.md\)'
why = "The control row sits on the board, so the pass leaves it where it was."
