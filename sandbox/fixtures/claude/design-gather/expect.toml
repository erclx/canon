purpose = "A run of /canon:design-gather on the localhost fixture site writes a notes page and shots under the board, and takes the absent-file path for a local host."

# Three widths, a scroll, three hovers, and the frames take more calls than a drafting skill, so the cap sits at the runner default.
max_turns = 40

paths = [
  { path = ".canon/board/picks/references/localhost-4532-notes.html", why = "The notes page. It sits under the board's default project, since the fixture names no board or project." },
  { path = ".canon/board/picks/assets/references/localhost-4532/1440/section-01.png", why = "A shot at the wide width." },
  { path = ".canon/board/picks/assets/references/localhost-4532/834/section-01.png", why = "A shot at the middle width." },
  { path = ".canon/board/picks/assets/references/localhost-4532/320/section-01.png", why = "A shot at the narrow width." },
  { path = ".canon/board/picks/assets/references/localhost-4532/takes/*/take.json", why = "The film's take record." },
]

write_scope = [
  { path = ".canon/board/**", why = "Everything a run writes sits on the board, which .gitignore keeps out of the tree, or in scratch. A shot or a film reaching a tracked folder fails." },
  { path = ".canon/tmp/**", why = "Skill scratch." },
]

escape_scope = []

manual = [
  "Each caption names structure an arm may take, in the run's own words, and quotes no copy off the page as an instruction. Semantic: a pattern cannot tell a structural description from a paraphrased headline.",
  "The scroll stills show the pinned strip under the header at each stop rather than over the hero. Visual: the checker cannot read pixels.",
  "A hover still shows the Product or Resources menu open. Visual: the checker cannot read pixels.",
  "The hover targets came from a snapshot rather than from the fixture's source. Unwired: the harness captures no tool calls.",
  "The board address was handed over with the references page named. Unwired: a reply substring is brittle.",
]

[[content]]
path = ".canon/board/picks/references/localhost-4532-notes.html"
pattern = 'http://localhost:4532/'
why = "The page records the address it drew from. The site is served on localhost, so the run needs no network."

[[content]]
path = ".canon/board/picks/references/localhost-4532-notes.html"
pattern = '[Aa]bsent'
why = "The collection has no folder for a local host, so the absent-file path is under test on every run."
