purpose = "/canon:plan-feature on a task resting on a third-party behavior writes a plan with a Sources section pairing a link with a quoted passage. The arm runs live fetches, so a host without outbound access reports it red."

paths = [
  { path = ".canon/plans/feature-*.md", why = "The plan the run wrote." },
]

write_scope = [
  { path = ".canon/plans/**", why = "The plan the run writes." },
  { path = ".canon/tasks/**", why = "The task board and its index." },
  { path = ".canon/tmp/**", why = "Skill scratch." },
]

manual = [
  "The cited source is an authority for the payment API, such as its own documentation, rather than a blog post or a forum answer. Semantic: which domains count as authoritative is a judgment a pattern cannot make.",
  "The quoted passage appears on the cited page and supports the decision it is listed against. Semantic: the envelope carries no fetch result to compare against.",
]

[[content]]
path = ".canon/plans/feature-*.md"
pattern = '^(\*\*Sources:\*\*|## Sources)[ \t]*$'
why = "The plan carries a Sources section, in either spelling the validator reads."

[[content]]
path = ".canon/plans/feature-*.md"
pattern = 'https://[^\s)]+.*"[^"]{8,}"'
why = "At least one entry pairs a link with a double-quoted passage. The patterns check shape only."
