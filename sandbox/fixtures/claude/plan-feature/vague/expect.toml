purpose = "/canon:plan-feature on an ask naming no number reframes it into the measurable budget canon/REQUIREMENTS.md states."

max_turns = 30

paths = [
  { path = ".canon/plans/feature-*.md", why = "Plans are gitignored and the checker scans the tree rather than what git lists, so the glob reaches the plan the run wrote." },
]

write_scope = [
  { path = ".canon/plans/**", why = "The plan the run writes." },
  { path = ".canon/tasks/**", why = "The task board and its index." },
  { path = ".canon/tmp/**", why = "Skill scratch." },
]

manual = [
  "The success criteria were settled before `**Files to touch:**` was written. Unwired: order of reasoning is a claim about the session, and the plan's section order is fixed by the standard either way.",
  "The number with a unit sits on a `**Verification:**` bullet rather than elsewhere in the plan. Semantic: the pattern below matches the number anywhere, since a section-scoped match would need a multi-line regex the checker does not anchor.",
]

[[content]]
path = ".canon/plans/feature-*.md"
pattern = '^(\*\*Verification:\*\*|## Verification)[ \t]*$'
why = "The plan carries the verification section the plan standard requires, in either accepted spelling."

[[content]]
path = ".canon/plans/feature-*.md"
pattern = '\b\d+\s?ms\b'
why = "A latency criterion as a number with a unit. The seeded budget is the only source of one, so a plan that never read it or never reframed the ask carries no match."
