purpose = "/canon:review-pr on a branch that changes the header's markup and style and posts no evidence comment, on a trunk that keeps captures under evidence/header/, grades the absent capture as a finding rather than asking a question."

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The review body. The short-sha segment comes from the head commit, so only the prefix is fixed." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm's diff has any business touching." },
]

manual = [
  "The finding is graded rather than asked as a question with no severity. Semantic: the grade sits on a line a pattern can find, and whether it attaches to the missing-capture finding rather than a neighbor is a reading.",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review[ \t]*$'
why = "A graded finding is open, so the pass cannot close."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '(no|No|missing|Missing|absent|Absent|stale|Stale|outdated|Outdated|without|Without)( an?)? ([a-z]+ )?(screenshots?|captures?|evidence)|re-capture|Re-capture|recapture|Recapture|(no|No) [^\n]{0,4}## Evidence'
why = "The finding names the missing capture. The project holds the convention, so the absence is a finding the pass grades."
