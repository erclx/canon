purpose = "/canon:review-pr on a pass whose marker sits one commit behind the head reviews the delta rather than stopping as unchanged. A pass reading the commit oid instead sees the head covered and writes nothing, so a body file is the whole verdict. The arm needs a released canon binary carrying `canon pr review-state` on PATH, since an older one takes the skill's fallback and fails every assertion for a release reason."

absent = [
  { path = ".claude/standards/pr.md", why = "No target here installed the corpus, so the skill's own references route is the only one left, and a local copy would swap the standard the pass read its Testing discipline from." },
  { path = "standards/pr.md", why = "The same path without the .claude prefix." },
]

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The head moved, so the name carries two segments rather than the repeated-head third one. A pass that took the unchanged-head stop never reaches the body write, so this path separates the two outcomes." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm diff has any business touching." },
]

manual = [
  "The posted comment's marker names the head this pass read, not the commit the seeded pass named. Both are on the thread, and only the newest one scopes the pass after this",
  "`claude/skills/role-orchestrator/scripts/poll.ts` reports this pull request as MOVED rather than SEEN on a first run against it. The seeded stamp equals the head, which is what SEEN fires on, and the marker is what keeps it from firing",
  "The pass did not stop with 'The head is unchanged since the prior pass'. That stop is the failure this arm exists against, and it leaves no local file to assert on",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review'
why = "The pass reviewed something rather than stopping, under either heading. Which one it picked is the threshold's business and not this arm's."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '<!-- review-pr: commit=[0-9a-f]{7,40} read-at=[0-9]{4}-[0-9]{2}-[0-9]{2}T'
why = "The marker the next reader parses. Its shape is fixed by `canon pr review-state`, so a body missing it reads as a pre-marker pass and drops the next reader back onto the stamps this arm exists to stop trusting."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = 'Reviewed by Claude Code'
why = "The footer every pass owes, which the marker sits below rather than replaces."
