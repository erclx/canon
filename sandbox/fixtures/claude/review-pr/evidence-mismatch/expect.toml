purpose = "/canon:review-pr on a pull request whose evidence checklist claims the navigation collapses below 600px, while the narrow capture shows the row running off the edge, writes the capture out and raises the mismatch. The markup alone does not say so, since a reader has to notice the removed media query."

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The review body. The short-sha segment comes from the head commit, so only the prefix is fixed." },
  { path = ".canon/tmp/pr/review/evidence/*/**", why = "Proves the pass wrote an image out through git show rather than reading the markup and guessing." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm diff has any business touching." },
]

manual = [
  "The pass opened the image it wrote out rather than only writing it. Unwired: the checker reads the tree, not the session's tool calls.",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review[ \t]*$'
why = "The mismatch is an open finding, so the pass cannot close."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = 'collapse|Collapse'
why = "The ticked box is quoted or named by what it claims."
