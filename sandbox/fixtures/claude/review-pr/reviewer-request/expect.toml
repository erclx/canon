purpose = "/canon:review-pr on a clean diff answers the For the reviewer bullet from the diff and closes, with the folded block standing in for the canned line rather than forcing the review open."

# A single clean pass at 25 turns against the default cap of 30 is too few samples to set a ceiling from.

absent = [
  { path = ".claude/standards/pr.md", why = "No target here installed the corpus, so the skill's own references route is the only one left, and a local copy would swap the standard the pass read its Testing discipline from." },
  { path = "standards/pr.md", why = "The same path without the .claude prefix." },
]

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The review body. The short-sha segment comes from the head commit, so only the prefix is fixed." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm's diff has any business touching." },
]

reply = [
  { text = "reviewer request", why = "Fixed by Step 5's own output template, not chosen by the run." },
]

manual = [
  "The block's answer correctly reports that `handleCreate` validates the title before calling `createTask`. Semantic: whether the stated answer is correct is a judgment no substring can carry, though its presence is asserted below",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review closed'
why = "The heading this arm exists to prove: an all-answered For the reviewer block takes the closed heading rather than forcing the review open."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^<summary>For the reviewer, 1 confirmed</summary>'
why = "An answered bullet folds under a counted summary rather than an open bold block, which would mark it owed."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '<summary>For the reviewer[^<]*</summary>[\s\S]*handleCreate[^\n]*title'
why = "The request shortened inside the fold proves the pass read the section itself. The skill writes it shortened, so only its subject and object are fixed rather than the author's words."
