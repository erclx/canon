purpose = "/canon:review-pr on a head with a first review and a newer reply under Post-review findings reads that reply and posts a body. The prior commit still equals the head, so the Step 2 guard decides whether the pass has anything to add. This mirrors answered-head from the other side."

# The pass opens the file the reply names, confirms the defect, and composes a full review post, which costs more and varies more than a refusal-only arm, so the ceiling sits well above the highest sample.
max_turns = 32

paths = [
  { path = ".canon/tmp/pr/review/body-*-r*.md", why = "A body file lands rather than staying absent. The third segment is the id of the reply Step 2 resolved, a real GitHub comment id this fixture cannot predict." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm's diff has any business touching." },
]

reply = [
  { text = "Posted to PR #", why = "Fixed by Step 5's own output template, not chosen by the run." },
]

manual = [
  "The posted body reads the length-cap finding correctly rather than treating it as an answer to a question nobody asked. Semantic: whether the pass's own analysis is correct is a judgment no substring can carry, though the file's presence and its collision-avoiding name are asserted above",
]
