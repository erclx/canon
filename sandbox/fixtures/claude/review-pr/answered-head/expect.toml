# What a correct `/canon:review-pr` run leaves behind on the
# answered-head arm. Read by `canon sandbox check`. Patterns use TOML literal
# strings so a regex needs no backslash escaping.
#
# The seed already carries a close-out with no response since, so the prior
# commit equals headRefOid and the response query newer than that close-out
# comes back empty. The fix this arm proves moved that check to Step 2, ahead
# of both the review and the body write, so a pass that would otherwise go
# straight to composing a close-out never reaches the point where it posts.

# Two clean runs on 2026-08-26 came in at 8 and 7. The refusal resolves off
# one read with nothing to execute behind it, the same fixed-cost shape as
# `canon-operator/unmigrated`, so two samples are enough to set a ceiling.
max_turns = 12

# The whole assertion for the negative half. A second close-out would still
# write a body file, so the folder staying empty is what proves no post
# happened, matching the shape `project-commands/refused` already uses for a
# refusal.
absent = [".canon/tmp/pr/review/*.md"]

# Fixed by the refusal Step 2 states, not chosen by the run.
reply = ["head is unchanged"]

manual = [
  "The refusal names the prior pass's short commit rather than a placeholder. Semantic: whether the named sha matches the seeded close-out's commit is a judgment no substring can carry",
]
