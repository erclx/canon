purpose = "/canon:review-pr on a head whose standing close-out has no response since refuses at Step 2 and posts nothing. The seeded prior commit equals the head, so the refusal sits ahead of both the review and the body write."

# The refusal resolves off one read with nothing to execute behind it, a fixed-cost shape, so a few samples are enough to set a ceiling.
max_turns = 12

absent = [
  { path = ".canon/tmp/pr/review/*.md", why = "The whole negative half. A second close-out would still write a body file, so the folder staying empty proves no post happened." },
]

reply = [
  { text = "head is unchanged", why = "Fixed by the refusal Step 2 states, not chosen by the run." },
]

manual = [
  "The refusal names the prior pass's short commit rather than a placeholder. Semantic: whether the named sha matches the seeded close-out's commit is a judgment no substring can carry",
]
