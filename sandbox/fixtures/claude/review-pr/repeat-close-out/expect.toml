purpose = "/canon:review-pr on a moved head whose delta raises nothing, under a standing Review closed, rewrites that comment rather than posting a second close-out beside it. The head moved, so the unchanged-head stop cannot fire."

# The spread is the open question: the pass decides whether the delta raises a finding, and the two branches cost different turns, so a ceiling drawn from the cheaper one would fail the other.

absent = [
  { path = ".claude/standards/pr.md", why = "No target here installed the corpus, so the skill's own references route is the only one left, and a local copy would swap the standard the pass read its Testing discipline from." },
  { path = "standards/pr.md", why = "The same path without the .claude prefix." },
]

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The head moved, so the name carries two segments rather than the repeated-head third one." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm's diff has any business touching." },
]

manual = [
  "The thread carries exactly one `## Review closed`. A second one posted beside the first is the whole defect this arm exists against, and no local file records whether the pass posted or rewrote",
  "The standing close-out's body now names the refactor commit rather than the commit it was first submitted against, which is what proves the rewrite landed rather than being skipped",
  "The pass raised no finding on the refactor commit. A pass that found something correctly posts a fresh `## Review` instead, and the guard is not what that outcome tests",
  "No comment sits under a heading outside the five the review and reply families fix. `poll.ts` reports anything else as UNMATCHED",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review closed'
why = "The heading the rewrite keeps. A pass that reopened the review under Review on a delta raising nothing failed the threshold rather than the guard, and this pins the half a local file can carry."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = 'Re-reviewed'
why = "The scope line names what this pass covered rather than what the standing comment covered, which is the body half of the rewrite."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = 'Reviewed by Claude Code'
why = "The footer every pass owes, kept through a rewrite the same as through a post."
