purpose = "/canon:review-pr on a plan naming two inputs under Review focus confirms the first under a folded summary and files the second as a should-fix, which keeps the review open. The diff rejects an empty title and places no cap on length."

paths = [
  { path = ".canon/tmp/pr/review/body-*.md", why = "The review body. The short-sha segment comes from the head commit, so only the prefix is fixed." },
]

write_scope = [
  { path = ".canon/tmp/pr/review/**", why = "The only file this arm's diff has any business touching." },
]

manual = [
  "The block names the empty-title guard in `handleCreate` as what confirmed the first item. Semantic: whether the named evidence is the right one is a judgment no substring can carry.",
  "The should-fix finding sits under the `src/tasks.ts` block and names the missing length cap. Semantic: a finding can word the cap many ways.",
]

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^## Review[ \t]*$'
why = "The unconfirmed item is an open should-fix, so the pass cannot close."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '^<summary>Review focus, [0-9]+ checked</summary>'
why = "The confirmed item folds under a counted summary."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '\*\*should-fix\*\*'
why = "The unconfirmed item is filed as a should-fix."

[[content]]
path = ".canon/tmp/pr/review/body-*.md"
pattern = '\*\*should-fix\*\* \(\[lines? [0-9-]+\]\([^)]*blob/[0-9a-f]{40}/src/tasks\.ts#L[0-9]+'
why = "The should-fix sits under src/tasks.ts, so its own bullet links to its line at the reviewed head. The pattern opens on the should-fix bullet, so a plain bullet fails it and a link inside a minor or a folded Review focus bullet does not satisfy it."
