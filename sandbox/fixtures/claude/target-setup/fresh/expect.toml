purpose = "/canon:target-setup run against a tree with no framework evidence installs governance and tooling for the base stack and skips the framework steps. The arm runs the real installer."

# A clean run cost 20 turns against the default cap of 30. The arm drives the real installer across six domains, so how a run orders those installs moves the count, and the ceiling holds at the default until a second pass shows the cost is stable.
max_turns = 30

paths = [
  { path = "CLAUDE.md", why = "One path per domain the chain installs. A run that reported success while skipping one leaves the others in place, so a single path proves nothing about the chain." },
  { path = ".claude/rules/canon/claude/output.md", why = "The claude rule folder landed." },
  { path = ".claude/rules/canon/canon/scratch.md", why = "The canon rule folder landed." },
  { path = "commitlint.config.js", why = "The tooling domain landed its base config." },
]

absent = [
  { path = ".claude/rules/canon/framework/react.md", why = "The base fallback, asserted rather than described. Base carries no framework rule, so a run that read an empty project and picked react anyway lands this." },
  { path = "vite.config.ts", why = "A run that ran step 2 instead of skipping it lands this." },
  { path = ".oxlintrc.json", why = "A run that ran step 2 instead of skipping it lands this." },
  { path = ".claude/standards", why = "No install channel writes it." },
  { path = ".claude/wiki", why = "A run that ran step 2 instead of skipping it lands this." },
]

# No write_scope is declared. The install writes a whole project scaffold and the verify phase runs bun install behind it, so the narrowest glob admitting a correct run is `**`, and a scope that cannot go red is the silent-green shape the checker exists to prevent.

reply = [{ text = "base", why = "The stack the resolve step fell back to." }]

manual = [
  "The verify phase runs and reports the base scripts alone. Unwired: the claim is about which commands were invoked, which the envelope does not carry",
  "The preview names each detected technology beside the file it was detected in. Semantic: this arm carries no framework evidence, so a correct preview reports an empty detection and no substring separates that from a preview that skipped the step",
  "The run reaches nothing outside the sandbox tree. Semantic: the install legitimately writes the whole tree, so no `write_scope` glob distinguishes a correct run from a wrong one and the claim has no mechanical form here",
]

[[content]]
path = "canon/config/config.json"
pattern = '"covers": \[\s*"governance",\s*"tooling"\s*\]'
why = "Both stamped domains wrote their manifest. A run that installed governance and stopped leaves a well-formed config.json carrying one entry, which every path above still passes."
