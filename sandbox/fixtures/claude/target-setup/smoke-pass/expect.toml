purpose = "/canon:target-setup verify deep runs all four stages in order. Each staged script touches a marker as its first action, so a marker's presence proves the skill invoked that script regardless of what the script prints."

max_turns = 20

paths = [
  { path = ".smoke/dev-started", why = "One marker per stage in the fixed order the skill runs: dev, preview, test:e2e, screenshot. All four exist only when every stage ran." },
  { path = ".smoke/preview-started", why = "The second stage ran." },
  { path = ".smoke/e2e-ran", why = "The third stage ran." },
  { path = ".smoke/screenshot-ran", why = "The last stage ran, so the chain reached its end." },
]

manual = [
  "The dev and preview stages report pass. Semantic: pass/fail for a long-running server has no manifest-exposed port to probe, so the judgment reads backgrounded output for a fatal string rather than a fixed exit code, and no content pattern can assert on a heuristic read of a process this checker does not itself run",
  "The run reports a summary line naming four scripts passed. Unwired: the envelope does not carry which commands a skill invoked, only the tree the run left behind",
]
