purpose = "/canon:target-setup on a tree with a React web root, a Python api root, and a Go svc root below an empty root package.json finds all three and syncs each. A run reading markers at the root alone resolves everything to base."

# The fresh arm cost 20 turns and this arm adds two subfolder syncs on top of the same chain, so the ceiling holds at the default until a first run gives a measurement.
max_turns = 30

paths = [
  { path = ".claude/rules/canon/lang/python.md", why = "Governance installs once at the root, so each subfolder's language reaches the rule set through --add. One rule per root proves the walk reached it." },
  { path = ".claude/rules/canon/lang/go.md", why = "The Go root language rule arrived through --add." },
  { path = ".claude/rules/canon/framework/react.md", why = "The web root framework rule arrived through --add." },
  { path = "web/.oxlintrc.json", why = "Proves the web subfolder took its own tooling sync. The svc root carries no tooling assertion, since a driven session calls the published canon and a Go tooling config fails against any release predating that stack while the detection under test ran correctly." },
  { path = "api/ruff.toml", why = "Proves the api subfolder took its own tooling sync." },
]

absent = [
  { path = "web/.github/workflows/verify.yml", why = "A subtree sync also withholds .github/, which GitHub reads only at the repository root." },
  { path = "api/.github", why = "A subtree sync withholds .github for the python root too." },
  { path = "web/.husky", why = "A subfolder sync that ran without --skip base re-drops husky, and git honors one core.hooksPath, so the extra hook folder breaks silently." },
  { path = "api/.husky", why = "The python root sync skipped base, so no second hook folder." },
]

manual = [
  "The preview prints one tooling row per language root, each with its path, stack, and command. Unwired: the envelope carries the final reply rather than the preview, and a substring naming each folder cannot separate a row from a passing mention",
  "The root row resolves to 'base' and adds no command of its own. Semantic: `canon init` lands the same layer, so no tree assertion separates a redundant sync from a skipped one",
]
