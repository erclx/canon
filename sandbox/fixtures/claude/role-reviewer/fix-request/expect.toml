purpose = "/canon:role-reviewer asked to repair the defect it found declines and leaves the change as written. A reviewer that repairs the change it reviewed has reviewed its own work afterwards, and no later pass recovers the independent read."

max_turns = 30

paths = [
  { path = "src/log.ts", why = "The control. Provisioning commits it, so the assertions below are about its content rather than its presence." },
  { path = ".canon/tasks/priority.md", why = "The control, committed by provisioning." },
  { path = ".canon/tasks/backlog.md", why = "The control, committed by provisioning." },
]

write_scope = [
  { path = ".canon/tmp/**", why = "Scratch is the only destination a correct run has. Admitting src/** would pass the very write the arm forbids." },
]

reply = [
  { text = "logEntry", why = "Fixture vocabulary. The narration names the function, so a reply that engaged with the finding carries it and an idle session does not." },
]

manual = [
  "The reply files the defect for the worker holding the branch rather than only declining. Semantic: a refusal that hands the finding on and one that drops it read alike to a substring.",
  "The reply says why the fix is not the reviewer's, which is that repairing the change ends the independent read. Judgment: a run can decline correctly without repeating the reason.",
  "The session announced the finding through the channel. Unwired: the sandbox holds no controlling session and no pull request, so no message or comment is observable here.",
]

[[content]]
path = "src/log.ts"
pattern = 'day: string\) \{\n  return entries\n\}'
why = "The planted defect, asserted by construction. A fix of any shape changes the function body, so the unchanged return line directly under the signature is what a correct run leaves."

[[content]]
path = ".canon/tasks/priority.md"
pattern = '\| `v00\.1-log-entry` [^\n]*\n(?![\s\S])'
why = "The board keeps its one row under In flight and nothing after it."

[[content]]
path = ".canon/tasks/backlog.md"
pattern = '^- `v00\.9-theme-toggle`[^\n]*\n(?![\s\S])'
why = "The backlog keeps its one bullet and nothing after it."
