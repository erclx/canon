purpose = "/canon:ui-film on the seeded inbox app films a two-beat storyboard, writing a plan, a footage page, and per-beat clips, logs, and camera tracks under the video scratch folder. The route a beat took is not asserted, since a stepped beat falling back to the screencast is a correct run."

# One run at 15 turns sets this with headroom, since a selector miss costs a refusal and a second take.
max_turns = 25

paths = [
  { path = ".canon/video/*/plan.json", why = "The slug and the beat names are the session's own, so no path spells either." },
  { path = ".canon/video/*/README.md", why = "The workspace README the verb writes." },
  { path = ".canon/video/*/footage.html", why = "The page that plays the takes." },
  { path = ".canon/video/*/takes/take.json", why = "The record of both takes." },
  { path = ".canon/video/*/takes/01-*/clip.mp4", why = "The storyboard names two beats, so every per-beat path is named once for 01- and once for 02-, since a glob alone passes on one beat." },
  { path = ".canon/video/*/takes/01-*/log.json", why = "The first beat action log." },
  { path = ".canon/video/*/takes/01-*/camera.json", why = "The first beat camera track." },
  { path = ".canon/video/*/takes/02-*/clip.mp4", why = "The second beat clip." },
  { path = ".canon/video/*/takes/02-*/log.json", why = "The second beat action log." },
  { path = ".canon/video/*/takes/02-*/camera.json", why = "The second beat camera track." },
  { path = ".canon/video/*/takes/01-*/still.jpg", why = "The first beat still." },
  { path = ".canon/video/*/takes/02-*/still.jpg", why = "The second beat still." },
]

absent = [
  { path = ".git/worktrees/*/HEAD", why = "The throwaway copy Step 1 adds is gone. The copy sits under /tmp, outside the tree the checker reads, so this names the registration file under the shared git dir. A bare .git/worktrees/* matches nothing even while one is live, since the scan returns files only." },
]

write_scope = [
  { path = ".canon/video/**", why = "Any write outside the skill's scratch fails, the stand-in for no tracked file changed. A run serving from the checkout or writing the config would touch the seed's src/index.html or canon/config/app.toml." },
]

escape_scope = []

manual = [
  "The beats were shown in plain words before any take ran. Unwired: the Action narration approves them up front for a headless run, and the order lives in the transcript.",
  "Each still was opened and described beside its beat. Semantic: a description is a judgment over the image.",
  "The archive still shows the invoice row gone and the search still shows the list narrowed to the review notes. Visual: the checker cannot read pixels.",
  "A beat that fell back to the screencast was named to the operator. Unwired: a reply substring is brittle, and a run with no fallback has nothing to name.",
]

[[content]]
path = ".canon/video/*/plan.json"
pattern = '"kind":\s*"click"'
why = "The plan holds the archive beat as a click step the verb reads."

[[content]]
path = ".canon/video/*/plan.json"
pattern = '"kind":\s*"fill"'
why = "The plan holds the search beat as a fill step the verb reads."

[[content]]
path = ".canon/video/*/README.md"
pattern = 'canon take '
why = "The workspace README carries the command that re-films the takes."

[[content]]
path = ".canon/video/*/footage.html"
pattern = 'takes/02-[^/]*/clip\.mp4'
why = "The footage page carries a player per take, read by its relative path."

[[content]]
path = ".canon/video/*/takes/take.json"
pattern = '"dir":\s*"02-'
why = "The record lists both beats."

[[content]]
path = ".canon/video/*/takes/take.json"
pattern = '"route":\s*"(step|screencast)"'
why = "The record names the route that filmed each beat."

[[content]]
path = ".canon/video/*/takes/01-*/log.json"
pattern = '"kind":\s*"click"'
why = "The archive beat's log carries its click with the target's box."

[[content]]
path = ".canon/video/*/takes/02-*/log.json"
pattern = '"kind":\s*"type"'
why = "The search beat's log carries the typing burst."

[[content]]
path = ".canon/video/*/takes/01-*/camera.json"
pattern = '"frames":\s*\[\{'
why = "Each camera track carries its frames."
