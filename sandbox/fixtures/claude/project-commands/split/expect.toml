# What a correct `/canon:project-commands` run leaves behind on the split arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# One service rather than the documented arm's two, so this sits below that
# arm's ceiling. The guard tests two paths before reading one, which costs no
# turn a single-path resolution would not.
max_turns = 10

# The arm's central assertion. `serve` writes this sentinel at startup, and it
# is reachable only through `overview.md`, so its presence is the mechanical
# proof that the folder fallback resolved. The flat path does not exist here.
paths = ["app-started.txt"]

# The sibling's `verify` touches this file, so its absence proves the skill read
# `overview.md` alone. A split entry is the one shape where the no-discovery-chain
# rule can be broken silently, since every sibling is a plausible second read.
absent = ["read-sibling.txt"]

# The service binds port 0, so the number differs every run and the URL prefix is
# the only stable token. This fails a run that started the app and reported nothing.
reply = ["http://localhost:"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply names the resolved command before running it. Semantic: a substring cannot tell a stated command from one that only appears in the transcript",
  "No log read past startup, no browser, no second check after the first passed. Unwired: the claim is about tool calls, which the envelope does not carry",
  "The stop message is never reached. Semantic: a negative substring passes on every reply that phrases the guard differently",
]
