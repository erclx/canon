# What a correct `/canon:project-commands` run leaves behind on the documented arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# A clean run cost 7 turns on 2026-07-31. Set above that rather than at it. This
# arm starts two services and reads each one's port back from a backgrounded
# call, so it is the most expensive of the three and the one whose cost is most
# likely to move.
max_turns = 14

# The arm's central assertion. Each service writes its sentinel at startup, so
# both paths present is the only mechanical proof that the request resolved to
# every command it covered. Running one of the two is the failure this arm
# exists for, and it reads as a pass in a transcript.
paths = ["web-started.txt", "api-started.txt"]

# Both services bind port 0, so the numbers differ every run and the URL prefix is
# the only stable token. This asserts a port was read back and reported at all,
# which fails the run that started both services and reported neither.
reply = ["http://localhost:"]

# Prose the checker cannot assert, each with the reason it stays here.
manual = [
  "The reply reports the second port too, and ends there. Semantic: a substring cannot count two ephemeral port numbers, and nothing distinguishes an agent that stopped from one that ran out of things to do",
  "No log read past a failure, no browser, no second check after the first passed. Unwired: the claim is about tool calls, which the envelope does not carry",
  "No defect noticed during startup is reported. Semantic: a negative substring passes on every reply that phrases a defect differently",
]
