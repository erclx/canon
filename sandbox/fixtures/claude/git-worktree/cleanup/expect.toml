purpose = "After list then cleanup in one turn, /canon:git-worktree removes the merged clean worktree and keeps the unmerged one and the occupied one."

max_turns = 30

paths = [
  { path = ".claude/worktrees/beta", why = "feat/beta is unmerged, so cleanup must leave its worktree in place." },
  { path = ".claude/worktrees/gamma", why = "feat/gamma is merged and clean like alpha, but a fake live session occupies it, so cleanup must leave it in place rather than removing it as merged." },
]

absent = [
  { path = ".claude/worktrees/alpha", why = "feat/alpha is merged and clean, so cleanup must remove its worktree." },
]

reply = [
  { text = "Removed: 1 worktrees, 1 branches pruned", why = "The skill's cleanup output contract states this line as the literal completion signal. Pinning it separates a run that classified all three rows and acted on them from one that read gamma as merely merged and removed it beside alpha." },
]

manual = [
  "The list step reports feat/alpha as 'merged (local)', feat/beta as 'unmerged', and feat/gamma as 'occupied'. Unwired: the run drives both list and cleanup in one turn, and the reply the harness captures is the session's final text, which the cleanup line may supersede.",
  "feat/alpha itself is deleted as a local branch, not only its worktree. Unwired: a deleted branch leaves no file the sandbox tree reliably carries once refs are packed, so nothing here reads it directly, and the reply pin above is what stands in for it.",
  "feat/gamma's occupancy record lives outside this sandbox tree, at the real session registry the operator's own machine reads. Unwired: this fixture cannot assert against a path outside .sandbox/, so the reply pin's held-back count is what stands in for the skip.",
]
