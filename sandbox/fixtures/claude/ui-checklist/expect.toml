purpose = "/canon:ui-checklist writes one checklist file for the seeded change, splitting a restyle for the visual list from four untested behaviors, and writes no test. A run with nothing to say would leave the branch with no output at all."

# The ceiling sits at twice the measured run rather than at it, since one sample cannot separate the skill's cost from this prompt's. It is well under the harness budget in `canon sandbox run`, which is the real cap, since a declaration here is asserted after the run and cannot raise what the run executes under.
max_turns = 12

paths = [
  { path = ".canon/tmp/handoff/ui-checklist/task-filter.md", why = "The slug transform applied to feat/task-filter, with the leading type segment dropped. The transform appears in no skill body, so asserting this exact path asserts the citation resolved through the plugin fallback rather than a project copy." },
]

absent = [
  { path = ".claude/skills/git-branch/references/slug.md", why = "The precondition, asserted rather than described. No corpus installs into a target, so the project copy is absent and the plugin fallback is the only route to the slug transform. An arm that staged its own copy would void the premise." },
]

write_scope = [
  { path = ".claude/**", why = "The seeds and settings the harness injects land here." },
  { path = ".canon/tmp/**", why = "Where the checklist goes. The skill writes one file, so a run that writes a component test, a spec, a Playwright install, a lockfile, or run output has written a test the skill no longer owns, and the violation is the assertion." },
]

manual = [
  "The spacing, padding, and color changes land on the visual list and the filter input does not. Semantic: the split between visual-only and automatable is the skill's judgment, and a pattern matching one item cannot tell a correct classification from a lucky one",
  "Each missing-test line names the layer `test-craft` would place it at, with the route change at end to end and the loading and empty states at the component layer. Semantic: the layer is the same judgment, read one line lower",
  "A box whose result is a judgment of look or feel ends in `(taste)`, and a box stating an observable fact does not. Semantic: whether the muted empty-state color reads as a judgment or as a measured value is the skill's call, and a pattern requiring the marker fails a run that classified it as a fact",
  "The chat output names the checklist path alone and does not repeat the checklist body. Unwired: the claim is about what the reply omits, and a negative substring passes on every reply that phrases it differently",
  "No test is proposed as a diff in chat either. Unwired: the write scope catches a test written to disk, and a body pasted into the reply reaches no file for the scope to see",
]

[[content]]
path = ".canon/tmp/handoff/ui-checklist/task-filter.md"
pattern = '- \[ \]'
why = "The checklist's visual half, in the checkbox syntax the skill's format fixes."

[[content]]
path = ".canon/tmp/handoff/ui-checklist/task-filter.md"
pattern = 'Shipping without a test'
why = "The missing-test half. A run that writes the visual list alone has dropped the behaviors shipping untested, which is what the skill hands to test-craft."

[[content]]
path = ".canon/tmp/handoff/ui-checklist/task-filter.md"
pattern = 'archive'
why = "The route change is the one item with a single correct layer, since only a real browser navigates it, so it reads as end to end wherever the line is phrased."

[[content]]
path = ".canon/tmp/handoff/ui-checklist/task-filter.md"
pattern = '^- \[ \] (`?/[^\s:,`]*`?|from the page the app opens on)[,:]'
why = "A written box names its route."

[[content]]
path = ".canon/tmp/handoff/ui-checklist/task-filter.md"
pattern = '^- \[ \] [^:\n]+: (?!(?:[Rr]ead|[Ll]ook)\b)[A-Za-z]+'
why = "A written box opens its action on a verb a driver performs, rather than on read or look at."

[[content]]
path = "e2e/task-list.spec.ts"
pattern = 'task list renders the seeded tasks'
why = "The seeded spec survives untouched. It is outside the write scope, and this reads the file itself rather than the scope report, so a deletion is caught as well as a rewrite."
