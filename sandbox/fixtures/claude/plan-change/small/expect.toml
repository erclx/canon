purpose = "Small-mode /canon:plan-change on a specified prose-only ask prints the plan to chat and writes no plan file."

max_turns = 30

absent = [
  { path = ".canon/plans/*.md", why = "The glob covers every markdown file in the folder rather than the feature- prefix alone, so a plan written under any name fails it." },
]

write_scope = [{ path = ".canon/tmp/**", why = "Skill scratch." }]

reply = [
  { text = "## Files to touch", why = "A run that stops to ask a question writes no file either, so the reply pins carry the assertion. This is a token Small mode's chat template carries." },
  { text = "## Verification", why = "The chat template's second section." },
  { text = "README.md", why = "The file the ask targets." },
]

manual = [
  "The decoy `DESIGN.md` sentinel is not surfaced in the reply. Semantic: a negative over the reply passes on every spelling the pattern did not anticipate.",
  "The reply carries no `## Review focus`. Semantic: same reason, a negative over the reply.",
]
