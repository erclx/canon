purpose = "/canon:plan-change names its new paths by role rather than beside the flat neighbors the seeded shop holds."

max_turns = 30

paths = [
  { path = ".canon/plans/feature-*.md", why = "Plans are gitignored and the checker scans the tree rather than what git lists, so the glob reaches the plan the run wrote." },
]

write_scope = [
  { path = ".canon/plans/**", why = "The plan the run writes." },
  { path = ".canon/tasks/**", why = "The task board and its index." },
  { path = ".canon/tmp/**", why = "Skill scratch." },
]

manual = [
  "Each new path in `**Files to touch:**` carries a one-clause placement reason. Semantic: a reason can be worded many ways and sits in the prose after the path.",
  "The run loaded `codebase-layout` before writing the file list. Unwired: the claim is about the session's tool calls, which the checker does not read.",
  "No wishlist component is named flat in `src/components/`. Semantic: a negative over the plan passes on every spelling of a flat path the pattern did not anticipate, so the positive below carries the assertion.",
]

[[content]]
path = ".canon/plans/feature-*.md"
pattern = 'src/[\w-]+/[\w-]+/[\w.-]+\.tsx'
why = "A component path at least two folders under src/. A run picks its own subfolder names, so the pattern accepts any subfolder and refuses only the flat sibling, which has one folder."

[[content]]
path = ".canon/plans/feature-*.md"
pattern = 'e2e/[\w-]+/[\w-]+\.ts\b'
why = "An end to end support file inside a subfolder of e2e/. The filename class carries no dot, so a spec in a journey folder does not satisfy it, and a helper named flat beside the specs has no subfolder."

[[content]]
path = ".canon/plans/feature-*.md"
pattern = '^(\*\*Verification:\*\*|## Verification)[ \t]*$'
why = "The plan carries the section the plan standard requires below the file list and risks, in either accepted spelling."

[[content]]
path = ".canon/plans/feature-*.md"
pattern = '^(\*\*Review focus:\*\*|## Review focus)[ \t]*$'
why = "The plan carries its review focus section, in either accepted spelling."
