purpose = "/task-complete archives the named task and carries its plan across, retargeting the plan link and leaving the control task and its plan alone. The arm asserts the successful move, not the refusals, which `src/tasks/archive/` covers at the unit level."

max_turns = 30

paths = [
  { path = ".canon/tasks/archive/v01.0-rate-limit.md", why = "The destination, not the source. A board staged with an open outcome exercises a refusal rather than the archive, and a run that declined leaves the source where a paths entry over it would find it." },
  { path = ".canon/tasks/v02.0-pagination.md", why = "The control task, which must not move." },
  { path = ".canon/tasks/priority.md", why = "Read by the content pin below, so a deleted file reports its own cause rather than a content miss." },
  { path = ".canon/plans/archive/feature-rate-limit.md", why = "The second half of the same move. The task cites a live plan no other task holds, so the archive carries it across, and asserting only the task would pass a run that stranded the plan." },
  { path = ".canon/plans/feature-pagination.md", why = "The control's plan. Its task's outcomes stay open, so a run that swept the plans folder rather than following the one task it was given moves it too." },
]

absent = [
  { path = ".canon/tasks/v01.0-rate-limit.md", why = "The source is gone." },
  { path = ".canon/tasks/archive/v02.0-pagination.md", why = "Catches a run that archived the board rather than the task it was given." },
  { path = ".canon/plans/feature-rate-limit.md", why = "Separates a moved plan from a copied one." },
]

write_scope = [
  { path = ".canon/tasks/**", why = "The task board and its index." },
  { path = ".canon/plans/**", why = "The task archive sits inside the board, so the board's glob reaches it, and the plans glob is what the archive verb writes through when it carries the plan across." },
]

reply = [
  { text = ".canon/tasks/archive/v01.0-rate-limit.md", why = "The skill reports the paths the command returned, in full from the project root. The archive destination is the token worth pinning, since a reply naming only the stem reads the same whether the file moved or not." },
]

manual = [
  "The run reached the archive through `canon tasks archive` rather than moving the file by hand. Semantic: both leave the same tree, so no assertion over the tree separates them.",
  "The board resolves at the main worktree root rather than at pwd. Unwired: a standalone sandbox repository has no linked worktree, so the two roots are the same path and no run can tell them apart.",
]

[[content]]
path = ".canon/tasks/priority.md"
pattern = '^\| ---- \| ------- \| ---- \|\n\| \[v02\.0 pagination\]\(v02\.0-pagination\.md\)'
why = "The cleared ordering row, asserted by what survives it, since an absent entry cannot express a removed table row and a negative pattern passes on every rewording. The fixture puts the archived row first, so a run that left it pushes the control's row down and the match fails."

[[content]]
path = ".canon/tasks/archive/v01.0-rate-limit.md"
pattern = '^- \[x\] Outcome: a client over the request budget is rejected'
why = "The move carried the file rather than creating an empty one at the destination. The path alone passes on a touched file."

[[content]]
path = ".canon/tasks/archive/v01.0-rate-limit.md"
pattern = '^Plan: \[feature-rate-limit\]\(\.\./\.\./plans/archive/feature-rate-limit\.md\)'
why = "The retarget. The archived task sits a folder deeper than the live one, so the pointer it carried is wrong by one level the moment it moves, and the plans folder is gitignored so nothing recovers the target it named."

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^Plan: \[feature-pagination\]\(\.\./plans/feature-pagination\.md\)'
why = "The control's pointer stays at the live path it was staged with. Asserting the plan's location alone would pass a run that retargeted every line it found."

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^- \[ \] Outcome: a list request accepts a page size and an offset'
why = "The control's outcomes stay open. A run that marked them to get the control past the open-outcome gate would leave both tasks archivable, and every other assertion would still hold."
