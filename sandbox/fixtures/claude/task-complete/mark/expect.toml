purpose = "/task-complete marking outcomes from the ship chain moves no plan. A plan is settled by the merge through `canon tasks archive`, so a run here leaves all three plans where it found them however many tasks it closes, and refuses to sweep a task closed in an earlier session."

# The ceiling sits at the default since only two turns of room exist above a clean run's cost, and the turns go to reading and reasoning about the board once.
max_turns = 30

paths = [
  { path = ".canon/plans/feature-pagination.md", why = "Belongs to the task this session's diff closes, and stays live." },
  { path = ".canon/plans/feature-rate-limit.md", why = "Belongs to a task closed in an earlier session, which nothing in the prompt mentions. A run that swept on outcome state would move it." },
  { path = ".canon/plans/feature-search.md", why = "Its task carries open outcomes and nothing in HEAD ships search, so it stays live under every reading and separates a run that moved nothing from one that moved everything." },
]

absent = [
  { path = ".canon/plans/archive/feature-pagination.md", why = "An absent entry over the live paths alone would pass on a run that created the archive folder and moved nothing, and the folder is what a sweep leaves behind whatever it decided to carry." },
  { path = ".canon/plans/archive/feature-rate-limit.md", why = "The earlier-session task plan is not swept either." },
  { path = ".canon/plans/archive/feature-search.md", why = "The open task plan stays live too." },
]

write_scope = [
  { path = ".claude/**", why = "Seeds and settings the harness injects land here." },
  { path = ".canon/**", why = "The record root the harness writes under." },
]

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^- \[x\] Outcome: a list request accepts a page size and an offset'
why = "The closing task's outcome is marked."

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^Plan: \[feature-pagination\]\(\.\./plans/feature-pagination\.md\)'
why = "Every pointer stays live, the closing task's included. A run that retargeted a line without moving the plan leaves the only pointer aimed at a path holding no file, and the plans folder is gitignored so nothing recovers it."

[[content]]
path = ".canon/tasks/v01.0-rate-limit.md"
pattern = '^Plan: \[feature-rate-limit\]\(\.\./plans/feature-rate-limit\.md\)'
why = "The earlier-session task's pointer stays live for the same reason."

[[content]]
path = ".canon/tasks/v03.0-search.md"
pattern = '^Plan: \[feature-search\]\(\.\./plans/feature-search\.md\)'
why = "The open task's pointer stays live for the same reason."

[[content]]
path = ".canon/tasks/v03.0-search.md"
pattern = '^- \[ \] Outcome: a query matches against task titles'
why = "Its outcomes stay open. HEAD ships no search, so a run marking either one matched on the board rather than on the diff."
