purpose = "A headless /git-issue run that finds a possible duplicate files nothing and reports it."

max_turns = 20

absent = [
  { path = ".canon/tmp/issue", why = "The body and comment files go through this folder, which the skill removes, and a headless match files nothing, so the folder never stays." },
]

write_scope = [
  { path = ".canon/tmp/issue/**", why = "The skill body and comment files." },
]

reply = [
  { text = "Not filed", why = "The run states it filed nothing." },
  { text = "Possible duplicate", why = "The run names the match as the reason." },
]

manual = [
  "No second issue is open on the anchor for the seeded defect. Unwired: `gh issue list --search 'fmt:write in:title,body' --state open` lists the seeded issue alone when it holds, and `--label dedupe-fixture` scopes it to this arm.",
  "The seeded issue carries no new comment. Unwired: `gh issue view <seeded> --json comments` reports none when it holds.",
]
