purpose = "/plan-intake refuses a single question unanswerable from the tree and routes it to plan-groundwork rather than filing it. The routing test decides whether the session spends a folder or a billed measurement."

max_turns = 20

absent = [
  { path = ".canon/intake", why = "Nothing was written. This is the refusal itself." },
  { path = ".canon/plans", why = "Catches a run that took the question into a plan rather than declining it." },
  { path = ".canon/groundwork", why = "Catches a run that opened a track itself. All three are absent from the seeded tree, so each failing names a different wrong turn." },
]

reply = [
  { text = "plan-groundwork", why = "The guard names its destination. A refusal that stops without routing leaves the operator where the groundwork guard already leaves them." },
]

