# What a correct `/plan-intake` run leaves behind on the file arm.
# Read by `canon sandbox check`. Patterns use TOML literal strings so a regex
# needs no backslash escaping.

# The folder is gitignored in every target, so nothing in the repository checks
# its shape. This arm is the only thing that ever will, which is why it asserts
# the numbering and the index rather than only that a folder appeared.

# Every top-level key sits above the first `[[content]]` block. A bare key below
# one belongs to that table in TOML, so a `manual` array written at the bottom
# parses clean and asserts nothing.

# The default cap, declared rather than observed. No recorded run for this arm
# survives, so the ceiling sits where the running narrative puts an uncalibrated
# one and comes down whenever a pass is measured. It stood at 45 against a cap of
# 30, where a truncated run reports 31, passes the turn assertion, and fails only
# what was going to fail anyway.
max_turns = 30

# The slug is pinned by the invocation rather than left to the run. `paths`
# matches an exact path, and a slug the model derives from the dump's wording
# would leave every assertion here naming a folder that may not exist. What the
# arm gives up is the slug derivation, which is one line of the body against the
# whole of the folder shape. The ordinal stays derivable: the seeded tree opens
# with neither `.canon/intake/` nor `.canon/groundwork/`, so the standard's
# highest-plus-one rule can only land on `01`.
paths = [".canon/intake/01-cli-cleanup/00-overview.md"]

# Two folders the pass must not open. Neither exists in the seeded tree, so each
# catches a run that answered the dump by planning it or by opening a track
# instead of filing it.
absent = [".canon/plans", ".canon/groundwork"]

write_scope = [".canon/intake/**"]

# The output names the folder and reports the routing split. `groundwork` is the
# load-bearing token, since the dump carries one item nobody can answer by
# reading the tree and a run that filed it as an ordinary finding reports no
# candidates at all.
reply = [".canon/intake/01-cli-cleanup/", "groundwork"]

manual = [
  "Every problem line carries a number or a file path measured this pass. Semantic: a count sits in prose and any pattern over it either pins one phrasing or matches any digit in the file.",
  "The stderr bullet, fourth in the dump, carries a settled verdict, since the seeded CLAUDE.md already states the policy it proposes. The console-write bullet beside it stays a live finding, because the code violates that policy in four places. Semantic: both verdicts are prose, and a run folding the two into one item is a judgment rather than a format error.",
  "The error item names the v01.0 board task it overlaps and still carries its own verdict. Semantic: `Overlaps:` is optional, so its absence reads the same as a correct run that judged the overlap immaterial.",
  "The color question carries an `Open:` line with a `Suggested:` pick beneath it. Semantic: which item the run judges to be the operator's call is a judgment, and pinning it to the color item asserts the judgment rather than the format.",
  "No `You:` slot is filled. Unwired: the run writes every slot empty on an open pass, so a filled one and a missing item are indistinguishable to a pattern that does not know how many items were filed.",
]

# The index frontmatter. `date` is the day the folder opened and it is the only
# date in the folder, so a run that dated each cluster file instead leaves this
# field missing.
[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^title: \S'

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^description: \S'

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^date: \d{4}-\d{2}-\d{2}$'

# The numbering, read through the index rather than through a directory listing.
# A cluster file carries a two-digit number and its domain, so the link the
# index writes proves both halves at once. `00` is excluded because the index
# linking itself would satisfy a looser pattern.
[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '\]\((?!00-)\d\d-[a-z][a-z0-9-]*\.md'
