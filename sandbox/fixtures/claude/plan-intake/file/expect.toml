purpose = "The file phase of /plan-intake writes a numbered intake folder with an index and cluster files, and opens no plan or groundwork track. The folder is gitignored in every target, so this arm is the only check of its shape."

# The cap is the default rather than observed, since a truncated run reports one past it and passes the turn assertion.
max_turns = 30

paths = [
  { path = ".canon/intake/01-cli-cleanup/00-overview.md", why = "The invocation pins the slug, since one the model derives from the dump's wording would leave every assertion naming a folder that may not exist. The ordinal stays derivable: the seeded tree has no intake or groundwork folder, so the highest-plus-one rule lands on 01." },
]

absent = [
  { path = ".canon/plans", why = "Answering the dump by planning it is the wrong turn. Neither folder exists in the seeded tree." },
  { path = ".canon/groundwork", why = "Opening a track instead of filing the dump is the other wrong turn." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Intake files land in the folder the pass opens." },
]

reply = [
  { text = ".canon/intake/01-cli-cleanup/", why = "The output names the folder." },
  { text = "groundwork", why = "The dump carries one item nobody can answer by reading the tree, and a run that filed it as an ordinary finding reports no groundwork candidates at all." },
]

manual = [
  "Every problem line carries a number or a file path measured this pass. Semantic: a count sits in prose and any pattern over it either pins one phrasing or matches any digit in the file.",
  "The stderr bullet, fourth in the dump, carries a settled verdict, since the seeded CLAUDE.md already states the policy it proposes. The console-write bullet beside it stays a live finding, because the code violates that policy in four places. Semantic: both verdicts are prose, and a run folding the two into one item is a judgment rather than a format error.",
  "The error item names the v01.0 board task it overlaps and still carries its own verdict. Semantic: `Overlaps:` is optional, so its absence reads the same as a correct run that judged the overlap immaterial.",
  "The color question carries an `Open:` line with a `Suggested:` pick beneath it. Semantic: which item the run judges to be the operator's call is a judgment, and pinning it to the color item asserts the judgment rather than the format.",
  "The trailing `--out` bullet, eighth and last in the dump, is filed as an item whose `Problem:` line quotes `building into dist`, reproduced by running `bun src/cli.ts build --out`. The argument-parser item still carries `not reproduced here`, since costing it takes builds. Semantic: which cluster file holds the `--out` item is the run's call, so a glob over the cluster files would pass or fail on the order the run named them.",
  "No `You:` slot is filled. Unwired: the run writes every slot empty on an open pass, so a filled one and a missing item are indistinguishable to a pattern that does not know how many items were filed.",
]

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^title: \S'
why = "The index frontmatter carries a title."

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^description: \S'
why = "The index frontmatter carries a description."

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '^date: \d{4}-\d{2}-\d{2}$'
why = "The date is the day the folder opened and the only one in it, so a run that dated each cluster file instead leaves this field missing."

[[content]]
path = ".canon/intake/01-cli-cleanup/00-overview.md"
pattern = '\]\((?!00-)\d\d-[a-z][a-z0-9-]*\.md'
why = "The numbering, read through the index. A cluster link carries a two-digit number and its domain, so it proves both halves. 00 is excluded because the index linking itself would satisfy a looser pattern."
