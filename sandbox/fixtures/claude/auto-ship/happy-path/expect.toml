purpose = "A run of /canon:auto-ship that reaches the ship step ends on the chain's completion line."

reply = [
  { text = "Autoshipped (draft)", why = "git-ship reaches this line only after the verify gate, both doc syncs, staging, the commit, the branch rename, and the pull request, with the draft mark before the CI watch. A chain halted at or before the ship step ends its reply elsewhere, so this is the one assertion every stop point in the chain would fail." },
]

manual = [
  "The pull request itself opened, and opened as a draft. Unwired: the sandbox tree and the reply text are what expect.toml can read, and confirming the PR object needs a gh call this declaration has no channel for.",
  "docs-sync, context-sync, and task-complete left the tree exactly where a run with no public docs and no owning task would leave it. Semantic: all three skills sync against what a session finds, and a project this small may give any of them nothing to change, so an assertion pinned to a specific edit would fail a correct run that found none to make.",
]
