purpose = "/canon:target-scaffold vite-react drives the whole chain: the scaffold verb, its post-scaffold step, the hand-off to target-setup, the second detect pass, and the deep verify. Every entry was written from the stack's manifest and the skills' bodies rather than read off a paid run, so the first proving run confirms or corrects each."

# The setup-only fresh arm cost 20 of 30 turns and this arm adds the scaffold, a second detect pass, and the deep verify. The default cap is the runner's ceiling, so the first run passes CANON_SKILL_TEST_MAX_TURNS above it and its count sets this value.
max_turns = 30

paths = [
  { path = "src/app.tsx", why = "Guards the scaffold overlay, which alone writes it once the prepare step removes the starter's src/App.tsx. The stylesheet pattern below cannot guard it, since a session can hand-add the import a skipped overlay left." },
  { path = ".claude/rules/canon/framework/react.md", why = "Proves the first detect pass ran." },
  { path = ".claude/rules/canon/framework/tailwind.md", why = "Guards the second detect pass. The first pass reads a bare Vite starter with no Tailwind evidence, so only a pass after the tooling sync installs this." },
  { path = ".claude/rules/canon/framework/shadcn.md", why = "Guards the second detect pass for the same reason." },
]

absent = [
  { path = "src/App.css", why = "Guards the scaffold post-step. The vite-react prepare step removes the demo the starter ships, so any of these surviving means it never ran. Git is not asserted, since the sandbox is already a repository before the skill starts and the scaffoldStack unit test owns that outcome." },
  { path = "src/assets", why = "The starter asset folder, removed by the same prepare step." },
  { path = "public/icons.svg", why = "The starter icon sheet, removed by the same prepare step." },
]

reply = [
  { text = "test:e2e", why = "Guards the deep verify. test:e2e and screenshot run only at the deep depth, and the report names each as passed, warned, or skipped, which a default depth summary alone does not." },
  { text = "screenshot", why = "Guards the deep verify for the same reason." },
]

manual = [
  "CLAUDE.md carries no `## Indexes` section, since target-setup dropped the convention seed step that pasted it. Semantic: `content` takes positive patterns only, and an absence has no pattern",
  "A deep failure warns and names the script rather than failing the scaffold. Semantic: a warning and a failure both name the script, and no fragment separates them",
  "A red run from a network failure in `bun create`, `bun install`, or the Playwright install is not a regression. Semantic: read the envelope's `result` before treating a failure as the chain's",
]

[[content]]
path = "src/index.css"
pattern = '''^@import\s+['"]tailwindcss['"]'''
why = "Guards the end state the Tailwind plugin needs, since an index.css with no import compiles no utility class. Whether the overlay wrote it is the src/app.tsx path above."
