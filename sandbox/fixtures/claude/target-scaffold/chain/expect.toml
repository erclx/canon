# What a correct `/canon:target-scaffold vite-react` run leaves behind on the
# `chain` arm. Read by `canon sandbox check`. Patterns use TOML literal strings
# so a regex needs no backslash escaping.
#
# The arm drives the whole chain: the scaffold verb, its post-scaffold step,
# the hand-off to target-setup, the second detect pass, and the deep verify.
# Every entry below was written from the stack's manifest and the skills'
# bodies rather than read off a run, since no run has been paid for yet. The
# first proving run confirms or corrects each one.

# The setup-only `fresh` arm cost 20 of 30 turns, and this arm adds the
# scaffold, a second detect pass, and the deep verify on top. The default cap
# is the runner's ceiling, so the first run passes CANON_SKILL_TEST_MAX_TURNS
# above it, and its turn count sets this value with headroom.
max_turns = 30

# Guards the second detect pass. The first pass reads a bare Vite starter,
# which carries no Tailwind or shadcn evidence, so only a pass after the
# tooling sync installs these two. `react.md` proves the first pass ran.
#
# `src/app.tsx` guards the scaffold overlay, which alone writes it once the
# prepare step removes the starter's `src/App.tsx`. The stylesheet pattern
# below cannot, since a session can hand-add the import a skipped overlay left.
paths = [
  "src/app.tsx",
  ".claude/rules/canon/framework/react.md",
  ".claude/rules/canon/framework/tailwind.md",
  ".claude/rules/canon/framework/shadcn.md",
]

# Guards the scaffold post-step. The vite-react `prepare` step removes the demo
# the starter ships, so any of these surviving means it never ran.
#
# Git is not asserted. The sandbox tree is already a repository before the
# skill starts, so `.git` exists whether or not the verb initialized one. The
# `scaffoldStack` unit test owns that outcome.
absent = ["src/App.css", "src/assets", "public/icons.svg"]

# Guards the deep verify. `test:e2e` and `screenshot` run only at the deep
# depth, and the report names each as passed, warned, or skipped. A default
# depth summary alone names neither.
reply = ["test:e2e", "screenshot"]

manual = [
  "CLAUDE.md carries no `## Indexes` section, since target-setup dropped the convention seed step that pasted it. Semantic: `content` takes positive patterns only, and an absence has no pattern",
  "A deep failure warns and names the script rather than failing the scaffold. Semantic: a warning and a failure both name the script, and no fragment separates them",
  "A red run from a network failure in `bun create`, `bun install`, or the Playwright install is not a regression. Semantic: read the envelope's `result` before treating a failure as the chain's",
]

# Guards the end state the Tailwind plugin needs, since `src/index.css` with no
# import compiles no utility class. Whether the overlay wrote it is the
# `src/app.tsx` path above.
[[content]]
path = "src/index.css"
pattern = '''^@import\s+['"]tailwindcss['"]'''
