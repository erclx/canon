purpose = "/task-create create allocates the next label through `canon tasks next-label` and writes one task file with its frontmatter, plan link, and open outcome. The skill writes the file itself from its tasks reference, so its frontmatter, body, and links are prose behavior with no unit test underneath."

max_turns = 30

paths = [
  { path = ".canon/tasks/v03.1-csv-export.md", why = "The label is the assertion, not the slug. The board carries v01.0 through v03.0 with no gaps, so next-label allocates v03.1, and a skill that guessed from a version file or the plan name lands somewhere else." },
  { path = ".canon/tasks/v01.0-rate-limit.md", why = "The three existing tasks are the control. A run that renumbered the board to fit its new entry, or rewrote a neighbor while reading it, goes red here rather than passing on the one file it was asked to write." },
  { path = ".canon/tasks/v02.0-pagination.md", why = "Control: the task is left as staged." },
  { path = ".canon/tasks/v03.0-search.md", why = "Control: the task is left as staged." },
]

write_scope = [
  { path = ".canon/tasks/**", why = "Create writes one file and the index hook rewrites another. Nothing else on this path has a reason to leave the board." },
]

reply = [
  { text = ".canon/tasks/v03.1-", why = "The Output block emits the full relative path from the project root, since a bare filename is not clickable. The fragment stops at the label so the assertion reads the part the board determines and leaves the slug free." },
]

manual = [
  "The proposed label is reported with the neighbors it sits between. Semantic: the sentence is prose and any pin over it goes red on a rewording.",
  "The board resolves at the main worktree root rather than at pwd. Unwired: a standalone sandbox repository has no linked worktree, so the two roots are the same path and no run can tell them apart.",
  "No `Pull request:` line is written at create time. Semantic: a negative, and an entry asserting what a run must not have written passes on every spelling that phrases it differently.",
]

# The apostrophes in the title pattern are spelled `.`, since a TOML literal string cannot carry one and a basic string would reintroduce the backslash doubling.
[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^title: .v03\.1: '
why = "The index walker fails the whole folder when title or description is missing, and the folder is gitignored, so nothing else catches it. The title is quoted because a leading vX.Y: reads as a key to a YAML parser."

[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^description: \S'
why = "The second frontmatter field the index walker requires."

[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^# v03\.1: '
why = "The heading carries the label."

[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^Plan: \[feature-csv-export\]\(\.\./plans/feature-csv-export\.md\)'
why = "The origin line is written relative to .canon/tasks/ rather than from the project root. A root-relative path still renders as a link and resolves to nothing in an editor rooted at the project, which no reader notices until they click it."

[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^- \[ \] Outcome: '
why = "An outcome, open. A task written with its outcomes already marked would archive on the next unattended sweep without the work ever happening."

[[content]]
path = ".canon/tasks/v03.1-csv-export.md"
pattern = '^> Test strategy: '
why = "The task states how its outcomes are tested."
