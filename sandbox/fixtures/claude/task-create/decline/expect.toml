purpose = "/task-create decline moves the named task to the declined folder with a Declined line and clears its ordering row. The arm asserts the successful move and the Declined line, not the refusal set, which `src/tasks/archive/` covers at the unit level."

max_turns = 30

paths = [
  { path = ".canon/tasks/declined/v01.0-csv-export.md", why = "The destination, not the source. A run that declined the wrong task, or neither, leaves the source where a paths entry over it would find it, so asserting the destination separates the two." },
  { path = ".canon/tasks/v02.0-pagination.md", why = "The control, which must not move." },
  { path = ".canon/tasks/priority.md", why = "Read by the content pin below, so a deleted file reports its own cause." },
]

absent = [
  { path = ".canon/tasks/v01.0-csv-export.md", why = "The source is gone." },
  { path = ".canon/tasks/declined/v02.0-pagination.md", why = "The control never moved. This catches a run that declined the control instead of the task it was given." },
]

write_scope = [
  { path = ".canon/tasks/**", why = "The task board and its index." },
]

reply = [
  { text = ".canon/tasks/declined/v01.0-csv-export.md", why = "The skill reports the paths the command returned, in full from the project root. The declined destination is the token worth pinning, since a reply naming only the stem reads the same whether the file moved or not." },
]

manual = [
  "The run reached the declined folder through `canon tasks decline` rather than moving the file by hand. Semantic: both leave the same tree, so no assertion over the tree separates them.",
]

[[content]]
path = ".canon/tasks/priority.md"
pattern = '^\| [\-]+ \| [\-]+ \|\n\| \[v02\.0 pagination\]\(v02\.0-pagination\.md\)'
why = "The cleared ordering row, asserted by what survives it, since an absent entry cannot express a removed table row and a negative pattern passes on every rewording. The fixture puts the declined row first, so a run that left it pushes the control's row down and the match fails."

[[content]]
path = ".canon/tasks/declined/v01.0-csv-export.md"
pattern = '^Declined: .+, .+ on \d{4}-\d{2}-\d{2}$'
why = "The move carried the file rather than creating an empty one, and the Declined line names both the reason and the decider. The path alone passes on a touched file with no reason recorded."

[[content]]
path = ".canon/tasks/declined/v01.0-csv-export.md"
pattern = '^- \[ \] Outcome: a CSV download carries every task'
why = "Decline carries no outcome-state gate, so the task moves with its outcomes as open as staged. A run that closed them to get past a gate that does not exist would still pass every assertion above."

[[content]]
path = ".canon/tasks/v02.0-pagination.md"
pattern = '^- \[ \] Outcome: a list request accepts a page size and an offset'
why = "The control's outcomes stay open too. Asserting only the declined task's state would pass a run that closed outcomes on both files by habit."
