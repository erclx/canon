purpose = "The file phase of /issue-triage writes an overview and numbered cluster files under a fresh intake folder, names the skipped issue with its carrier, and plans nothing."

max_turns = 40

paths = [
  { path = ".canon/intake/01-triage-fixture-triage/00-overview.md", why = "The seeded tree opens with no intake folder, so the claimed ordinal can only be 01, and the label the arm passes fixes the slug." },
]

absent = [
  { path = ".canon/plans", why = "The skill plans and files nothing else, so a plan means it started building." },
]

write_scope = [
  { path = ".canon/intake/**", why = "Intake files land in the folder the pass opens." },
]

reply = [
  { text = ".canon/intake/01-triage-fixture-triage/", why = "The reply names the folder it wrote." },
]

manual = [
  "Issue A is suggested plan and never fix, since a stale reference is a size. Semantic: which cluster file holds the item is the run's call, so a negative pattern cannot anchor it to its row.",
  "Issue B is named as skipped with its carrier, the retry task. Semantic: the overview's wording of the carrier is the run's call beyond the `v01.0` token.",
  "Every problem line carries a count, a path, or a commit measured this pass. Semantic: any digit in the file would satisfy a pattern.",
  "No `You:` slot is filled. Unwired: `canon intake list 01-triage-fixture-triage --unread --json` reports one unread item when it holds.",
]

[[content]]
path = ".canon/intake/01-triage-fixture-triage/00-overview.md"
pattern = 'v01\.0'
why = "The skipped issue is named with its carrier, the task the arm wrote."

[[content]]
path = ".canon/intake/01-triage-fixture-triage/00-overview.md"
pattern = '[1-9]\d* plan'
why = "The overview counts by token and Issue A is the one item filed, so a nonzero plan count shows its suggestion opened with plan. The reply cannot show it, since the skill's own output prints the token."

[[content]]
path = ".canon/intake/01-triage-fixture-triage/00-overview.md"
pattern = '\]\((?!00-)\d\d-[a-z][a-z0-9-]*\.md'
why = "The index links a numbered cluster file, which proves the numbering and the domain half of each filename together."
