purpose = "/canon:session-map writes a conforming map that reports what each step returned rather than what the session predicted it would. The content blocks read what the map says each step answered, since a map written from a prediction reads as conforming and passes an assertion over the artifact alone."

# This arm resolves several reads against a standard it fetches at run time and its turn count moves with how a run orders them, so the runner default stands. Two passing runs cost 22 turns and 15, a floor on what a correct run costs rather than a bound.
max_turns = 30

paths = [
  { path = ".canon/tasks/session-csv-export.md", why = "The filename is the first assertion. The branch is feat/csv-export, so the slug transform drops the type segment, and a run that kept it lands beside this name rather than on it." },
  { path = ".canon/tasks/v01.0-rate-limit.md", why = "The board is the control. A handoff writes one file and has no reason to touch a task." },
  { path = ".canon/tasks/v02.0-pagination.md", why = "Control: the task is left as staged." },
  { path = ".canon/tasks/v03.0-csv-export.md", why = "Control: the task is left as staged." },
  { path = ".canon/plans/feature-csv-export.md", why = "Control: the plan is left as staged." },
]

absent = [
  { path = ".canon/tasks/session-feat-csv-export.md", why = "The type-carrying spelling, which is what a broken transform writes. A path negative fails on the file existing rather than on how a sentence was worded." },
]

write_scope = [
  { path = ".canon/tasks/**", why = "The map, plus the index a Write fires the board hook on." },
]

reply = [
  { text = ".canon/tasks/session-csv-export.md", why = "The path comes off the skill's own Output block. The fixture fixes the branch, so this reads back off provisioning rather than off how one run worded a line." },
  { text = "of 350 words", why = "The cap closes the Output block, and a run reaches it only by running the length check, since the count beside it moves with what the run wrote. It reads this only on a CLI carrying the sessions kind, and an older one refuses the kind, so the entry fails there for the CLI and not for the map." },
]

manual = [
  "The map reports what each step actually returned rather than what the session expected it to. Semantic: a prediction and a result read alike in the written text, so the blocks below catch a map silent about a step and not a map that guessed.",
  "No fourth section over the core three. Semantic: a negative, and an entry asserting what a run must not have written passes on every spelling that phrases it differently.",
  "The three core sections appear in the order the standard fixes. Semantic: their bodies are free prose, so no single block spans two headings without pinning what a writer puts between them.",
  "The map says which of the two commits the ref came from, the window having found none before it. Judgment: item 3 requires the writer to say which, never to echo the wording item 3 states it in, so a map reading that the ref is the only commit the repository holds satisfies the rule and fails any pin over the phrase. The fixture fixes no token here, since its one commit carries a hash that moves per run.",
]

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '^title: Session map$'
why = "The title is the same string on every map, so a generated catalog reads them alike."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '^description: \S'
why = "The description is what the board cannot show plus the date."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '^## State$'
why = "A map missing any of the three core sections is non-conforming whatever else it carries, and every session fills all three."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '^## Mistakes worth not repeating$'
why = "The second core section."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '^## Standing cautions$'
why = "The third core section."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = 'shipped skill corpus'
why = "The fixture carries no claude/skills/ corpus, so the drift verb refuses with a sentence it owns, and a map recording the refusal quotes it. A session predicting a refusal reaches for other wording, so only a run produces this one."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = 'export\.ts'
why = "State owes the reader any untracked file that needs committing, and the fixture leaves exactly one. A map filled from what the session already knew rather than from a read of the tree misses it."

[[content]]
path = ".canon/tasks/session-csv-export.md"
pattern = '3000'
why = "The mistake the prompt states. The port appears nowhere in the fixture tree, so a map filled from git alone cannot carry it, and one that recorded the prompt's reasoning does."
