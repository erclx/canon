# Skills a sandbox run cannot assert, each with the reason it cannot.
#
# `canon sandbox coverage --skills` reads each table, keyed by skill, and fails one with no `reason`.
# A reason is a harness capability limit, or a skill that produces no artifact to assert over.

[canon-cli]
reason = "Reference only. Its body forbids running the commands it describes, so a correct run produces no artifact to assert over."

[systematic-debugging]
reason = "Gates how other work proceeds and writes nothing of its own. What it changes is the shape of a later skill's run, which no path assertion over this skill can see."

[session-resume]
reason = "Reads tracked work and context and writes nothing. A run leaves the tree byte-identical, so every mechanical assertion would pass on a session that did nothing."

[canon-feedback]
reason = "Opens an issue on the toolkit repository rather than touching the project it runs in. canon sandbox run reports that as an escape and cannot assert its content, since the path is outside the tree the snapshot covers."

[teach-craft]
reason = "Carries teaching judgment and writes no artifact of its own. A lesson lands wherever the session already writes, so there is nothing to assert over."

[markdown-craft]
reason = "Carries rules that `canon markdown audit` already asserts mechanically, so an arm would assert the audit twice."
