# Skills a sandbox run cannot assert, each with the reason it cannot.
#
# `canon sandbox coverage --skills` reads this. An entry here is a claim that no
# arm should be written, so it needs a reason a later reader can check and
# overturn. A skill left out of this file reports `should-be-asserted`, which is
# the honest default.
#
# A table carrying no reason is an error rather than a skipped entry, and so is
# a file that does not parse. A dropped exemption is invisible in the counts:
# the skill rejoins the work queue someone already ruled it out of, with nothing
# naming the entry that stopped counting.
#
# The reason cannot live in the arm's `manual` array. `resolveVerdict` fails any
# `expect.toml` declaring zero mechanical assertions, so a declaration holding
# only an exempt reason goes red the moment it is written.
#
# Two kinds of reason belong here and nothing else does:
#
#   - A harness capability limit, where the checker cannot reach the effect.
#   - A skill that produces no artifact, so there is nothing to assert over.
#
# "Nobody has written one yet" is not a reason. That is `should-be-asserted`,
# which is a default rather than a queue. Which of those skills earns an arm is
# decided by the blast-radius rule under `## What earns a declaration` in
# `canon/context/sandbox/coverage/overview.md`, and this file is the other half of that split:
# the rule says what to write, an entry here says what never will be.

[canon-cli]
reason = "Reference only. Its body forbids running the commands it describes, so a correct run produces no artifact to assert over."

[systematic-debugging]
reason = "Gates how other work proceeds and writes nothing of its own. What it changes is the shape of a later skill's run, which no path assertion over this skill can see."

[session-resume]
reason = "Reads tracked work and context and writes nothing. A run leaves the tree byte-identical, so every mechanical assertion would pass on a session that did nothing."

[canon-feedback]
reason = "Opens an issue on the toolkit repository, or writes into the toolkit's own .canon/feedback/ on a failed call, rather than touching the project it runs in. run.sh reports that as an escape and cannot assert its content, since the path is outside the tree the snapshot covers."
