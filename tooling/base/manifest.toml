[stack]
name = "base"
extends = ""
runtime = "bun"
scaffold = ""

[sync]
source = "configs"
per_root = ["scripts/verify.ts", "scripts/verify.json"]

[dependencies.dev]
packages = [
    "prettier",
    "husky",
    "@commitlint/cli",
    "@commitlint/config-conventional",
]

[scripts]
"check:format" = "prettier --check --log-level warn --ignore-path .gitignore --ignore-path .prettierignore ."
"format" = "prettier --write --log-level warn --ignore-path .gitignore --ignore-path .prettierignore ."
"prepare" = "husky"

[scripts.override]
"check" = "bun scripts/verify.ts"

[gitignore]
"# System" = [".DS_Store"]
"# Dependencies" = ["node_modules/"]
"# Secrets" = [".env", ".env.*", "*.local", "!.env.example"]
"# VSCode" = [".vscode/"]
