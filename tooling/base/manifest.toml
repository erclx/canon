[stack]
name = "base"
extends = ""
runtime = "bun"
scaffold = ""

[sync]
source = "configs"
per_root = ["scripts/verify.ts", "scripts/verify.json"]

[dependencies.dev]
packages = [
  "oxfmt@0.72.0",
  "husky",
  "@commitlint/cli",
  "@commitlint/config-conventional",
]

[scripts]
"prepare" = "husky"

[scripts.override]
"check" = "bun scripts/verify.ts"
"check:format" = "oxfmt --check ."
"format" = "oxfmt ."

[gitignore]
"# System" = [".DS_Store"]
"# Dependencies" = ["node_modules/"]
"# Secrets" = [".env", ".env.*", "*.local", "!.env.example"]
"# VSCode" = [".vscode/"]
