[stack]
name = "astro"
extends = "web"
runtime = "bun"
scaffold = "bun create astro@latest {{name}} -- --template minimal --typescript strict --no-install --no-git --skip-houston --yes"

[dependencies.dev]
packages = [
  "astro",
  "@astrojs/react",
  "@astrojs/check",
  "eslint@^9",
  "@eslint/js",
  "typescript-eslint",
  "eslint-config-prettier",
  "eslint-plugin-react-hooks",
  "eslint-plugin-vitest",
  "globals",
  "eslint-plugin-astro",
  "astro-eslint-parser",
  "prettier",
  "prettier-plugin-astro",
  "prettier-plugin-tailwindcss",
]

[scripts]
"dev" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && astro dev"
"build" = "astro check && astro build"
"preview" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && astro preview"
"astro" = "astro"
"typecheck" = "astro check"
"card:dev" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && astro dev --config card.config.mjs"
"card:check" = "bash scripts/check-card-exclusion.sh"

[scripts.override]
"lint" = "eslint . --max-warnings 0"
"lint:fix" = "eslint . --fix --max-warnings 0"
"check:format" = "oxfmt --check . && prettier --check --log-level warn '**/*.astro'"
"format" = "oxfmt . && prettier --write --log-level warn '**/*.astro'"
"screenshot" = "PREVIEW_PORT=$(bash scripts/worktree-port.sh 4321) && export PREVIEW_PORT && bash scripts/screenshot.sh"
"readme-screenshot" = "PREVIEW_PORT=$(bash scripts/worktree-port.sh 4321) && export PREVIEW_PORT && bash scripts/readme-screenshot.sh"
"dev" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && astro dev"
"preview" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && astro preview"

[gitignore]
"# Astro" = [".astro/"]
"# Social card" = ["card-dist/"]

[verify]
# The scaffold's page writes its own head, so it is pointed at the synced
# site-head component, and the grep stops the run here if a template change
# left the rewrite unmatched rather than at the head tag check later.
prepare = '''bunx astro add react --yes && perl -0pi -e 's|---\n---|---\nimport SiteHead from "\@/components/site-head.astro"\n---|; s|<title>Astro</title>|<SiteHead />|' src/pages/index.astro && grep -q '<SiteHead />' src/pages/index.astro'''
