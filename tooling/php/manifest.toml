[stack]
name = "php"
extends = "base"
runtime = "composer"
scaffold = "mkdir {{name}} && cd {{name}} && composer init -n --name example/{{name}} --autoload src/"

[scripts]
"lint" = "vendor/bin/php-cs-fixer check --diff"
"lint:fix" = "vendor/bin/php-cs-fixer fix"
"typecheck" = "vendor/bin/phpstan analyse --no-progress"
"test" = "vendor/bin/phpunit"
"test:run" = "vendor/bin/phpunit --testdox"

[gitignore]
"# PHP" = ["vendor/", ".php-cs-fixer.cache", ".phpunit.cache/", ".phpunit.result.cache"]
