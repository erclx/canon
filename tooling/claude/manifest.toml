# Consumed only by `canon claude init`. Claude is not a discoverable tooling stack
# and is excluded from `canon tooling` discovery via `EXCLUDED_STACKS` in src/tooling/manifest.ts.

[stack]
name = "claude"
extends = ""
runtime = ""
scaffold = ""

# Checked against this repository's own `.gitignore` by the Ignore parity stage.
# One root entry covers every record folder, and `.claude/worktrees/` is the carve-out.
[gitignore]
"# Claude" = [".canon/", ".claude/worktrees/"]
