[stack]
name = "python"
extends = "base"
runtime = "uv"
scaffold = "uv init --package {{name}}"

[scripts]
"lint" = "uv run ruff check . && uv run ruff format --check ."
"lint:fix" = "uv run ruff check --fix . && uv run ruff format ."
"typecheck" = "uv run mypy ."
"test" = "uv run pytest"
"test:run" = "uv run pytest -v"
"test:cov" = "uv run pytest --cov --cov-report=term-missing --cov-report=html"

[gitignore]
"# Python" = [
  ".pytest_cache/",
  ".mypy_cache/",
  ".ruff_cache/",
  ".coverage_cache/",
]

[scaffold]
# --no-sync locks without building .venv, whose scripts would carry the scratch
# folder's absolute path after the scaffold moves them, so the first uv run
# builds it at the target.
prepare = "bun init -y && uv add --dev --no-sync ruff mypy pytest pytest-cov"
