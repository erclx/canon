[stack]
name = "go"
extends = "base"
runtime = "go"
scaffold = "mkdir {{name}} && cd {{name}} && go mod init example.com/{{name}} && go mod edit -ignore=./node_modules"

[scripts]
"lint" = "golangci-lint run ./..."
"lint:fix" = "golangci-lint fmt ./... && golangci-lint run --fix ./..."
"typecheck" = "go vet ./..."
"test" = "go test ./..."
"test:run" = "go test -v ./..."
"build" = "go build ./..."

[verify]
prepare = "bun init -y && (command -v golangci-lint >/dev/null || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest)"
