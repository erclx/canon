version: '2'

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - rowserrcheck
    - unconvert
  exclusions:
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - node_modules
