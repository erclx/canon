[stack]
name = "web"
extends = "base"
runtime = "bun"
scaffold = ""

[dependencies.dev]
packages = [
  "eslint@^9",
  "eslint-config-prettier",
  "eslint-plugin-check-file",
  "eslint-plugin-react-hooks",
  "eslint-plugin-react-refresh",
  "eslint-plugin-simple-import-sort",
  "eslint-plugin-vitest",
  "globals",
  "typescript-eslint",
  "@eslint/js",
  "typescript@^6",
  "react",
  "react-dom",
  "@types/react",
  "@types/react-dom",
  "@types/node",
  "vitest@^3",
  "@vitest/coverage-v8@^3",
  "@vitest/ui@^3",
  "jsdom",
  "@testing-library/react",
  "@testing-library/jest-dom",
  "@testing-library/user-event",
  "@playwright/test",
  "tailwindcss",
  "@tailwindcss/vite",
  "prettier-plugin-tailwindcss",
]

[scripts]
"lint" = "eslint . --max-warnings 0"
"lint:fix" = "eslint . --fix --max-warnings 0"
"test" = "vitest"
"test:run" = "vitest run --reporter=verbose"
"test:ui" = "vitest --ui"
"test:coverage" = "vitest run --coverage"
"test:e2e" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && playwright test"
"test:e2e:changed" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && playwright test --only-changed"
"test:e2e:ui" = "WORKTREE_PORT_OFFSET=$(bash scripts/worktree-port.sh) && export WORKTREE_PORT_OFFSET && playwright test --ui"
"test:e2e:report" = "playwright show-report"
"check:full" = "./scripts/verify.sh && bun run test:e2e"
"smoke:prod" = "bun e2e/screenshot.ts --check-console-clean --require-base-url"

[scripts.override]
"lint" = "eslint . --max-warnings 0"
"screenshot" = "PREVIEW_PORT=$(bash scripts/worktree-port.sh 4173) && export PREVIEW_PORT && bash scripts/screenshot.sh"
"readme-screenshot" = "PREVIEW_PORT=$(bash scripts/worktree-port.sh 4173) && export PREVIEW_PORT && bash scripts/readme-screenshot.sh"

[gitignore]
"# Build" = ["dist/"]
"# Coverage" = ["coverage/"]
"# Playwright" = ["test-results/", "playwright-report/", "blob-report/", "playwright/.cache/"]
"# Screenshots" = ["screenshots/"]
"# VSCode" = [".vscode/*", "!.vscode/extensions.json", "!.vscode/settings.json"]
