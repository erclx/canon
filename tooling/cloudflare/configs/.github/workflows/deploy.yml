name: Deploy
# canon-no-seed: a stack-specific deploy workflow with no root counterpart by design, parameterized per project on sync rather than mirrored from one.

on:
  push:
    branches:
      - main
    paths:
      # Fill in this project's own build inputs. A single glob covering the
      # source tree is enough for most projects; widen it to cover every
      # path the build reads when it draws on content living elsewhere.
      - 'src/**'
  workflow_dispatch:
  # A closed pull request runs only the cleanup job below, which deletes the
  # preview deployments `canon pr preview` minted for its branch.
  pull_request:
    types: [closed]

# Fill in a concurrency group name unique to this project.
# A running deploy finishes so a half-uploaded site is never live.
# The group is keyed on the ref, so a branch preview never displaces a production deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The Worker workflow reads the same script, so exactly one of the two
  # deploys a given config, and a config declaring both deploys nowhere.
  gate:
    name: 🔎 Read the Wrangler config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages: ${{ steps.shape.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}

      - name: Read the Wrangler config
        id: shape
        run: |
          shape=$(bash scripts/wrangler-shape.sh | sed -n 's/^shape=//p')
          case "$shape" in
          worker)
            echo "::notice::The Wrangler config declares a Worker entry, so the Worker workflow deploys this project and this one skips."
            echo "pages=false" >> "$GITHUB_OUTPUT"
            ;;
          both)
            echo "::notice::The Wrangler config declares both main and pages_build_output_dir, so neither deploy workflow runs. Keep the one this project deploys as."
            echo "pages=false" >> "$GITHUB_OUTPUT"
            ;;
          *) echo "pages=true" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: 📦 Build
    needs: gate
    if: github.event_name != 'pull_request' && needs.gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare secrets
        id: secrets-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.secrets-check.outputs.skip == 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, skipping deploy. Run the deploy-app skill to finish setup."

      # This job builds nothing and still needs bun, which wrangler-action
      # picks from bun.lock. Dropping these steps fails every deploy.
      - name: Checkout
        if: steps.secrets-check.outputs.skip == 'false'
        uses: actions/checkout@v7

      - name: Setup Bun
        if: steps.secrets-check.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download artifact
        if: steps.secrets-check.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # `pages-deployment-alias-url` is an output from wrangler 3.78 on, so the
      # version is pinned rather than left to the action's default.
      - name: Publish
        id: publish
        if: steps.secrets-check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.90.0'
          # Fill in this project's Pages project name, set when the
          # deploy-app skill runs wrangler pages project create.
          command: pages deploy dist --project-name=REPLACE_WITH_PROJECT_NAME --branch=${{ github.ref_name }}

      # `canon pr preview` reads this marker out of the run log. The alias comes
      # off the deploy, since Cloudflare may truncate a branch name.
      - name: Report preview alias
        if: steps.publish.outputs.pages-deployment-alias-url != ''
        env:
          ALIAS_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
        run: |
          echo "canon-preview-alias: $ALIAS_URL"
          echo "Preview: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    name: 🧹 Delete Branch Previews
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch, since a closed pull request may have no merge ref to
      # check out, and the script that holds the Cloudflare token should not
      # come from the branch being closed.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        # Fill in the same Pages project name the Publish step deploys to.
        run: bash scripts/delete-previews.sh REPLACE_WITH_PROJECT_NAME "$BRANCH"
