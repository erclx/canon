      :root {
        --ground: #0f0e0c;
        --panel: #151412;

        --line: #2a2926;
        --ink: #d9d7d4;

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;

      }
