  <script>
    const tl = gsap.timeline({ paused: true });
    // The build, written at its first pace and played 1.3 times slower so each line has time to read.
    const build = gsap.timeline();
    const blurIn = { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out" };
    const hidden = { opacity: 0, filter: "blur(6px)" };
    const lineIn = { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "power2.out" };
    const lineOut = { clipPath: "inset(0 100% 0 0)" };
    const panelIn = { clipPath: "inset(0 0 0% 0 round 24px)", duration: 0.5, ease: "expo.out" };
    const panelOut = { clipPath: "inset(0 0 100% 0 round 24px)" };

    // Title, the whole line blurring in at once.
    build.fromTo("#dp-title h1, #dp-title p", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.05);

    // The operator's message lands, then the agent view prints with the orchestrator pinned.
    build.fromTo("#dp-ask", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.3);
    build.fromTo("#dp-view", panelOut, panelIn, 0.5);
    build.fromTo("#dp-r1", lineOut, lineIn, 0.9);

    // The orchestrator answers, then the sessions it launched print one by one.
    build.fromTo("#dp-reply", lineOut, { ...lineIn, duration: 0.5 }, 1.2);
    ["#dp-r2", "#dp-r3", "#dp-r4"].forEach((id, i) => {
      build.fromTo(id, lineOut, lineIn, 1.7 + i * 0.25);
    });

    build.timeScale(1 / 1.3);
    tl.add(build, 0);

    // The agent view re-sorts as sessions change, the way the real one does. The first worker
    // starts editing and climbs above the planner, then the planner, its plans linked, sinks below the second worker.
    const move = { duration: 0.5, ease: "power3.inOut" };
    tl.to("#dp-r3", { y: -84, ...move }, 4.0);
    tl.to("#dp-r2", { y: 84, ...move }, 4.0);
    tl.fromTo("#dp-s3a", { opacity: 1 }, { opacity: 0, duration: 0.15 }, 4.1);
    tl.fromTo("#dp-s3b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.2);
    tl.to("#dp-r4", { y: -84, ...move }, 5.0);
    tl.to("#dp-r2", { y: 168, ...move }, 5.0);

    // The orchestrator keeps a pinned marker once the pip moves on to the first worker.
    tl.fromTo("#dp-pinned", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 6.05);

    // Blur swap out, so the pip is the one thing that carries into the build.
    tl.to(
      ["#dp-title h1", "#dp-title p", "#dp-ask", "#dp-reply", "#dp-view"],
      { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" },
      7.4,
    );

    window.__timelines["dispatch"] = tl;
