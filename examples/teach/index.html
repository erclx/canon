<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learning workspaces</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='10 10 80 80'%3E%3Cpath d='M34,20 L15,28 L15,72 L34,80 Z M66,20 L85,28 L85,72 L66,80 Z' fill='rgb(224,114,75)' /%3E%3Crect x='44' y='15' width='12' height='70' rx='2' fill='rgb(224,114,75)' /%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="course.css" />
  </head>
  <body>
    <header class="bar">
      <div class="mast">
        <span class="mast-left"
          ><span class="crumb-item"
            ><span class="crumb crumb-here">Workspaces</span>
            <details class="jump" name="mast">
              <summary aria-label="Open a workspace">
                <svg
                  class="caret"
                  width="9"
                  height="9"
                  viewBox="0 0 10 10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  aria-hidden="true"
                >
                  <path d="M2 4l3 3 3-3" />
                </svg>
              </summary>
              <ul class="jump-list">
                <li>
                  <a href="00-fixture/index.html"
                    ><span class="n">00</span><span>Fixture</span
                    ><span class="dot done"></span
                  ></a>
                </li>
              </ul></details></span
        ></span>
        <span class="mast-right"
          ><button
            class="theme"
            type="button"
            aria-label="Switch between light and dark"
          >
            <svg
              class="sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              /></svg
            ><svg
              class="moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg></button
        ></span>
      </div>
      <div class="track" role="presentation"><i class="done"></i></div>
    </header>
    <main class="wide-body">
      <h1>Learning workspaces</h1>
      <p class="lede">
        One folder per subject. Each carries its own mission, sources, glossary,
        and lessons.
      </p>

      <ul class="toc">
        <li>
          <a href="00-fixture/index.html"
            ><span class="num">00</span><b>Fixture</b
            ><span class="state done">Live</span
            ><span class="blurb"
              >2 lesson(s) &middot; 0 reference page(s) &middot; 0 term(s)</span
            ></a
          >
        </li>
      </ul>
    </main>
    <script>
      ;(function () {
        var r = document.documentElement
        try {
          var s = localStorage.getItem('course-theme')
          if (s) r.dataset.theme = s
        } catch (e) {}
        document.addEventListener('click', function (e) {
          var b = e.target.closest('.theme')
          if (!b) return
          var d =
            r.dataset.theme === 'dark' ||
            (!r.dataset.theme &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          r.dataset.theme = d ? 'light' : 'dark'
          try {
            localStorage.setItem('course-theme', r.dataset.theme)
          } catch (e) {}
        })
      })()
    </script>
    <script>
      ;(function () {
        function close(except) {
          document.querySelectorAll('details.jump[open]').forEach(function (d) {
            if (d !== except) d.open = false
          })
        }
        document.addEventListener('click', function (e) {
          var inside = e.target.closest('details.jump')
          close(inside)
        })
        document.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return
          var open = document.querySelector('details.jump[open]')
          if (!open) return
          open.open = false
          var s = open.querySelector('summary')
          if (s) s.focus()
        })
      })()
    </script>
    <script>
      ;(function () {
        var hs = Array.prototype.slice.call(
          document.querySelectorAll('main h2'),
        )
        if (hs.length < 3) return
        var nav = document.createElement('nav')
        nav.className = 'outline'
        nav.innerHTML =
          '<button class="to-top" type="button">On this page</button>'
        nav.querySelector('.to-top').addEventListener('click', function () {
          scrollTo({ top: 0, behavior: 'smooth' })
        })
        hs.forEach(function (h, i) {
          if (!h.id) h.id = 's' + i
          var a = document.createElement('a')
          a.href = '#' + h.id
          a.textContent = h.textContent.trim()
          nav.appendChild(a)
        })
        document.body.appendChild(nav)
        var links = Array.prototype.slice.call(nav.querySelectorAll('a'))

        function mark(i) {
          links.forEach(function (l, j) {
            l.classList.toggle('on', j === i)
          })
        }

        function focusLine() {
          var max = document.documentElement.scrollHeight - innerHeight
          if (max <= 0) return innerHeight
          var progress = Math.min(1, Math.max(0, scrollY / max))
          return 120 + progress * Math.max(0, innerHeight - 120)
        }

        function sync() {
          var best = 0
          var line = focusLine()
          for (var i = 0; i < hs.length; i++) {
            if (hs[i].getBoundingClientRect().top <= line) best = i
          }
          mark(best)
        }

        links.forEach(function (l, i) {
          l.addEventListener('click', function () {
            mark(i)
          })
        })

        addEventListener('scroll', sync, { passive: true })
        addEventListener('resize', sync)
        sync()
      })()
    </script>
  </body>
</html>
