# Evidence that proposes an opt-in rule, one table per rule basename.
# `deps`: package names read from manifests at the root and to depth two.
# `files`: globs over git-listed paths and folders to depth two, plus disk for a glob with no wildcard.

["skill"]
deps = []
files = [".claude/skills", "claude/skills"]

["rule"]
deps = []
files = [".claude/rules/project"]

["ci-workflow"]
deps = []
files = [".github/workflows"]

["dependencies"]
deps = []
files = [
  "**/package.json",
  "**/pyproject.toml",
  "**/go.mod",
  "**/composer.json",
]

["config-comments"]
deps = []
files = [".editorconfig", "**/Dockerfile*", "**/*.config.*", "**/.env.example"]

["code-comments"]
deps = []
files = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.sh", "**/*.py"]

["go"]
deps = []
files = ["**/go.mod"]

["php"]
deps = []
files = ["**/composer.json"]

["react"]
deps = ["react"]
files = []

["astro"]
deps = ["astro"]
files = ["**/astro.config.*"]

["fastapi"]
deps = ["fastapi"]
files = []

["nextjs"]
deps = ["next"]
files = ["**/next.config.*"]

["tailwind"]
deps = ["tailwindcss", "@tailwindcss/vite", "@tailwindcss/postcss"]
files = ["**/tailwind.config.*"]

["shadcn"]
deps = []
files = ["**/components.json"]

["e2e-reliability"]
deps = ["@playwright/test", "playwright", "cypress"]
files = ["**/e2e"]

["test-scope"]
deps = ["@playwright/test", "playwright", "cypress"]
files = ["**/e2e"]

["zod"]
deps = ["zod"]
files = []

["tanstack-query"]
deps = [
  "@tanstack/react-query",
  "@tanstack/vue-query",
  "@tanstack/solid-query",
  "@tanstack/svelte-query",
  "@tanstack/query-core",
]
files = []

["testing-go"]
deps = []
files = ["**/go.mod"]

["testing-php"]
deps = ["phpunit/phpunit", "pestphp/pest"]
files = ["**/phpunit.xml", "**/phpunit.xml.dist"]

["pydantic"]
deps = ["pydantic"]
files = []

["security-web"]
deps = ["react", "vue", "svelte", "astro", "next", "solid-js", "preact"]
files = ["index.html", "*/index.html"]

["security-server"]
deps = [
  "express",
  "fastify",
  "hono",
  "koa",
  "elysia",
  "@nestjs/core",
  "fastapi",
  "django",
  "flask",
  "starlette",
  "laravel/framework",
  "symfony/http-kernel",
  "slim/slim",
  "github.com/gin-gonic/gin",
  "github.com/labstack/echo/v4",
  "github.com/go-chi/chi/v5",
  "github.com/gofiber/fiber/v2",
]
files = []

["database"]
deps = [
  "prisma",
  "@prisma/client",
  "drizzle-orm",
  "typeorm",
  "sequelize",
  "knex",
  "kysely",
  "mongoose",
  "pg",
  "mysql2",
  "better-sqlite3",
  "sqlalchemy",
  "alembic",
  "psycopg",
  "psycopg2",
  "psycopg2-binary",
  "asyncpg",
  "django",
  "doctrine/orm",
  "illuminate/database",
  "gorm.io/gorm",
  "github.com/jackc/pgx/v5",
]
files = ["**/migrations", "**/schema.prisma", "**/*.sql"]

["craft"]
deps = ["react", "vue", "svelte", "astro", "next", "solid-js", "preact"]
files = ["canon/DESIGN.md", "index.html", "*/index.html"]

["design-reference"]
deps = []
files = ["canon/design/*/"]
