# Rule renames a sync carries a target across. Each key under [renamed] is an
# old rule basename and its value the basename the same rule ships under now,
# so `canon gov sync` replaces a held old file with the rule under its new name
# rather than only deleting it.
#
# An entry declares one-to-one identity and nothing else. A fold of several
# rules into one, or a split of one into several, is a retirement plus an
# addition and takes no entry here. Add the entry in the same change as the
# rename or renumber. Prune an entry only once its target rule is retired and
# the retire path covers it, since a chain ending on a rule nothing ships
# resolves to nothing and a sync deletes the held file instead. Otherwise leave
# it: a target can sit any number of releases behind, and a chain A to B to C
# resolves A only while both links stay. A key must name no live rule and every
# chain must end on one, which `src/gov/renames.test.ts` checks against this
# file.
[renamed]
"015-output" = "566-output"
"035-tasks" = "602-tasks"
"055-scratch" = "604-scratch"
"085-worktrees" = "605-worktrees"
"087-git" = "606-git"
"510-context" = "610-context"
"511-indexes" = "611-indexes"
"555-tasks" = "655-tasks"
"558-plan" = "658-plan"
"501-markdown" = "801-markdown"
"075-dependencies" = "775-dependencies"
"080-config-comments" = "780-config-comments"
"090-code-comments" = "790-code-comments"
"658-plan" = "plan"
"610-context" = "context"
"655-tasks" = "tasks"
"570-skill" = "skill"
"801-markdown" = "markdown"
