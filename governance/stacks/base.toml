extends = ""
# Four audience groups whole. Every rule authored under them ships to a base
# consumer, so adding one is a single edit rather than a file and a name here.
# `canon` carries the toolkit workflow and canonical-doc rules, `claude` the
# session conduct and `.claude/` authoring rules, `tooling` the dev setup and
# CI workflow rules, and `writing` the prose and document-shape rules. The
# `code` group is left to the stacks that write code, so a docs or writing
# project loads no rule it can never apply. `standards` holds one rule per
# standard routing its paths to it, generated by `canon gov regen` from each
# standard's frontmatter rather than authored.
rules = ["canon", "claude", "standards", "tooling", "writing"]
